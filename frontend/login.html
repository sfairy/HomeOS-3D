<!doctype html>
<html lang="zh-CN">
  <head>
    <meta name="homeos-release" content="b8b761498e26327c91fefcb50cbaaa0b" />
    <meta charset="utf-8" />
    <script src="/static/client-log.js?v=20260915211726"></script>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#172029" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HomeOS" />
    <title>登录 · HomeOS</title>
    <link rel="icon" href="/static/homeos-favicon-h5.ico?v=20260915211726" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/static/homeos-favicon-h5.svg?v=20260915211726" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/homeos-icon-180-h5.png?v=20260915211726" sizes="180x180" />
    <link rel="apple-touch-icon-precomposed" href="/static/homeos-icon-180-h5.png?v=20260915211726" sizes="180x180" />
    <link rel="manifest" href="/static/manifest-h5.webmanifest?v=20260915211726" />
    <link
      rel="stylesheet"
      href="/static/auth.css?v=20260915211726"
    />
  </head>
  <body>
    <main class="login-shell">
      <section class="login-showcase" aria-label="HomeOS介绍">
        <div class="showcase-grid" aria-hidden="true"></div>
        <div class="showcase-orb orb-one" aria-hidden="true"></div>
        <div class="showcase-orb orb-two" aria-hidden="true"></div>
        <div class="showcase-brand">
          <img class="brand-mark" src="/static/homeos-mark-black-orange.svg?v=20260915211726" alt="" /><span
            >HomeOS</span
          >
        </div>
        <div class="home-characters" aria-hidden="true">
          <div class="character character-orange"><i></i><i></i></div>
          <div class="character character-purple"><i></i><i></i></div>
          <div class="character character-dark"><i></i><i></i></div>
          <div class="character character-yellow"><i></i><i></i><span class="character-mouth yellow-mouth"></span></div>
        </div>
      </section>
      <section class="login-panel">
        <div class="mobile-brand">
          <img class="brand-mark" src="/static/homeos-mark-white-orange.svg?v=20260915211726" alt="" /><span
            >HomeOS</span
          >
        </div>
        <div class="login-card">
          <header>
            <p class="eyebrow">WELCOME BACK · 0.5.5</p>
            <h1>欢迎回来</h1>
            <p>使用首次设置时创建的本机管理员账号。</p>
          </header>
          <form id="login-form" class="auth-form">
            <label
              ><span>账号</span><input name="username" placeholder="输入账号" autocomplete="username" required
            /></label>
            <label
              ><span>密码</span
              ><span class="token-field"
                ><input
                  id="login-password"
                  name="password"
                  type="password"
                  placeholder="输入密码"
                  autocomplete="current-password"
                  required /><button
                  data-toggle-password="login-password"
                  type="button"
                  aria-label="显示密码"
                  title="显示密码"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z" />
                    <circle cx="12" cy="12" r="2.5" />
                  </svg></button></span
            ></label>
            <p id="message" class="login-error" role="alert" hidden></p>
            <button class="login-submit" type="submit"><span>登录</span><b>→</b></button>
          </form>
          <p class="account-reset-help">
            <a
              href="https://wiki.habridge.cn/maintenance/reset-admin-account.html"
              target="_blank"
              rel="noopener noreferrer"
              >忘记密码</a
            >
          </p>
          <nav class="login-links" aria-label="HomeOS资源链接">
            <a href="https://pay.habridge.cn/" target="_blank" rel="noopener noreferrer">商店</a>
            <a href="https://wiki.habridge.cn/" target="_blank" rel="noopener noreferrer">官网</a>
            <a href="https://wiki.habridge.cn/manual/first-setup.html" target="_blank" rel="noopener noreferrer"
              >使用教程</a
            >
          </nav>
        </div>
      </section>
    </main>
    <script type="module" src="/static/auth-shell.js"></script>
    <script type="module" src="/static/login.js?v=20260915211726"></script>
  </body>
</html>
