<!doctype html>
<html lang="zh-CN" class="hos-shell">
  <head>
    <meta name="homeos-release" content="b8b761498e26327c91fefcb50cbaaa0b" />
    <meta charset="utf-8" />
    <script src="/static/logging/client-log.js?v=2609271508"></script>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#050912" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HomeOS" />
    <title>登录 · HomeOS</title>
    <link rel="icon" href="/static/assets/icons/homeos-favicon-h5.ico?v=2609271508" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/static/assets/icons/homeos-favicon-h5.svg?v=2609271508" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/assets/icons/homeos-icon-180-h5.png?v=2609271508" sizes="180x180" />
    <link rel="apple-touch-icon-precomposed" href="/static/assets/icons/homeos-icon-180-h5.png?v=2609271508" sizes="180x180" />
    <link rel="manifest" href="/static/assets/manifest/manifest-h5.webmanifest?v=2609271508" />
    <link rel="stylesheet" href="/static/auth/scene/fonts.css?v=2609271508" />
    <link rel="stylesheet" href="/static/auth/scene/page.css?v=2609271508" />
    <link rel="stylesheet" href="/static/auth/scene/scene.css?v=2609271508" />
    <link rel="stylesheet" href="/static/auth/scene/panel.css?v=2609271508" />
    <!-- 站点配色覆盖：后端把它换成 `/appearance.css?v=2609271508` 的 <link>。
         必须排在所有样式表之后 —— 同为 :root 的令牌，后加载的赢。 -->
    <!--{{APPEARANCE}}-->
  </head>
  <body>
    <div class="hos-page hos-tone--accent">
      <!--{{SCENE}}-->

      <main class="hos-dock">
        <section class="hos-panel hos-rise">
          <span class="hos-panel__edge" aria-hidden="true"></span>
          <span class="hos-panel__corner hos-panel__corner--tl" aria-hidden="true"></span>
          <span class="hos-panel__corner hos-panel__corner--tr" aria-hidden="true"></span>
          <span class="hos-panel__corner hos-panel__corner--bl" aria-hidden="true"></span>
          <span class="hos-panel__corner hos-panel__corner--br" aria-hidden="true"></span>

          <!-- 开通路径（读数源：apps/server/http/commissioning.py）。不写死在这份 HTML 里：
               所以位置与状态都由后端按请求填。状态语义见 design/scene/panel.css。 -->
          <!--{{STEPS}}-->

          <!-- 状态甲板（读数源：apps/server/http/telemetry.py）。与上面的开通轨同一套机制，
               同样按访问者分档：未登录时只给机制读数，不给家的规模。 -->
          <div class="hos-panel__head">
            <div class="hos-eyebrow-row">
              <p class="hos-eyebrow">登录 · 02/05</p>
              <span class="hos-secure"><i class="hos-secure-dot" aria-hidden="true"></i>账号存本机</span>
            </div>
            <h1>进入本机中控</h1>
            <p class="hos-panel__desc">
              用首次设置时创建的管理员账号登录。会话只落在这台机器上，登录后即可进入 3D 全景编辑器。
            </p>
          </div>

          <!--{{DECK}}-->

          <form id="login-form" class="hos-form">
            <div class="hos-field">
              <div class="hos-label-row"><label for="login-username">账号</label></div>
              <!-- 这里不加 minlength：登录只回显长度约束，账号规则不泄露（见 LoginRequest）。 -->
              <div class="hos-control">
                <input
                  id="login-username"
                  name="username"
                  placeholder="输入管理员账号"
                  autocomplete="username"
                  maxlength="64"
                  required
                />
              </div>
            </div>

            <div class="hos-field">
              <div class="hos-label-row"><label for="login-password">密码</label></div>
              <div class="hos-control hos-password-field">
                <input
                  id="login-password"
                  name="password"
                  type="password"
                  placeholder="输入密码"
                  autocomplete="current-password"
                  maxlength="256"
                  required
                />
                <button type="button" data-password-toggle aria-label="显示密码" title="显示密码">显示</button>
              </div>
            </div>

            <p id="message" class="hos-msg is-err" role="alert" hidden></p>

            <div class="hos-actions">
              <button class="hos-btn-primary" type="submit">登录</button>
            </div>
          </form>

          <div class="hos-panel__copy">
            <div class="hos-panel__meta">
              <span>失败多次临时限流</span>
              <i class="hos-panel__meta-sep" aria-hidden="true"></i>
              <span>未激活先进激活页</span>
            </div>
            <p>授权失效时不会丢账号：先进入激活页完成绑定，再回到这里。</p>
          </div>
        </section>
      </main>
    </div>

    <!-- 手持档开关（源：design/scene/scene-depth.js）。写成普通脚本而不是 module：不导出
         任何东西，只给 <html> 挂 .hos-touch（scene.css「静止档」的判据兜底），首帧前跑完。 -->
    <script src="/static/auth/scene/scene-depth.js?v=2609271508"></script>
    <script type="module" src="/static/auth/auth-shell.js?v=2609271508"></script>
    <script type="module" src="/static/auth/login.js?v=2609271508"></script>
    <!-- 状态甲板的自走读数（源：frontend/static/auth/entry-deck.js）。它读页面里已经有的
         时间戳，不发任何请求；没有 .hos-deck 时自行退出，所以五页共用一份不会互相干扰。 -->
    <script type="module" src="/static/auth/entry-deck.js?v=2609271508"></script>
  </body>
</html>
