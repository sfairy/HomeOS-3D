<!doctype html>
<!--
  登录页（/login）。
  后端门禁顺序固定：未初始化先 303 去 /setup；已登录则按 ?next= 直接跳走（只认站内单斜杠路径）。
  页面本身不做能力判定，登录成功后由 /static/login.js 跳回 ?next=，再由目标页自己触发 editor 授权门禁。
  入口脚本：/static/auth-shell.js（左侧形象动画与密码显隐）、/static/login.js（表单提交）。
  样式只有一个 /static/auth.css；CSP 为 style-src 'self'，因此页面里不能写内联样式与内联脚本。
-->
<html lang="zh-CN">
  <head>
    <meta name="homeos-release" content="b8b761498e26327c91fefcb50cbaaa0b" />
    <meta charset="utf-8" />
    <script src="/static/client-log.js?v=20260917022019"></script>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#172029" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HomeOS" />
    <title>登录 · HomeOS</title>
    <!-- ?v= 由 tools/bump_static_cache_versions.mjs 统一刷新；同一次发布里所有静态资源必须共用同一枚时间戳，
         否则浏览器会新老混用（例如新的 auth.css 配旧的 login.js）。 -->
    <link rel="icon" href="/static/homeos-favicon-h5.ico?v=20260917022019" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/static/homeos-favicon-h5.svg?v=20260917022019" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/homeos-icon-180-h5.png?v=20260917022019" sizes="180x180" />
    <link rel="apple-touch-icon-precomposed" href="/static/homeos-icon-180-h5.png?v=20260917022019" sizes="180x180" />
    <link rel="manifest" href="/static/manifest-h5.webmanifest?v=20260917022019" />
    <link
      rel="stylesheet"
      href="/static/auth.css?v=20260917022019"
    />
  </head>
  <body>
    <!-- ===== 左侧品牌展示区（纯装饰，整体 aria-hidden 之外的文案由 CSS 控制） ===== -->
    <main class="login-shell">
      <section class="login-showcase" aria-label="HomeOS介绍">
        <div class="showcase-grid" aria-hidden="true"></div>
        <div class="showcase-orb orb-one" aria-hidden="true"></div>
        <div class="showcase-orb orb-two" aria-hidden="true"></div>
        <div class="showcase-brand">
          <img class="brand-mark" src="/static/homeos-mark-black-orange.svg?v=20260917022019" alt="" /><span
            >HomeOS</span
          >
        </div>
        <div class="home-characters" aria-hidden="true">
          <div class="character character-orange"><i></i><i></i></div>
          <div class="character character-purple"><i></i><i></i></div>
          <div class="character character-dark"><i></i><i></i></div>
          <div class="character character-yellow"><i></i><i></i><span class="character-mouth yellow-mouth"></span></div>
        </div>
      </section>
      <!-- ===== 右侧登录表单区 ===== -->
      <section class="login-panel">
        <div class="mobile-brand">
          <img class="brand-mark" src="/static/homeos-mark-white-orange.svg?v=20260917022019" alt="" /><span
            >HomeOS</span
          >
        </div>
        <div class="login-card">
          <header>
            <p class="eyebrow">WELCOME BACK · 0.5.6</p>
            <h1>欢迎回来</h1>
            <p>使用首次设置时创建的本机管理员账号。</p>
          </header>
          <form id="login-form" class="auth-form">
            <label
              ><span>账号</span><input name="username" placeholder="输入账号" autocomplete="username" required
            /></label>
            <label
              ><span>密码</span
              ><span class="token-field"
                ><input
                  id="login-password"
                  name="password"
                  type="password"
                  placeholder="输入密码"
                  autocomplete="current-password"
                  required /><button
                  data-toggle-password="login-password"
                  type="button"
                  aria-label="显示密码"
                  title="显示密码"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z" />
                    <circle cx="12" cy="12" r="2.5" />
                  </svg></button></span
            ></label>
            <p id="message" class="login-error" role="alert" hidden></p>
            <button class="login-submit" type="submit"><span>登录</span><b>→</b></button>
          </form>
        </div>
      </section>
    </main>
    <!-- auth-shell.js 必须在 login.js 之前执行：它负责给 .home-characters 打上动画状态类，
         并用 data-toggle-password 绑定显隐按钮；login.js 只关心表单本身，两者互不等待。 -->
    <script type="module" src="/static/auth-shell.js"></script>
    <script type="module" src="/static/login.js?v=20260917022019"></script>
  </body>
</html>
