<!doctype html>
<!--
  登录页（/login）。后端门禁：未初始化先 303 去 /setup；已登录则按 ?next= 直接跳走（只认站内单斜杠路径）。
  页面本身不做能力判定，登录成功后由 /static/auth/login.js 跳回 ?next=，再由目标页自己触发 editor 授权门禁。
  视觉与 /setup、/license、/license-recovery、/pair 统一：全屏场景 + 右侧玻璃表单坞，
  样式来自 /static/auth/scene/ 的分发产物（源在仓库 design/scene/）。
  场景片段由后端注入：页面里那个独立的场景占位符（见 backend/http/page_shell.py
  的 SCENE_PLACEHOLDER）会被替换成整块场景标记。
  入口脚本：/static/logging/client-log.js（head 同步执行）、/static/auth/auth-shell.js（共用密码显隐）、
  /static/auth/login.js（表单提交）；CSP 为 style-src 'self'，不能写内联样式/脚本。
-->
<html lang="zh-CN" class="hos-shell">
  <head>
    <meta name="homeos-release" content="b8b761498e26327c91fefcb50cbaaa0b" />
    <meta charset="utf-8" />
    <script src="/static/logging/client-log.js?v=20260921090405"></script>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#050910" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HomeOS" />
    <title>登录 · HomeOS</title>
    <!-- ?v= 由 tools/bump_static_cache_versions.mjs 统一刷新；同一次发布里所有静态资源必须共用同一枚时间戳，
         否则浏览器会新老混用（例如新的 scene.css 配旧的 login.js）。 -->
    <link rel="icon" href="/static/assets/icons/homeos-favicon-h5.ico?v=20260921090405" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/static/assets/icons/homeos-favicon-h5.svg?v=20260921090405" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/assets/icons/homeos-icon-180-h5.png?v=20260921090405" sizes="180x180" />
    <link rel="apple-touch-icon-precomposed" href="/static/assets/icons/homeos-icon-180-h5.png?v=20260921090405" sizes="180x180" />
    <link rel="manifest" href="/static/assets/manifest/manifest-h5.webmanifest?v=20260921090405" />
    <link rel="stylesheet" href="/static/auth/scene/fonts.css?v=20260921090405" />
    <link rel="stylesheet" href="/static/auth/scene/page.css?v=20260921090405" />
    <link rel="stylesheet" href="/static/auth/scene/scene.css?v=20260921090405" />
    <link rel="stylesheet" href="/static/auth/scene/panel.css?v=20260921090405" />
    <!-- 站点配色覆盖：后端把它换成 `/appearance.css?v=20260921090405` 的 <link>。
         必须排在所有样式表之后 —— 同为 :root 的令牌，后加载的赢。 -->
    <!--{{APPEARANCE}}-->
  </head>
  <body>
    <div class="hos-page">
      <!--{{SCENE}}-->

      <main class="hos-dock">
        <section class="hos-panel hos-rise">
          <span class="hos-panel__edge" aria-hidden="true"></span>
          <span class="hos-panel__corner hos-panel__corner--tl" aria-hidden="true"></span>
          <span class="hos-panel__corner hos-panel__corner--tr" aria-hidden="true"></span>
          <span class="hos-panel__corner hos-panel__corner--bl" aria-hidden="true"></span>
          <span class="hos-panel__corner hos-panel__corner--br" aria-hidden="true"></span>

          <div class="hos-eyebrow-row">
            <p class="hos-eyebrow">Sign In</p>
            <span class="hos-secure"><i class="hos-secure-dot" aria-hidden="true"></i>账号存本机</span>
          </div>
          <h1>登录 HomeOS</h1>
          <p class="hos-panel__desc">
            使用首次设置时创建的本机管理员账号。账号与密码只保存在本机，登录后即可进入编辑器，
            或先用商店激活码完成授权绑定。
          </p>

          <form id="login-form" class="hos-form">
            <div class="hos-field">
              <div class="hos-label-row"><label for="login-username">账号</label></div>
              <!-- 这里不加 minlength：登录只回显长度约束，账号规则不泄露（见 LoginRequest）。 -->
              <div class="hos-control">
                <input
                  id="login-username"
                  name="username"
                  placeholder="输入管理员账号"
                  autocomplete="username"
                  maxlength="64"
                  required
                />
              </div>
            </div>

            <div class="hos-field">
              <div class="hos-label-row"><label for="login-password">密码</label></div>
              <div class="hos-control hos-password-field">
                <input
                  id="login-password"
                  name="password"
                  type="password"
                  placeholder="输入密码"
                  autocomplete="current-password"
                  maxlength="256"
                  required
                />
                <button type="button" data-password-toggle aria-label="显示密码" title="显示密码">显示</button>
              </div>
            </div>

            <p id="message" class="hos-msg is-err" role="alert" hidden></p>

            <div class="hos-actions">
              <button class="hos-btn-primary" type="submit">登录</button>
            </div>
          </form>

          <div class="hos-panel__copy">
            <div class="hos-panel__meta">
              <span>连续失败会限流</span>
              <i class="hos-panel__meta-sep" aria-hidden="true"></i>
              <span>仅本机保存</span>
              <i class="hos-panel__meta-sep" aria-hidden="true"></i>
              <span>未激活先进激活页</span>
            </div>
            <p>登录成功后若授权失效，会先进入激活页完成绑定。</p>
          </div>
        </section>
      </main>
    </div>

    <!-- auth-shell.js 必须在 login.js 之前执行：它负责按 data-password-toggle 绑定密码显隐；
         login.js 只关心表单本身，两者互不等待。这里同样要带 ?v=20260921090405 -->
    <script type="module" src="/static/auth/auth-shell.js?v=20260921090405"></script>
    <script type="module" src="/static/auth/login.js?v=20260921090405"></script>
  </body>
</html>
