<!doctype html>
<html lang="zh-CN">
  <head>
    <meta name="homeos-release" content="b8b761498e26327c91fefcb50cbaaa0b" />
    <meta charset="utf-8" />
    <script src="/static/client-log.js?v=20260915211726"></script>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#172029" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HomeOS" />
    <title>激活授权 · HomeOS</title>
    <link rel="icon" href="/static/homeos-favicon-h5.ico?v=20260915211726" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/static/homeos-favicon-h5.svg?v=20260915211726" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/homeos-icon-180-h5.png?v=20260915211726" sizes="180x180" />
    <link rel="apple-touch-icon-precomposed" href="/static/homeos-icon-180-h5.png?v=20260915211726" sizes="180x180" />
    <link rel="manifest" href="/static/manifest-h5.webmanifest?v=20260915211726" />
    <link rel="stylesheet" href="/static/auth.css?v=20260915211726" />
  </head>
  <body>
    <main class="login-shell">
      <section class="login-showcase" aria-label="HomeOS介绍">
        <div class="showcase-grid" aria-hidden="true"></div>
        <div class="showcase-orb orb-one" aria-hidden="true"></div>
        <div class="showcase-orb orb-two" aria-hidden="true"></div>
        <div class="showcase-brand">
          <img class="brand-mark" src="/static/homeos-mark-black-orange.svg?v=20260915211726" alt="" /><span
            >HomeOS</span
          >
        </div>
        <div class="home-characters" aria-hidden="true">
          <div class="character character-orange"><i></i><i></i></div>
          <div class="character character-purple"><i></i><i></i></div>
          <div class="character character-dark"><i></i><i></i></div>
          <div class="character character-yellow"><i></i><i></i><span class="character-mouth yellow-mouth"></span></div>
        </div>
      </section>
      <section class="login-panel">
        <button id="logout" class="license-logout" type="button" aria-label="退出登录">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M14.08 15.59 16.67 13H7v-2h9.67l-2.59-2.59L15.5 7l5 5-5 5-1.42-1.41M19 3a2 2 0 0 1 2 2v4.67l-2-2V5H5v14h14v-2.67l2-2V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14Z"
            />
          </svg>
          <span>退出登录</span>
        </button>
        <div class="mobile-brand">
          <img class="brand-mark" src="/static/homeos-mark-white-orange.svg?v=20260915211726" alt="" /><span
            >HomeOS</span
          >
        </div>
        <div class="login-card">
          <header>
            <p class="eyebrow">LICENSE INFORMATION · 0.5.5</p>
            <h1>激活 HomeOS</h1>
            <p id="license-status-text">正在读取授权状态…</p>
          </header>
          <form id="license-form" class="auth-form">
            <label
              ><span>授权邮箱</span
              ><input
                name="email"
                type="email"
                maxlength="255"
                autocomplete="email"
                placeholder="购买授权时使用的邮箱"
                required
            /></label>
            <label
              ><span>激活码</span
              ><input name="activationCode" maxlength="128" autocomplete="off" placeholder="HB-XXXX-XXXX-XXXX" required
            /></label>
            <p id="message" class="login-error" role="alert" hidden></p>
            <button class="login-submit" type="submit"><span>激活当前安装</span><b>→</b></button>
          </form>
        </div>
      </section>
    </main>
    <script type="module" src="/static/auth-shell.js"></script>
    <script type="module" src="/static/license.js?v=20260915211726"></script>
  </body>
</html>
