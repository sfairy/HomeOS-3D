<!doctype html>
<!--
  授权激活页（/license）。
  视觉对齐 /setup：暗色琥珀 + 顶栏品牌 + 左栏说明 / 右栏表单。
  后端门禁：未初始化 → /setup；未登录 → /login；
  仅当授权状态为 ACTIVE 且具备 editor 时 303 回首页。
  CONNECTION_WARNING 等宽限态会留在本页展示告警与重新激活。
  表单字段与后端激活请求体对齐：email 最长 255、activationCode 最长 128。
  #logout 退出本机管理员会话（不是商店账号）。
-->
<html lang="zh-CN">
  <head>
    <meta name="homeos-release" content="b8b761498e26327c91fefcb50cbaaa0b" />
    <meta charset="utf-8" />
    <script src="/static/client-log.js?v=20260919153711"></script>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#151a1f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HomeOS" />
    <title>激活授权 · HomeOS</title>
    <link rel="icon" href="/static/homeos-favicon-h5.ico?v=20260919153711" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/static/homeos-favicon-h5.svg?v=20260919153711" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/homeos-icon-180-h5.png?v=20260919153711" sizes="180x180" />
    <link rel="apple-touch-icon-precomposed" href="/static/homeos-icon-180-h5.png?v=20260919153711" sizes="180x180" />
    <link rel="manifest" href="/static/manifest-h5.webmanifest?v=20260919153711" />
    <link rel="stylesheet" href="/static/setup.css?v=20260919153711" />
  </head>
  <body>
    <header class="hb-setup-topbar">
      <div class="hb-container hb-setup-topbar__inner">
        <a class="hb-setup-brand" href="/license" aria-label="HomeOS">
          <span class="hb-setup-brand__mark">
            <img src="/static/homeos-mark-white-orange.svg?v=20260919153711" alt="" />
          </span>
          <span class="hb-setup-brand__text">
            <strong>HomeOS</strong>
            <small>激活授权</small>
          </span>
        </a>
        <div class="hb-setup-topbar__actions">
          <span class="hb-setup-topbar__meta">LICENSE · 0.5.6</span>
          <button id="logout" class="hb-setup-logout" type="button">退出本机登录</button>
        </div>
      </div>
    </header>

    <main class="hb-setup-main">
      <div class="hb-container">
        <div class="hb-auth-shell">
          <aside class="hb-auth-aside">
            <span class="hb-kicker">License</span>
            <h2>用激活码<strong>绑定本机</strong></h2>
            <p>
              激活码来自商店购买或管理员签发。绑定后授权跟随本机硬件指纹；换机前请先在商店账号中心解绑。
            </p>
            <ul>
              <li><span class="hb-check" aria-hidden="true">✓</span>一机一码，激活即绑定硬件指纹</li>
              <li><span class="hb-check" aria-hidden="true">✓</span>邮箱填写商店购买账号，不是本机管理员</li>
              <li><span class="hb-check" aria-hidden="true">✓</span>解绑后需过冷却期才能在新设备重绑</li>
            </ul>
          </aside>

          <section class="hb-auth-card">
            <div class="hb-auth-brand">
              <strong>激活 HomeOS</strong>
              <p id="license-status-text">正在读取授权状态…</p>
            </div>
            <p id="license-recovery-hint" class="hb-license-recovery" hidden></p>
            <form id="license-form" class="hb-auth-form">
              <label>
                商店购买邮箱
                <input
                  name="email"
                  type="email"
                  maxlength="255"
                  autocomplete="email"
                  placeholder="下单 / 收码用的商店邮箱"
                  required
                />
                <small>填写商店账号邮箱，不是本机管理员账号。</small>
              </label>
              <label>
                激活码
                <input
                  name="activationCode"
                  maxlength="128"
                  autocomplete="off"
                  placeholder="HOMEOS-XXXX-XXXX-XXXX"
                  spellcheck="false"
                  required
                />
                <small>首次激活绑定本机；换机或硬件变更后需先在商店解绑再激活。</small>
              </label>
              <p id="message" class="hb-setup-error" role="alert" hidden></p>
              <button class="hb-button hb-button--primary hb-button--lg hb-button--block" type="submit">
                激活并绑定本机
              </button>
            </form>
            <p class="hb-auth-switch">激活成功后将自动进入编辑器。本页右上角可退出本机登录。</p>
          </section>
        </div>
      </div>
    </main>

    <script type="module" src="/static/license.js?v=20260919153711"></script>
  </body>
</html>
