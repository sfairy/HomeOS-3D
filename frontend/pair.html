<!doctype html>
<html lang="zh-CN" class="hos-shell">
  <head>
    <meta name="homeos-release" content="b8b761498e26327c91fefcb50cbaaa0b" />
    <meta charset="utf-8" />
    <!-- pairing-entry.js 必须是本页第一个脚本：它要在其它脚本读地址栏之前，
         否则刷新页面会重复触发一次配对。 -->
    <script src="/static/auth/pairing-entry.js?v=2609271226"></script>
    <script src="/static/logging/client-log.js?v=2609271226"></script>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#050912" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HomeOS" />
    <title>配对中控设备 · HomeOS</title>
    <link rel="icon" href="/static/assets/icons/homeos-favicon-h5.ico?v=2609271226" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/static/assets/icons/homeos-favicon-h5.svg?v=2609271226" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/assets/icons/homeos-icon-180-h5.png?v=2609271226" sizes="180x180" />
    <link rel="manifest" href="/static/assets/manifest/dashboard.webmanifest?v=2609271226" />
    <link rel="stylesheet" href="/static/auth/scene/fonts.css?v=2609271226" />
    <link rel="stylesheet" href="/static/auth/scene/page.css?v=2609271226" />
    <link rel="stylesheet" href="/static/auth/scene/scene.css?v=2609271226" />
    <link rel="stylesheet" href="/static/auth/scene/panel.css?v=2609271226" />
    <!-- 站点配色覆盖：后端把它换成 `/appearance.css?v=2609271226` 的 <link>。
         必须排在所有样式表之后 —— 同为 :root 的令牌，后加载的赢。 -->
    <!--{{APPEARANCE}}-->
  </head>
  <body>
    <div class="hos-page hos-tone--aura">
      <!--{{SCENE}}-->

      <main class="hos-dock">
        <section class="hos-panel hos-rise">
          <span class="hos-panel__edge" aria-hidden="true"></span>
          <span class="hos-panel__corner hos-panel__corner--tl" aria-hidden="true"></span>
          <span class="hos-panel__corner hos-panel__corner--tr" aria-hidden="true"></span>
          <span class="hos-panel__corner hos-panel__corner--bl" aria-hidden="true"></span>
          <span class="hos-panel__corner hos-panel__corner--br" aria-hidden="true"></span>

          <!-- 开通路径（读数源：apps/server/http/commissioning.py）。不写死在这份 HTML 里：
               所以位置与状态都由后端按请求填。状态语义见 design/scene/panel.css。 -->
          <!--{{STEPS}}-->

          <!-- 状态甲板（读数源：apps/server/http/telemetry.py）。本页有两种访问者：
               墙面板自己来看这一页（给「上次同步」与运行时长）。 -->
          <div class="hos-panel__head">
            <div class="hos-eyebrow-row">
              <p class="hos-eyebrow">设备配对 · 04/05</p>
              <span class="hos-secure"><i class="hos-secure-dot" aria-hidden="true"></i>6 位配对码</span>
            </div>
            <h1 id="pair-title">接入这台中控</h1>
            <p id="pair-description" class="hos-panel__desc">输入管理员为这台中控设置的固定 6 位配对码。</p>
            <p id="apple-pair-note" class="hos-notice" hidden>连接成功后会引导你添加到主屏幕，以后点击 HomeOS 图标即可打开。</p>
          </div>

          <!--{{DECK}}-->

          <form id="pair-form" class="hos-form">
            <div class="hos-field">
              <div class="hos-label-row"><label for="pair-code">6 位配对码</label></div>
              <!-- pattern + inputmode 是双保险：前者给浏览器做原生校验（也只能提交 6 位数字），
                   后者让移动端直接弹数字键盘；真正的合法性仍由后端按 6 位数字码判定。 -->
              <div class="hos-control">
                <input
                  id="pair-code"
                  name="code"
                  class="hos-mono"
                  inputmode="numeric"
                  pattern="[0-9]{6}"
                  minlength="6"
                  maxlength="6"
                  placeholder="000000"
                  autocomplete="one-time-code"
                  required
                />
              </div>
            </div>

            <p id="message" class="hos-msg is-err" role="alert" hidden></p>

            <div class="hos-actions">
              <!-- 按钮里的 <span> 是契约：pair.js 扫码成功后改写它的文案。 -->
              <button class="hos-btn-primary" type="submit"><span>完成配对</span></button>
            </div>
          </form>

          <div class="hos-panel__copy">
            <div class="hos-panel__meta">
              <span>6 位数字码</span>
              <i class="hos-panel__meta-sep" aria-hidden="true"></i>
              <span>授权不可用时就地转恢复页</span>
            </div>
            <p>配对成功后由服务端下发设备 Cookie，刷新仍停在这台设备的画面。</p>
          </div>
        </section>
      </main>
    </div>

    <!-- auth-shell.js 也要带 ?v=2609271226 -->
    <!-- 手持档开关（源：design/scene/scene-depth.js）。写成普通脚本而不是 module：不导出
         任何东西，只给 <html> 挂 .hos-touch（scene.css「静止档」的判据兜底），首帧前跑完。 -->
    <script src="/static/auth/scene/scene-depth.js?v=2609271226"></script>
    <script type="module" src="/static/auth/auth-shell.js?v=2609271226"></script>
    <script type="module" src="/static/auth/pair.js?v=2609271226"></script>
    <!-- 状态甲板的自走读数（源：frontend/static/auth/entry-deck.js）。它读页面里已经有的
         时间戳，不发任何请求；没有 .hos-deck 时自行退出，所以五页共用一份不会互相干扰。 -->
    <script type="module" src="/static/auth/entry-deck.js?v=2609271226"></script>
  </body>
</html>
