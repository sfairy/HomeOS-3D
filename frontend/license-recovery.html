<!doctype html>
<!--
  连接状态页：为「授权后台暂时联系不上」提供一个不吓人的出口。
  挂载方式：**没有独立路由**，由后端在 allows('display') 为假时就地渲染在 /pair 与
  /display/* 上（见 backend/main.py 的 pair_page / display_page）。这样设备刷新后仍停在
  自己的地址上，授权一恢复就能直接进画面；也避免了「授权不可用反而要先去登录」这种死路。
  与 /license 的分工：/license 是管理员填激活码的地方；本页面向展示端与普通用户，只说明
  「正在重试 / 需要管理员介入」，并提供一键重连。
  视觉与 /setup、/login、/license、/pair 统一：全屏场景 + 右侧玻璃表单坞。
  id 契约：license-recovery.js 只在 #license-recovery 存在时自举 —— 那段自举同时被 /license 引用，
  加个根节点就等于在授权页也挂一套定时器，所以这个 id 不能省。
  场景片段由后端注入：页面里那个独立的场景占位符（见 backend/http/page_shell.py
  的 SCENE_PLACEHOLDER）会被替换成整块场景标记。
-->
<html lang="zh-CN" class="hos-shell">
  <head>
    <meta name="homeos-release" content="b8b761498e26327c91fefcb50cbaaa0b" />
    <meta charset="utf-8" />
    <script src="/static/logging/client-log.js?v=2609221451"></script>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#050912" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HomeOS" />
    <title>连接状态 · HomeOS</title>
    <link rel="icon" href="/static/assets/icons/homeos-favicon-h5.ico?v=2609221451" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/static/assets/icons/homeos-favicon-h5.svg?v=2609221451" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/assets/icons/homeos-icon-180-h5.png?v=2609221451" sizes="180x180" />
    <link rel="apple-touch-icon-precomposed" href="/static/assets/icons/homeos-icon-180-h5.png?v=2609221451" sizes="180x180" />
    <link rel="manifest" href="/static/assets/manifest/manifest-h5.webmanifest?v=2609221451" />
    <link rel="stylesheet" href="/static/auth/scene/fonts.css?v=2609221451" />
    <link rel="stylesheet" href="/static/auth/scene/page.css?v=2609221451" />
    <link rel="stylesheet" href="/static/auth/scene/scene.css?v=2609221451" />
    <link rel="stylesheet" href="/static/auth/scene/panel.css?v=2609221451" />
    <!-- 站点配色覆盖：后端把它换成 `/appearance.css?v=2609221451` 的 <link>。
         必须排在所有样式表之后 —— 同为 :root 的令牌，后加载的赢。 -->
    <!--{{APPEARANCE}}-->
  </head>
  <body>
    <div class="hos-page hos-tone--alert">
      <!--{{SCENE}}-->

      <main class="hos-dock">
        <!-- 本页会被就地渲染在 /pair 与 /display/* 上，本身没有「自己的地址」可以指回去，
             所以坞里不提供「回到某页」的链接，只留「管理员重新激活」这一条明确出口。 -->
        <section class="hos-panel hos-rise" id="license-recovery">
          <span class="hos-panel__edge" aria-hidden="true"></span>
          <span class="hos-panel__corner hos-panel__corner--tl" aria-hidden="true"></span>
          <span class="hos-panel__corner hos-panel__corner--tr" aria-hidden="true"></span>
          <span class="hos-panel__corner hos-panel__corner--bl" aria-hidden="true"></span>
          <span class="hos-panel__corner hos-panel__corner--br" aria-hidden="true"></span>

          <!-- 开通路径（读数源：backend/http/commissioning.py）。不写死在这份 HTML 里：
               同一页对不同访问者的读数不同（管理员带着会话来，墙面板没有也不该有会话），
               所以位置与状态都由后端按请求填。状态语义见 design/scene/panel.css。 -->
          <!--{{STEPS}}-->

          <!-- 状态甲板（读数源：backend/http/telemetry.py）。恢复页可能没有会话
               （墙面板就地渲染），四格给的是：授权状态 / 上次同步 / 已配对中控 / 项目 ——
               前两格回答「卡在哪」，后两格回答「我的东西还在不在」。 -->
          <div class="hos-panel__head">
            <div class="hos-eyebrow-row">
              <p class="hos-eyebrow">授权受阻 · 03/05</p>
              <!-- 这颗点是恒绿的「安全 / 机制在跑」，不跟页面色调走。原文案「自动重连中」在珊瑚色的
                 恢复页上会读成「一切正常」，而这页恰恰是「进不去」；换成陈述机制而不是断言状态。 -->
              <span class="hos-secure"><i class="hos-secure-dot" aria-hidden="true"></i>每 5 秒自检</span>
            </div>
            <h1>正在连接你的家</h1>
            <p id="recovery-message" class="hos-status" role="status" aria-live="polite">正在读取授权状态…</p>
            <!-- 错误单独一行、单独 role=alert：与「现在处于什么状态」分开报。合成一行时，
                 一次网络抖动会把状态句覆盖掉，用户就看不到后端其实说了什么。 -->
            <p id="recovery-error" class="hos-msg is-err" role="alert" hidden></p>
          </div>

          <!--{{DECK}}-->

          <div class="hos-actions">
            <button id="recovery-retry" class="hos-btn-primary" type="button">重新连接授权后台</button>
          </div>

          <div class="hos-panel__copy">
            <!-- 这三条事实都搬到了左栏那张「本机档案」表里（现状 / 自检 / 租约 / 之后）：
                 同一屏里并排说两遍，只会显得这页没有别的可说。 -->
            <p>已有项目、设备配对和连接信息不会被清除。</p>
            <a class="hos-text-button" href="/license">管理员重新激活</a>
          </div>
        </section>
      </main>
    </div>

    <!-- 场景视差相机（源：design/scene/scene-depth.js）。写成普通脚本而不是 module：
         它不导出任何东西，越早跑越好 —— 一进场（含那 0.75s 的入场动画）画面就是活的。 -->
    <script src="/static/auth/scene/scene-depth.js?v=2609221451"></script>
    <script type="module" src="/static/auth/license-recovery.js?v=2609221451"></script>
    <!-- 状态甲板的自走读数（源：frontend/static/auth/entry-deck.js）。它读页面里已经有的
         时间戳，不发任何请求；没有 .hos-deck 时自行退出，所以五页共用一份不会互相干扰。 -->
    <script type="module" src="/static/auth/entry-deck.js?v=2609221451"></script>
  </body>
</html>
