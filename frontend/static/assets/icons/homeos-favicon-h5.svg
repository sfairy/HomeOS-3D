<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="HomeOS">
<!-- 品牌标配色：刻意硬编码，不要改成 CSS 自定义属性引用。
     这一族 SVG 全部以 img 标签 / link rel=icon / PWA 清单图标的方式
     作为独立文档加载，页面根元素上的自定义属性在它自己的文档里并不存在，
     属性引用会解析为空，整个标会变成黑块或透明，而且不报错。
     13 个色值里 9 个逐字节等于 canonical 令牌（050912 = hos-sky-deep、
     081020 = hos-sky-low、16263C = hos-sky-high、24395A = hos-sky-haze、
     5FD0A8 = hos-eco、C9A0FF = hos-aura、FF9D4D = hos-lumen、
     FFC46A = hos-accent、FFD9A0 = hos-accent-bright），改令牌时这几处要跟着改；
     另 4 个（4E6489 / D89A3C / FFE9C9 / FFF6E4）是标自身的渐变色阶中点，
     全库仅在这里出现，不对应任何令牌，所以没有漂移可收。 -->
  <title>HomeOS</title>
  <defs>
    <linearGradient id="fvh5House" x1="12" y1="92" x2="90" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16263C"/>
      <stop offset="24%" stop-color="#24395A"/>
      <stop offset="52%" stop-color="#4E6489"/>
      <stop offset="78%" stop-color="#D89A3C"/>
      <stop offset="100%" stop-color="#FFD9A0"/>
    </linearGradient>
    <linearGradient id="fvh5Life" x1="10" y1="48" x2="50" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5FD0A8" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#5FD0A8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fvh5Voice" x1="90" y1="48" x2="50" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C9A0FF" stop-opacity="0.76"/>
      <stop offset="100%" stop-color="#C9A0FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fvh5Roof" x1="50" y1="8" x2="50" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD9A0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFC46A" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fvh5Warm" cx="50" cy="70" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9D4D" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#FF9D4D" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FF9D4D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fvh5Screen" x1="50" y1="48" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16263C"/>
      <stop offset="100%" stop-color="#081020"/>
    </linearGradient>
    <radialGradient id="fvh5ScreenGlow" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#FFC46A" stop-opacity="0.2"/>
      <stop offset="55%" stop-color="#FF9D4D" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFC46A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fvh5HubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE9C9" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#FF9D4D" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#FF9D4D" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="fvh5HouseClip">
      <path d="M50 7.8 C51.8 7.8 53.4 8.6 54.6 10.1 L91.6 39.6 C93.2 41 92.3 43.6 90.1 43.6 H82.2 V82.4 C82.2 90.2 75.8 96.4 68 96.4 H32 C24.2 96.4 17.8 90.2 17.8 82.4 V43.6 H9.9 C7.7 43.6 6.8 41 8.4 39.6 L45.4 10.1 C46.6 8.6 48.2 7.8 50 7.8 Z"/>
    </clipPath>
    <clipPath id="fvh5TileClip">
      <rect width="128" height="128" rx="28"/>
    </clipPath>
    <style>
      @keyframes fvh5Hub {
        0%, 100% { opacity: 0.82; }
        50% { opacity: 1; }
      }
      @keyframes fvh5Wifi {
        0%, 100% { opacity: 0.42; }
        40% { opacity: 1; }
      }
      .fvh5-hub { animation: fvh5Hub 3.4s ease-in-out infinite; }
      .fvh5-wifi-a { animation: fvh5Wifi 2.2s ease-in-out 0s infinite; }
      .fvh5-wifi-b { animation: fvh5Wifi 2.2s ease-in-out 0.14s infinite; }
      .fvh5-wifi-c { animation: fvh5Wifi 2.2s ease-in-out 0.28s infinite; }
      @media (prefers-reduced-motion: reduce) {
        .fvh5-hub, .fvh5-wifi-a, .fvh5-wifi-b, .fvh5-wifi-c { animation: none; }
      }
    </style>
  </defs>
  <rect width="128" height="128" rx="28" fill="#050912"/>
  <g clip-path="url(#fvh5TileClip)" transform="scale(1.28)">
    <path
      fill="url(#fvh5House)"
      d="M50 7.8 C51.8 7.8 53.4 8.6 54.6 10.1 L91.6 39.6 C93.2 41 92.3 43.6 90.1 43.6 H82.2 V82.4 C82.2 90.2 75.8 96.4 68 96.4 H32 C24.2 96.4 17.8 90.2 17.8 82.4 V43.6 H9.9 C7.7 43.6 6.8 41 8.4 39.6 L45.4 10.1 C46.6 8.6 48.2 7.8 50 7.8 Z"
    />
    <g clip-path="url(#fvh5HouseClip)">
      <rect x="8" y="8" width="42" height="90" fill="url(#fvh5Life)"/>
      <rect x="50" y="8" width="42" height="90" fill="url(#fvh5Voice)"/>
      <path d="M50 8 L92 43 L8 43 Z" fill="url(#fvh5Roof)"/>
      <ellipse cx="50" cy="72" rx="30" ry="24" fill="url(#fvh5Warm)"/>
    </g>
    <g fill="none" stroke="#FFD9A0" stroke-linecap="round" stroke-linejoin="round">
      <path class="fvh5-wifi-a" d="M46.4 38.4 Q50 35 53.6 38.4" stroke-width="2.2"/>
      <path class="fvh5-wifi-b" d="M43.4 33.6 Q50 27 56.6 33.6" stroke-width="2.1"/>
      <path class="fvh5-wifi-c" d="M39.4 28.4 Q50 19.8 60.6 28.4" stroke-width="2"/>
    </g>
    <circle cx="50" cy="41.6" r="1.7" fill="#FFD9A0"/>
    <rect x="28.5" y="49.5" width="43" height="39.2" rx="7.2" fill="url(#fvh5Screen)"/>
    <rect x="28.5" y="49.5" width="43" height="39.2" rx="7.2" fill="url(#fvh5ScreenGlow)"/>
    <g stroke-width="1.85" stroke-linecap="round">
      <line x1="50" y1="69" x2="50" y2="56.8" stroke="#FFC46A"/>
      <line x1="50" y1="69" x2="63" y2="69" stroke="#C9A0FF"/>
      <line x1="50" y1="69" x2="50" y2="81.2" stroke="#FF9D4D"/>
      <line x1="50" y1="69" x2="37" y2="69" stroke="#5FD0A8"/>
    </g>
    <circle cx="50" cy="56.8" r="3" fill="#FFC46A"/>
    <circle cx="63" cy="69" r="3" fill="#C9A0FF"/>
    <circle cx="50" cy="81.2" r="3" fill="#FF9D4D"/>
    <circle cx="37" cy="69" r="3" fill="#5FD0A8"/>
    <circle class="fvh5-hub" cx="50" cy="69" r="8.4" fill="url(#fvh5HubGlow)"/>
    <circle cx="50" cy="69" r="3.3" fill="#FFF6E4"/>
  </g>
</svg>
