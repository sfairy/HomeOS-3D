      .fvh3-wifi-a { animation: fvh3Wifi 2.2s ease-in-out 0s infinite; }
      .fvh3-wifi-b { animation: fvh3Wifi 2.2s ease-in-out 0.14s infinite; }
      .fvh3-wifi-c { animation: fvh3Wifi 2.2s ease-in-out 0.28s infinite; }
