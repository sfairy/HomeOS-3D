<!doctype html>
<!--
  首次设置页（/setup）：创建本机唯一的超级管理员账号。
  视觉对齐商店认证页（暗色琥珀 + 左栏说明 / 右栏表单）。
  表单约束与后端 SetupAdminRequest 一致：账号 3–64、密码 8–256。
  引导密钥默认隐藏；非本机打开时由 setup.js 显示并改为必填。
-->
<html lang="zh-CN">
  <head>
    <meta name="homeos-release" content="b8b761498e26327c91fefcb50cbaaa0b" />
    <meta charset="utf-8" />
    <script src="/static/client-log.js?v=20260918191243"></script>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#151a1f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HomeOS" />
    <title>初始化 · HomeOS</title>
    <link rel="icon" href="/static/homeos-favicon-h5.ico?v=20260918191243" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/static/homeos-favicon-h5.svg?v=20260918191243" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/homeos-icon-180-h5.png?v=20260918191243" sizes="180x180" />
    <link rel="apple-touch-icon-precomposed" href="/static/homeos-icon-180-h5.png?v=20260918191243" sizes="180x180" />
    <link rel="manifest" href="/static/manifest-h5.webmanifest?v=20260918191243" />
    <link rel="stylesheet" href="/static/setup.css?v=20260918191243" />
  </head>
  <body>
    <header class="hb-setup-topbar">
      <div class="hb-container hb-setup-topbar__inner">
        <a class="hb-setup-brand" href="/setup" aria-label="HomeOS">
          <span class="hb-setup-brand__mark">
            <img src="/static/homeos-mark-white-orange.svg?v=20260918191243" alt="" />
          </span>
          <span class="hb-setup-brand__text">
            <strong>HomeOS</strong>
            <small>本机初始化</small>
          </span>
        </a>
        <span class="hb-setup-topbar__meta">FIRST SETUP · 0.5.6</span>
      </div>
    </header>

    <main class="hb-setup-main">
      <div class="hb-container">
        <div class="hb-auth-shell">
          <aside class="hb-auth-aside">
            <span class="hb-kicker">First Setup</span>
            <h2>先设置<strong>本机管理员</strong></h2>
            <p>
              这是安装后的第一步：创建本机唯一的超级管理员账号。完成后即可登录编辑器、连接
              Home Assistant，并用商店激活码完成授权绑定。
            </p>
            <ul>
              <li><span class="hb-check" aria-hidden="true">✓</span>账号与密码保存在本机，不经过第三方云</li>
              <li><span class="hb-check" aria-hidden="true">✓</span>创建成功后自动登录，并先检查授权状态</li>
              <li><span class="hb-check" aria-hidden="true">✓</span>远程打开时需启动日志里的引导密钥</li>
            </ul>
          </aside>

          <section class="hb-auth-card">
            <div class="hb-auth-brand">
              <strong>设置管理员</strong>
              <p>首次安装或重置账号后，在这里设置管理员账号和密码。</p>
            </div>
            <form id="setup-form" class="hb-auth-form">
              <label>
                管理员账号
                <input
                  name="username"
                  placeholder="输入管理员账号"
                  autocomplete="username"
                  minlength="3"
                  maxlength="64"
                  required
                />
              </label>
              <label>
                密码
                <span class="hb-password-field">
                  <input
                    id="setup-password"
                    name="password"
                    type="password"
                    placeholder="至少 8 个字符"
                    autocomplete="new-password"
                    minlength="8"
                    maxlength="256"
                    required
                  />
                  <button type="button" data-password-toggle aria-label="显示密码">显示</button>
                </span>
              </label>
              <label>
                再次输入密码
                <span class="hb-password-field">
                  <input
                    id="setup-password-confirmation"
                    name="passwordConfirmation"
                    type="password"
                    placeholder="再次输入密码"
                    autocomplete="new-password"
                    minlength="8"
                    maxlength="256"
                    required
                  />
                  <button type="button" data-password-toggle aria-label="显示密码">显示</button>
                </span>
              </label>
              <label id="setup-token-field" hidden>
                引导密钥
                <input name="setupToken" placeholder="见服务启动日志" autocomplete="off" maxlength="256" />
                <small>非本机访问必须填写；密钥在服务启动日志或 APP_SETUP_TOKEN 中。</small>
              </label>
              <p id="message" class="hb-setup-error" role="alert" hidden></p>
              <button class="hb-button hb-button--primary hb-button--lg hb-button--block" type="submit">
                保存账号并继续
              </button>
            </form>
            <p class="hb-auth-switch">本页仅用于首次初始化；完成后会先检查授权，未激活将进入激活页。</p>
          </section>
        </div>
      </div>
    </main>

    <script type="module" src="/static/setup.js?v=20260918191243"></script>
  </body>
</html>
