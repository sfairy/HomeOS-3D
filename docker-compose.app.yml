# HomeOS 主应用 —— 独立部署（给客户的机器，可单独跑，不需要商店在同一台机器）
#
#   ./ops/deploy/deploy.sh --role app --license-server https://pay.example.com
#
# 与商店同机部署时叠加 docker-compose.app.shared.yml（deploy.sh --role all 会自动加）。

name: homeos-3d

services:
  homeos-3d:
    image: ${HOMEOS_IMAGE:-ghcr.io/sfairy/homeos-3d:latest}
    container_name: homeos-3d
    # 固定 hostname：授权实例指纹在缺少机器/主板标识时会把容器 hostname 编进去，
    # 换掉它等于换设备。
    hostname: homeos-3d
    restart: unless-stopped
    ports:
      - "${APP_PUBLISH_PORT:-18081}:18081"
    environment:
      APP_DATA_DIR: /data
      APP_PORT: "18081"
      APP_BASE_URL: ${APP_BASE_URL:-}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      APP_TRUSTED_PROXIES: ${APP_TRUSTED_PROXIES:-}
      APP_UPDATE_CHANNEL: docker
      APP_CLIENT_KEYS_DIR: /data/keys
      APP_HARDWARE_MACHINE_ID: ${APP_HARDWARE_MACHINE_ID:-}
      APP_HARDWARE_BOARD_ID: ${APP_HARDWARE_BOARD_ID:-}
      # 厂商授权服务器的公网地址。留空会退回 http://127.0.0.1:18082（容器内没人监听），
      # 表现为授权一直连不上，所以独立部署必须填。
      APP_LICENSE_SERVER_URL: ${APP_LICENSE_SERVER_URL:-}
      # uvicorn 的转发头信任范围。默认只信回环：默认桥接网络下网关地址（172.17.0.1）
      # 也算远程来源，反代在宿主机上时要显式放宽。
      UVICORN_FORWARDED_ALLOW_IPS: ${UVICORN_FORWARDED_ALLOW_IPS:-127.0.0.1,::1}
    volumes:
      - homeos-3d-data:/data
      - homeos-3d-secrets:/run/secrets
      # 授权公钥（Ed25519 验签 + X25519 传输）：deploy.sh 会落盘到 ./keys，
      # 手工部署时放两个 PEM 进去并 chmod 644 即可。
      - ./keys:/data/keys:ro
      # 宿主标识：授权实例指纹的来源（见 apps/server/license/hardware.py）。缺了也能起，
      # 指纹退到 data/ 下的兜底 ID；deploy.sh --host-binds 会自动建这两个符号链接。
      - type: bind
        source: /host/etc/machine-id
        target: /host/etc/machine-id
        read_only: true
      - type: bind
        source: /host/sys/class/dmi/id
        target: /host/sys/class/dmi/id
        read_only: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18081/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  homeos-3d-data:
  homeos-3d-secrets:
