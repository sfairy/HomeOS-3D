# HomeOS —— 客户机部署（发给客户的就是这一份，自包含，不需要 .env）
#
#   docker compose -f docker-compose.app.yml up -d
#
# 只有主应用。商店在厂商那台（docker-compose.yml），本机通过公网域名访问它：
#   APP_LICENSE_SERVER_URL  容器出站（取公钥 / 激活 / 心跳 / 代发验证码）
#   APP_STORE_URL           登录页「忘记密码 / 商店」链接（给浏览器）
#
# 不变式：两条商店地址永远是 https://homelifepay.iepose.cn，**不要改**。客户机不在厂商
# 局域网内，私网地址装到别处就连不上；本机也没有商店容器，所以商店**只能**走公网 ——
# 这里没有「同机 :8802」那条分支（那是开发者那份 docker-compose.yml 的事）。
# 商店也没有 HTTPS 端口（没有 8804），别往那边指。
#
# 端口：8801（HTTP）/ 8803（内置自签 HTTPS），冲突就改 `ports:` 左侧。
# 内网直连用这两个端口；要让外网访问，由隧道 / 反代把 443 回灌到 127.0.0.1:8801，
# 并把本机的公网地址填进 APP_BASE_URL（见下方 environment 与 ops/deploy/TUNNEL-ACCESS.md）。
#
# 首次启动：
#   sudo mkdir -p /host/etc /host/sys/class/dmi
#   sudo ln -sfn /etc/machine-id   /host/etc/machine-id
#   sudo ln -sfn /sys/class/dmi/id /host/sys/class/dmi/id     # 必须在首次 up 之前建好
#   curl -fsS https://homelifepay.iepose.cn/v2/keys | head -c 120   # 先在客户机验证可达
#   docker compose -f docker-compose.app.yml up -d
# 然后打开 http://<本机地址>:8801/ ：未注册时会被直接送到 /register（注册后自动进 /activate
# 填厂商给的激活码）。手动直达 /register 也行。
#
# 卡在某个页面时先跑本机自检（四条地址链路 + 授权状态一次看完）：
#   bash ops/deploy/preflight.sh
#
# 升级：pull + up -d。升级不动数据卷；永远不要 down -v。
# 授权 1 激活码 : 1 设备，换机器 / 改 hostname / 改 /host 挂载都会换指纹，需厂商后台解绑。

name: homeos

services:
  homeos:
    image: ghcr.io/sfairy/homeos:latest
    container_name: homeos
    # 固定 hostname：授权实例指纹会把它编进去，换掉等于换设备。
    hostname: homeos
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      # 8801：HTTP 直连；8803：内置 Caddy 的 HTTPS（自签证书）。
      - "8801:8801"
      - "8803:8803"
    environment:
      APP_ENVIRONMENT: production
      # 厂商公网商店地址，写死不要改（详见文件头）。留空会导致容器启动即退出。
      APP_LICENSE_SERVER_URL: ${APP_LICENSE_SERVER_URL:-https://homelifepay.iepose.cn}
      # 登录页商店入口（浏览器用）。客户机**只有**公网这一条路（本机没有商店容器），
      # 所以这里显式写死：既不依赖「向商店问地址」那一步的网络往返，也不会在商店临时
      # 不可达时把入口弄丢。别再兜底成 127.0.0.1 —— 那是**访问者自己**的电脑。
      APP_STORE_URL: ${APP_STORE_URL:-https://homelifepay.iepose.cn}
      # 公钥缓存：首次从商店取回后即可离线启动。
      APP_CLIENT_KEYS_DIR: /data/client-keys
      # 会话 / CSRF Cookie：auto = 按本次请求实际协议判定（8801 明文不带、8803 或反代带）。
      COOKIE_SECURE: "auto"
      # 可信代理：回环 = 容器内 Caddy；docker 网段 = 宿主机 / 其它容器里的隧道客户端
      # （纯局域网部署可删回 127.0.0.1,::1）。
      APP_TRUSTED_PROXIES: 127.0.0.1,::1,172.16.0.0/12
      UVICORN_FORWARDED_ALLOW_IPS: 127.0.0.1,::1,172.16.0.0/12
      # 本机也走反代 / 内网穿透时填浏览器用的公网地址（例如 https://home.example.com）；
      # 纯局域网留空即可。填了之后**局域网 IP:端口 仍然可用**（同源判定与 WebSocket 都
      # 额外接受「与本请求 Host 同源」）；不填时公网域名的实时通道也能靠这条同源兜底建立，
      # 填它只是为了在反代改写 Host 的场景下更稳。
      APP_BASE_URL: ${HOMEOS_PUBLIC_URL:-}
      # 内网 HTTPS(8803) 的证书签给谁：用 IP 访问时填那个 IP（用主机名访问可不改）。
      APP_HTTPS_DEFAULT_SNI: ${APP_HTTPS_DEFAULT_SNI:-homeos.local}
    volumes:
      - homeos-data:/data
      - homeos-secrets:/run/secrets
      # 备份包落到**本文件同目录**的 ./backups，宿主机直接可见（拷贝 / 归档 / 换机迁移
      # 都不必再 docker cp）。容器内路径仍是 /data/backups，与镜像默认一致。
      - ./backups:/data/backups
      # 授权实例指纹来源，必须先建好符号链接（见文件头）。
      - /host/etc/machine-id:/host/etc/machine-id:ro
      - /host/sys/class/dmi/id:/host/sys/class/dmi/id:ro
    healthcheck:
      # 应用与内置反代都要活着才算健康。
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8801/health/ready >/dev/null && curl -fsSk https://localhost:8803/health/ready >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  homeos-data:      # 数据（公钥缓存等；备份包走 ./backups 的 bind mount）
  homeos-secrets:   # 签名密钥
