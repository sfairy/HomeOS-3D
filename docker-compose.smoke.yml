# CI / 本地冒烟：叠在 docker-compose.yml 上，使用本机刚 build 的 smoke 标签
#
#   docker compose -f docker-compose.yml -f docker-compose.smoke.yml up -d --wait
#   docker compose -f docker-compose.yml -f docker-compose.smoke.yml down -v

services:
  homeos-3d-store:
    image: homeos-3d-store:smoke
    pull_policy: never
    environment:
      STORE_ADMIN_EMAIL: smoke-admin@example.com
      STORE_ADMIN_PASSWORD: smoke-admin-pass-ChangeMe1
      STORE_ALLOW_MOCK_PAYMENTS: "0"
      STORE_BASE_URL: http://127.0.0.1:18082

  homeos-3d:
    image: homeos-3d:smoke
    pull_policy: never
    environment:
      APP_BASE_URL: http://127.0.0.1:18081
      APP_LICENSE_SERVER_URL: http://homeos-3d-store:18082
