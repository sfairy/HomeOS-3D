# HomeOS 授权商店 —— 独立 compose 项目

name: homeos-3d-store

services:
  homeos-3d-store:
    image: ${HOMEOS_STORE_IMAGE:-ghcr.io/sfairy/homeos-3d-store:latest}
    container_name: homeos-3d-store
    restart: unless-stopped
    # 容器内先转 SIGTERM 给商店进程（优雅关连接）再停 Caddy，最多各 10s；
    # 比 docker 默认的 10s 宽裕，避免收尾未完成就被 SIGKILL。
    stop_grace_period: 30s
    ports:
      # 8802：HTTP 直连备用；8804：镜像内置 Caddy 的内网 HTTPS 入口。
      - "${STORE_PUBLISH_PORT:-8802}:8802"
      - "${STORE_PROXY_PUBLISH_PORT:-8804}:8804"
    environment:
      STORE_DATA_DIR: /data
      STORE_LICENSE_KEYS_DIR: /data/license-keys
      # 公钥镜像目录：只读挂给主应用（同机部署），分拆部署则由主应用向 /v2/keys 取回。
      APP_CLIENT_KEYS_DIR: /data/client-keys
      STORE_HOST: 0.0.0.0
      STORE_PORT: "8802"
      STORE_BASE_URL: ${STORE_BASE_URL:-}
      STORE_COOKIE_SECURE: ${STORE_COOKIE_SECURE:-false}
      # 商店自身的可信代理网段：与主应用同理，只有同容器回环上的内置反代能作为对端。
      STORE_TRUSTED_PROXIES: ${STORE_TRUSTED_PROXIES:-127.0.0.1,::1}
      # 发布版本同步：商店定时从 GitHub Releases 拉最新版本，供主应用 /updates 提示升级。
      # 客户机在内网只轮询商店，不直接出网；改 0 可关闭。私有仓库才需要 Token。
      STORE_RELEASE_SYNC_INTERVAL_SECONDS: ${STORE_RELEASE_SYNC_INTERVAL_SECONDS:-21600}
      STORE_GITHUB_REPO: ${STORE_GITHUB_REPO:-sfairy/HomeOS-3D}
      STORE_GITHUB_TOKEN: ${STORE_GITHUB_TOKEN:-}
      # 管理员首次部署请通过浏览器 /setup 页面设置（不支持环境变量 seed）
    volumes:
      - homeos-3d-store-data:/data
      - homeos-3d-license-keys:/data/license-keys
      - homeos-3d-client-keys:/data/client-keys
    networks:
      - homeos-3d-net
    healthcheck:
      # 与镜像内 HEALTHCHECK 对齐：商店和镜像内置反代都要活着才算健康
      # （HTTP 直连端口此时可能仍然可用，所以必须单独探一次 HTTPS）。
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8802/healthz >/dev/null && curl -fsSk https://localhost:8804/healthz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  # 固定名字、由本项目创建；主应用以 external 方式加入同一网络。
  homeos-3d-net:
    name: homeos-3d-net

volumes:
  homeos-3d-store-data:
  homeos-3d-license-keys:
  # 固定名字、由本项目创建；主应用以 external 方式只读挂载。
  homeos-3d-client-keys:
    name: homeos-3d-client-keys
