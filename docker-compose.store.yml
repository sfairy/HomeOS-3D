# HomeOS 授权商店 —— 独立 compose 项目

name: homeos-3d-store

services:
  homeos-3d-store:
    image: ${HOMEOS_STORE_IMAGE:-ghcr.io/sfairy/homeos-3d-store:latest}
    container_name: homeos-3d-store
    restart: unless-stopped
    ports:
      - "${STORE_PUBLISH_PORT:-18082}:18082"
    environment:
      STORE_DATA_DIR: /data
      STORE_LICENSE_KEYS_DIR: /data/license-keys
      APP_CLIENT_KEYS_DIR: /data/keys
      STORE_HOST: 0.0.0.0
      STORE_PORT: "18082"
      STORE_BASE_URL: ${STORE_BASE_URL:-}
      STORE_COOKIE_SECURE: ${STORE_COOKIE_SECURE:-false}
      STORE_TRUSTED_PROXIES: ${STORE_TRUSTED_PROXIES:-}
      # 管理员首次部署请通过浏览器 /setup 页面设置（不支持环境变量 seed）
    volumes:
      - homeos-3d-store-data:/data
      - homeos-3d-license-keys:/data/license-keys
      - homeos-3d-client-keys:/data/keys
    networks:
      - homeos-3d-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18082/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  # 固定名字、由本项目创建；主应用以 external 方式加入同一网络。
  homeos-3d-net:
    name: homeos-3d-net

volumes:
  homeos-3d-store-data:
  homeos-3d-license-keys:
  # 固定名字、由本项目创建；主应用以 external 方式只读挂载。
  homeos-3d-client-keys:
    name: homeos-3d-client-keys
