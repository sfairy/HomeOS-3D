# HomeOS —— 管理员 / 开发者部署：授权商店 + 主应用同机（自包含，不需要 .env）
#
#   docker compose up -d
#
# 不变式：用这份文件，商店与主应用永远在同一台机器、同一个网络。主应用出站固定走服务名
# http://homeos-store:8802，授权公钥走共享卷（启动时不联网）。客户机那份是
# docker-compose.app.yml（只有主应用，商店地址写死公网域名）。
#
# 四条地址链路，别混：
#   ① 容器 → 商店      APP_LICENSE_SERVER_URL=http://homeos-store:8802（写死，别改成域名）
#   ② 浏览器 → 主应用  https://homelife.iepose.cn（穿透）/ http://<IP>:8801、https://<IP>:8803（内网）
#   ③ 浏览器 → 商店    **跟着访问者走**：从内网 IP 打开主应用 → http://<同一IP>:8802；
#                      从公网域名打开 → https://homelifepay.iepose.cn。APP_STORE_URL 留空，
#                      由 domains/store/discovery.py 推导（同机 IP 访问时不联网、不依赖穿透状态）。
#   ④ 支付平台 → 商店  由 STORE_BASE_URL 推导的回调地址（必须填公网域名）
#
# 入口组合（两条入口必须同时可用，缺一不可）：
#   ├ 内网  http://<IP>:8801 · https://<IP>:8803（自签）· 商店 http://<IP>:8802
#   └ 公网  https://homelife（主应用）· https://homelifepay（商店），TLS 在隧道/跳板机边缘终止
#   公网只解析到一个域名时，另一条入口的链接会指不过去；两条都要映射（见 TUNNEL-ACCESS.md）。
#
# 端口：8801 / 8803 主应用（HTTP / 镜像内置自签 HTTPS）、8802 商店（HTTP）。
# 商店不提供 HTTPS，也没有 8804 —— 公网 TLS 只终止在隧道 / 跳板机的 80·443 上。
# 穿透回灌：主应用 → 127.0.0.1:8801，商店 → 127.0.0.1:8802（TLS 只终止在隧道边缘）。
#
# 首次启动：
#   sudo mkdir -p /host/etc /host/sys/class/dmi
#   sudo ln -sfn /etc/machine-id   /host/etc/machine-id
#   sudo ln -sfn /sys/class/dmi/id /host/sys/class/dmi/id     # 必须在首次 up 之前建好
#   docker compose up -d
#   docker logs homeos-store 2>&1 | grep -m1 SETUP-TOKEN=     # 用它打开 /setup 建管理员
#
# 后续步骤（发激活码、客户机注册）、公网接入、内网穿透、上线自检：
#   README.md · ops/deploy/PUBLIC-ACCESS.md · ops/deploy/TUNNEL-ACCESS.md
#
# 升级：docker compose pull && docker compose up -d。永远不要 down -v（会连数据卷一起删）。

name: homeos

services:
  homeos-store:
    image: ghcr.io/sfairy/homeos-store:latest
    container_name: homeos-store
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      # 只发布 8802：局域网直连与公网反代 / 隧道都从这里进。
      # ⚠ 8802 不要对公网放行（Docker 端口映射会绕过 ufw，用云安全组收敛）；
      #    只想给内网网卡开放时写成 "192.168.1.20:8802:8802"。
      - "8802:8802"
    environment:
      APP_ENVIRONMENT: production
      STORE_DATA_DIR: /data
      # 授权密钥与公钥镜像（主应用只读挂载后者）。
      STORE_LICENSE_KEYS_DIR: /data/license-keys
      APP_CLIENT_KEYS_DIR: /data/client-keys
      STORE_HOST: 0.0.0.0
      STORE_PORT: "8802"
      # 商店的对外身份：支付回调、同源判定、商店链接都按它推导。
      # 必须是公网域名（不能是 8802 / 服务名）；内网 http 直连是另一个入口，不改这里。
      # 换域名时用同名环境变量覆盖，别改这份被跟踪的文件（改完容易连自己的域名一起提交）。
      STORE_BASE_URL: ${STORE_BASE_URL:-https://homelifepay.iepose.cn}
      # 站点默认客服邮箱（只影响新建站点；之后在 /admin 改）。留空 = 内置默认值。
      STORE_SUPPORT_EMAIL: ${STORE_SUPPORT_EMAIL:-}
      # 会话 Cookie 的 Secure：auto = 按本次请求实际协议判定（https 带、内网 http 不带）。
      # true / false 只适合单一协议部署，双入口请保持 auto。依赖入口透传 X-Forwarded-Proto。
      STORE_COOKIE_SECURE: "auto"
      # 可信代理：127.0.0.1,::1 = 容器内回环；172.16.0.0/12 = 宿主机反代 / 隧道进来的
      # 网桥网关，以及容器化入口。网段与 homeos-net 实际地址池不一致时按实际值改。
      STORE_TRUSTED_PROXIES: 127.0.0.1,::1,172.16.0.0/12
      # 商店没有任何 HTTPS 入口：内网 http://<IP>:8802，公网由隧道 / 反代在 80·443 终止 TLS。
      # 验证码投递：log = 只写容器日志（首装够用）。公开售卖前请在 /admin 配好 SMTP，
      # 否则客户收不到验证码。
      STORE_MAIL_MODE: log
      # 这台出不了外网就填 "0"，避免周期性 GitHub 连接失败日志。
      # STORE_RELEASE_SYNC_INTERVAL_SECONDS: "21600"
    volumes:
      - homeos-store-data:/data
      - homeos-license-keys:/data/license-keys
      - homeos-client-keys:/data/client-keys
    networks:
      - homeos-net
    healthcheck:
      # 商店只有一个对外服务端口：8802。
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8802/healthz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  homeos:
    image: ghcr.io/sfairy/homeos:latest
    container_name: homeos
    # 固定 hostname：授权实例指纹会把它编进去，换掉等于换设备。
    hostname: homeos
    restart: unless-stopped
    stop_grace_period: 30s
    # 商店先 healthy 再起主应用，省掉首次启动取公钥的等待。
    depends_on:
      homeos-store:
        condition: service_healthy
    ports:
      # 8801：HTTP 直连；8803：内置 Caddy 的 HTTPS（自签证书）。
      - "8801:8801"
      - "8803:8803"
    environment:
      APP_ENVIRONMENT: production
      # 容器出站：同项目服务名，永远不用改（换 IP / 域名 / 入口抖动都不影响）。
      APP_LICENSE_SERVER_URL: http://homeos-store:8802
      # 浏览器打开的商店地址（登录页「忘记密码 / 商店」）。与上一行用途不同，别混。
      #
      # 这里**留空**是有意的：开发者这台有两个入口 —— 局域网 `http://<IP>:8801` 与公网
      # 域名 —— 商店入口必须跟着**访问者此刻用的那个**走（局域网 → `<同一 IP>:8802`，
      # 公网 → STORE_BASE_URL 声明的商店域名）。写死任一个都会让另一条入口点不过去：
      # 局域网用户被送去公网域名（穿透一抖就 404，而旁边的 :8802 明明是通的）。
      # 推导逻辑见 domains/store/discovery.py（同机 + IP 访问时不联网）。
      APP_STORE_URL: ${APP_STORE_URL:-}
      # 公钥来自共享卷（只读），这条路径不联网。
      APP_CLIENT_KEYS_DIR: /shared-keys
      # 会话 / CSRF Cookie：auto = 按本次请求实际协议判定（双入口部署必须用它）。
      COOKIE_SECURE: "auto"
      # 可信代理：回环 = 容器内 Caddy；docker 网段 = 宿主机上的隧道客户端 / 反代。
      # 隧道回灌到发布端口时，容器看到的源是网桥网关（172.x），不是 127.0.0.1。
      APP_TRUSTED_PROXIES: 127.0.0.1,::1,172.16.0.0/12
      UVICORN_FORWARDED_ALLOW_IPS: 127.0.0.1,::1,172.16.0.0/12
      # 主应用公网地址（穿透后的域名）。同源校验、WebSocket 来源、socket.io 白名单都认它；
      # 填了之后局域网 IP 直连仍然可用（校验同时接受与本请求 Host 同源）。
      APP_BASE_URL: ${APP_BASE_URL:-https://homelife.iepose.cn}
      # 内网 HTTPS(8803) 的证书签给谁：用 IP 访问时填那个 IP（用主机名访问可不改）。
      APP_HTTPS_DEFAULT_SNI: ${APP_HTTPS_DEFAULT_SNI:-homeos.local}
    volumes:
      - homeos-data:/data
      - homeos-secrets:/run/secrets
      - homeos-client-keys:/shared-keys:ro
      # 授权实例指纹来源，必须先建好符号链接（见文件头）。
      - /host/etc/machine-id:/host/etc/machine-id:ro
      - /host/sys/class/dmi/id:/host/sys/class/dmi/id:ro
    networks:
      - homeos-net
    healthcheck:
      # 应用与内置反代都要活着才算健康。
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8801/health/ready >/dev/null && curl -fsSk https://localhost:8803/health/ready >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # 可选：内置 Caddy 入口（真实证书 HTTPS，自动申请续期）。
  # 只在本机 80/443 没有别的入口时才开 —— 已有 openresty / NAS 反代不要开（会抢端口）。
  # 开启时把下面整段与文件末尾两个 caddy-public-* 卷一起取消注释，并在仓库根执行 compose
  # （挂载用的是相对路径 ./ops/deploy/...）。商店 environment 已按公网口径配好，不用改。
  #
  # caddy-public:
  #   image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
  #   container_name: homeos-store-caddy
  #   restart: unless-stopped
  #   depends_on:
  #     - homeos-store
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   environment:
  #     STORE_DOMAIN: ${STORE_DOMAIN:-homelifepay.iepose.cn}
  #     ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL 必填}   # 证书通知邮箱，不能是个人默认值
  #   volumes:
  #     - ./ops/deploy/Caddyfile.public.example:/etc/caddy/Caddyfile:ro
  #     - caddy-public-data:/data
  #     - caddy-public-config:/config
  #   networks:
  #     - homeos-net

networks:
  homeos-net:
    name: homeos-net

volumes:
  homeos-store-data:     # 商店：库、订单、审计、授权私钥
  homeos-license-keys:
  homeos-client-keys:    # 商店写、主应用只读的公钥镜像
  homeos-data:           # 主应用：数据（含 backups）
  homeos-secrets:        # 主应用：签名密钥
  # 开启上方 caddy-public 时取消注释：
  # caddy-public-data:
  # caddy-public-config:
