# HomeOS —— 开发者 / 管理员部署（授权商店 + 主应用，一份文件）
#
#   docker compose up -d
#
# 这份是**你（开发 / 运营）自己这台**用的：商店与主应用一起起，开箱即用。
# 发给客户的那份是 docker-compose.app.yml（只有主应用，填一处商店地址即可）。
# 两份同项目名 / 同服务名 / 同卷名，所以客户机将来若想换成这份也不会换错数据。
#
# 自包含：不需要 .env、不需要脚本、不依赖仓库其余部分，值全部写死在文件里，
# 所以也可以直接粘进 NAS（飞牛 / 群晖 / unRAID）的 Docker 界面「项目」里 —— 界面不读 .env，
# 占位符反而要在界面里手填一堆。
#
# 两个服务：
#   homeos-store  授权商店：发授权公钥、发激活码、代发主应用注册用的邮箱验证码。
#                 客户机的 docker-compose.app.yml 会连到它，所以这台的地址别随便换。
#   homeos        主应用（就是你要用的那套面板）。
#
# 版本用 :latest 跟随最新发布；想钉版就换成具体 tag（amd64 / arm64 同一份 tag，Docker 按
# 宿主架构自动选）。已发布的 tag 见 https://github.com/sfairy/HomeOS-3D/pkgs/container/homeos
#
# ---------------------------------------------------------------- 用之前不用改任何东西
# 这份编排里两个服务在同一台机器上，两条地址链路是这样定的：
#   容器出站 → 商店：APP_LICENSE_SERVER_URL 走容器内网服务名（http://homeos-store:8802），
#                   已经写死，不用改
#   浏览器 → 商店：https://homelifepay.iepose.cn —— 商店自己按 STORE_BASE_URL 答这个地址
#                   （见下面 homeos-store 的 environment），所以 APP_STORE_URL 不用填
# 换成别的域名时，只需改下面 homeos-store 的 STORE_BASE_URL 一处 + 客户机那份的
# APP_LICENSE_SERVER_URL；主应用容器内部地址与它无关。
#
# 占用端口：8801 / 8803（主应用 HTTP / 内置 HTTPS）、8802 / 8804（商店 HTTP / 内置 HTTPS）。
# 冲突时改 `ports:` 左侧的宿主端口即可（容器内端口不变）。
#
# ---------------------------------------------------------------- 首次启动
# ① 先建 /host 符号链接（必须在第一次 up -d **之前**，否则 Docker 会把路径建成目录，
#    之后再也 ln 不上去，授权指纹退化成可拷贝的兜底 ID）：
#      sudo mkdir -p /host/etc /host/sys/class/dmi
#      sudo ln -sfn /etc/machine-id   /host/etc/machine-id
#      sudo ln -sfn /sys/class/dmi/id /host/sys/class/dmi/id
# ② 确认域名已指向本机、入口放行 80/443，然后 docker compose up -d（或界面里启动），
#    等两个容器 healthy。
# ③ 创建商店管理员：商店还没有管理员时，启动日志里有引导密钥
#      docker logs homeos-store | grep -A4 '引导密钥'
#    打开 https://homelifepay.iepose.cn/setup 填入（本机调试也可以走
#    http://127.0.0.1:8802/setup；注意 STORE_COOKIE_SECURE 已开，会话 Cookie 带 Secure，
#    个别浏览器会拒收 http 下的 Secure Cookie —— 那就改用 https://127.0.0.1:8804/setup）。
# ④ 商店前台注册一个客户账号：https://homelifepay.iepose.cn/user/authentication/register
#    验证码默认走**日志**（STORE_MAIL_MODE=log，见下），取码：
#      docker logs homeos-store | grep 验证码
# ⑤ 后台 https://homelifepay.iepose.cn/admin/licenses（「激活码」页）给这个邮箱发一个激活码。
#    注意该页要求邮箱**已有商店账号**（否则报「该邮箱尚未注册账号」），所以第 ④ 步不能跳。
#    发给客户时，把 ② 里那份 docker-compose.app.yml 连同这个地址和激活码一起交出去。
# ⑥ 主应用打开 http://192.168.1.20:8801/register 注册本机账号（验证码同样在商店日志里），
#    随后按提示填第 ⑤ 步的激活码。（HTTPS 入口 https://192.168.1.20:8803，自签证书点继续访问。）
#    登录页的「忘记密码 / 商店」会跳到 https://homelifepay.iepose.cn（见上面「浏览器 → 商店」）。
#
# ---------------------------------------------------------------- 公网商店（卖授权 / 跨网络）
# 客户机分布在不同网络、或要收款（支付宝 / 微信的异步回调必须公网可达）时，需要真实域名 +
# 可信证书 HTTPS（镜像内置的 8804 是自签，客户机与支付平台都不认）。
#
# **本文件已按公网口径配好**（商店的 STORE_BASE_URL / Cookie Secure / 可信代理）。
# 唯一要你自己保证的是「80/443 上有一层带真实证书的入口指向商店」：
#   - 你已有的 openresty / NAS 系统反代：把 homelifepay.iepose.cn 反代到本机
#     http://127.0.0.1:8802（转发时要带上 Host 与 X-Forwarded-Proto: https）；
#   - 没有现成入口：取消注释下面的「可选：内置 Caddy 入口」段（会占用 80/443）。
# 前提、验证与排错见 ops/deploy/PUBLIC-ACCESS.md。
#
# ---------------------------------------------------------------- 升级 / 回滚
# 改镜像 tag（或就用 :latest）后：
#   docker compose pull && docker compose up -d
# 只重启容器不会换镜像；**永远不要** `docker compose down -v`（那会连数据卷一起删）。
#
# 数据卷名都带项目名 homeos 前缀（见文件末尾 volumes:）。从更早的多文件编排迁过来时注意
# 商店侧卷名会变（旧的 `homeos-store_*` → 新的 `homeos_*`），直接切会看到空商店；
# 需要保留就先把旧卷内容拷进新卷再启动。主应用侧卷名不变，可直接沿用。
#
# 数据/端口/前端目录等默认值镜像里都有（/data、/data/backups、8801、/app/dist），故不写。

name: homeos

services:
  homeos-store:
    image: ghcr.io/sfairy/homeos-store:latest
    container_name: homeos-store
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      # 8802：HTTP 直连（局域网 / 本机调试都走它）；8804：内置 Caddy 的内网 HTTPS 入口。
      # 公网入口只应是 80/443（域名 + 真实证书），所以请确认这两行**没有被公网放行**：
      # 一旦能从公网直连 8802，就是一条绕过 HTTPS 与反代的明文后台入口。
      # 想彻底断掉这条路，把两行左侧改成 127.0.0.1:（本机反代仍能连，局域网就连不上了）。
      - "8802:8802"
      - "8804:8804"
    environment:
      APP_ENVIRONMENT: production
      STORE_DATA_DIR: /data
      # 授权密钥：空卷也没关系，启动器会在首次启动时生成并同步公钥镜像。
      STORE_LICENSE_KEYS_DIR: /data/license-keys
      # 公钥镜像目录：主应用只读挂载它（同机部署不必走网络取回公钥）。
      APP_CLIENT_KEYS_DIR: /data/client-keys
      STORE_HOST: 0.0.0.0
      STORE_PORT: "8802"
      # ── 公网接入（真实域名 https://homelifepay.iepose.cn）──
      # 商店的对外身份：商店链接、同源校验、注册/登录、支付回调地址都按它推导。
      # 它必须是浏览器与客户机容器都能访问的地址（内网直连 8802 会跨不过 HTTPS）。
      STORE_BASE_URL: https://homelifepay.iepose.cn
      # 公网只走 HTTPS：会话 Cookie 加 Secure，明文请求不再被当成同源。
      STORE_COOKIE_SECURE: "true"
      # TLS 在商店容器之外终止（本机反代 / NAS 反代 / 已有的 openresty），
      # 所以可信代理要放开到「反代容器所在网段」：否则 uvicorn 会把反代当成客户端本人，
      # 真实来源 IP、登录限流与审计一起失真，同源判定也会跟着错。
      STORE_TRUSTED_PROXIES: 172.16.0.0/12
      UVICORN_FORWARDED_ALLOW_IPS: 172.16.0.0/12
      # 内置 HTTPS(8804) 的证书签给谁：同 APP_HTTPS_DEFAULT_SNI，填你实际输入的地址
      # （局域网 IP 或主机名）。留空/默认 = store.local。公网接入用的是真实证书域名，
      # 与这里无关（见 ops/deploy/Caddyfile.public.example）。
      STORE_HTTPS_DEFAULT_SNI: ${STORE_HTTPS_DEFAULT_SNI:-store.local}
      # 验证码投递方式。log = 只写日志（docker logs homeos-store | grep 验证码），
      # 适合还没配 SMTP 的首装；配好 SMTP 在后台「站点配置 → 邮件」切到 smtp 即可，
      # 也可以在这里直接写 smtp 并补 STORE_SMTP_* 环境变量。
      STORE_MAIL_MODE: log
      # 商店定时问 GitHub 拿最新版本（客户机在内网只问商店）。这台出不了外网就填 "0" 关掉，
      # 否则会周期性在日志里留一条 GitHub 连接失败。
      # STORE_RELEASE_SYNC_INTERVAL_SECONDS: "21600"
    volumes:
      - homeos-store-data:/data
      - homeos-license-keys:/data/license-keys
      - homeos-client-keys:/data/client-keys
    networks:
      - homeos-net
    healthcheck:
      # 与镜像内 HEALTHCHECK 对齐：商店和内置反代都要活着才算健康
      # （HTTP 直连端口此时可能仍然可用，所以必须单独探一次 HTTPS）。
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8802/healthz >/dev/null && curl -fsSk https://localhost:8804/healthz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  homeos:
    image: ghcr.io/sfairy/homeos:latest
    container_name: homeos
    # 固定 hostname：授权实例指纹在缺少机器/主板标识时会把容器 hostname 编进去，
    # 换掉它等于换设备。别改这行。
    hostname: homeos
    restart: unless-stopped
    stop_grace_period: 30s
    # 商店先 healthy 再起主应用：公钥镜像已写好，省掉首次启动的取回等待。
    depends_on:
      homeos-store:
        condition: service_healthy
    ports:
      # 8801：HTTP 直连；8803：镜像内置 Caddy 的 HTTPS 入口（自签证书）。
      - "8801:8801"
      - "8803:8803"
    environment:
      APP_ENVIRONMENT: production
      # 容器内部直连商店：同一个 compose 项目里用**服务名**解析即可，不必走宿主 IP。
      # 注意这条**不参与**登录页链接 —— 那是给浏览器的，见下面 APP_STORE_URL 的说明。
      APP_LICENSE_SERVER_URL: http://homeos-store:8802
      # 商店的**浏览器入口**地址不用填：主应用问商店「你的对外地址是什么」，商店配了
      # STORE_BASE_URL（本文件已配成 https://homelifepay.iepose.cn）就答这个地址，
      # 于是登录页的「忘记密码 / 商店」直接跳过去。
      # 只有商店没配 STORE_BASE_URL 时才需要推导 —— 那时商店答的是容器服务名
      # （http://homeos-store:8802），浏览器解析不了，主应用会把主机名换成浏览器正在用的
      # 那个（局域网 IP / 域名，端口沿用商店的回答），所以这台机器换 IP / 换域名都不用
      # 改这里。推导出的地址不合期望时（例如商店另有一层只给浏览器的反代）再取消注释写死。
      # APP_STORE_URL: http://192.168.1.20:8802
      # 公钥目录改挂商店写出的共享卷（只读）：这条路径不联网、也不写盘。
      APP_CLIENT_KEYS_DIR: /shared-keys
      APP_COOKIE_SECURE: "false"
      # 内置反代就在同容器回环上：只信回环，**不要**放宽到 docker 网段。
      APP_TRUSTED_PROXIES: 127.0.0.1,::1
      UVICORN_FORWARDED_ALLOW_IPS: 127.0.0.1,::1
      # 内置 HTTPS(8803) 的证书签给谁：填你**实际输入**的那个地址（一般就是本机局域网 IP）。
      # 浏览器用 IP 访问不发 SNI，不填这个名字 Caddy 只能签给容器自己的 docker IP，浏览器
      # 会判「证书与地址不匹配」而打不开（见 ops/caddy/app.Caddyfile 的说明）。
      # 用主机名访问（https://homeos.local:8803）则天然匹配，不改这行也行。
      APP_HTTPS_DEFAULT_SNI: ${APP_HTTPS_DEFAULT_SNI:-homeos.local}
    volumes:
      - homeos-data:/data
      - homeos-secrets:/run/secrets
      - homeos-client-keys:/shared-keys:ro
      # 授权实例指纹的来源（宿主标识）。**必须先建好符号链接**，见文件头 ①。
      - /host/etc/machine-id:/host/etc/machine-id:ro
      - /host/sys/class/dmi/id:/host/sys/class/dmi/id:ro
    networks:
      - homeos-net
    healthcheck:
      # 应用和镜像内置反代都要活着才算健康（HTTP 直连端口可能仍可用，故单独探一次 HTTPS）。
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8801/health/ready >/dev/null && curl -fsSk https://localhost:8803/health/ready >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────────────────
  # 可选：内置 Caddy 入口（真实域名 + 可信证书 HTTPS，自动申请与续期）
  #
  # **只有「本机没有别的入口」时才需要**。已经有 openresty / NAS 系统反代在 80/443 上服务
  # homelifepay.iepose.cn 的就不要开这段 —— 会抢端口，而且两层入口重复终止 TLS 更容易出错。
  # 那种情况下你只要保证：反代把 homelifepay.iepose.cn 转到 http://127.0.0.1:8802，
  # 并带上 Host 与 X-Forwarded-Proto: https。
  #
  # 要开就把下面整段取消注释（含文件末尾 volumes: 里那两行）。域名与邮箱已经填好，
  # 用的是 ops/deploy/Caddyfile.public.example —— 那个文件必须和执行 compose 的目录保持
  # 相对路径一致（下面挂载是 ./ops/deploy/...，所以在仓库根执行；把它单独拷到别处时记得
  # 一起改路径，**别让挂载源缺失**：Docker 会把缺失的 bind 源建成空目录，Caddy 起不来）。
  #
  # 为什么不能直接用镜像内置的 8804：那是 Caddy 内部 CA 的**自签**证书，客户机里的主应用
  # （httpx / urllib 按系统 CA 校验）会直接拒绝，支付平台也不认。
  #
  # 商店的 environment（STORE_BASE_URL / STORE_COOKIE_SECURE / STORE_TRUSTED_PROXIES /
  # UVICORN_FORWARDED_ALLOW_IPS）**已经**按公网口径配好，开这段不用再动它们。
  #
  # caddy-public:
  #   # 按 digest 钉死（真源 ops/docker-pins.json）。这个容器在**公网**上（80/443），并且
  #   # 握着 ACME 账号与证书：只写 `caddy:2.11.4-alpine` 是可变引用，上游重推 tag 后同一份
  #   # compose 会拉起成分不同的入口进程。钉的是多架构清单摘要，amd64 / arm64 都能解析。
  #   image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
  #   container_name: homeos-store-caddy
  #   restart: unless-stopped
  #   depends_on:
  #     - homeos-store
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   environment:
  #     STORE_DOMAIN: homelifepay.iepose.cn
  #     # Caddy 的 email 指令不接受空值（空会让配置解析失败），所以必填。
  #     ACME_EMAIL: 156120718@qq.com
  #   volumes:
  #     - ./ops/deploy/Caddyfile.public.example:/etc/caddy/Caddyfile:ro
  #     # 证书与 ACME 账号数据：容器重建不丢，删卷会重新申请（可能触发 ACME 限流）。
  #     - caddy-public-data:/data
  #     - caddy-public-config:/config
  #   networks:
  #     - homeos-net
  #   # 开完还是同一条命令：
  #   #   docker compose up -d
  #   # 验证、回调地址与排错见 ops/deploy/PUBLIC-ACCESS.md。
  # ─────────────────────────────────────────────────────────────────────────────
networks:
  # 固定名字：「可选：内置 Caddy 入口」段里的 caddy-public 也要加入这个网络才能反代到商店。
  homeos-net:
    name: homeos-net

volumes:
  # 商店：库、订单、审计与授权私钥
  homeos-store-data:
  homeos-license-keys:
  # 商店写、主应用只读的授权公钥镜像
  homeos-client-keys:
  # 主应用：数据（含 backups）与签名密钥
  homeos-data:
  homeos-secrets:
  # 用到上面的「内置 Caddy 入口」段时，把这两行也取消注释：
  # caddy-public-data:
  # caddy-public-config:
