name: Docker

on:
  # 本工作流只负责「构建并推送镜像」。部署不在 CI 里做：镜像推到 GHCR 后，
  # 在目标机上跑 ops/deploy/deploy.sh（三种形态与跨机拓扑见 ops/deploy/SPLIT-DEPLOY.md）。
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# GHCR 推送认证：
# - 默认用 GITHUB_TOKEN（需 packages: write）。
# - 若包是以前用个人 PAT 创建的，Actions 常报 write_package denied：
#   1) 在 package settings → Manage Actions access 给本仓库 Write；或
#   2) 仓库 Secrets 加 GHCR_TOKEN = classic PAT（write:packages），本工作流会优先用它。

concurrency:
  group: docker-${{ github.ref }}
  # 发布路径**不得取消**：两个架构各自先推 `<tag>-amd64` / `<tag>-arm64` 单架构镜像，
  # 再由 merge job 合成 manifest list。中途取消会留下「单架构已推、manifest list 还是旧版本」
  # 的半成品，而 `latest` 指针可能已指向其中之一 —— 这种状态在 `docker pull` 端表现为
  # 「拉到的镜像与标签承诺的版本不一致」，且只能靠人工重跑发布修复。
  # 非默认分支（`sha-<short>` 的测试构建，见 meta job 的 release 判定）仍允许取消，省 runner。
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

env:
  REGISTRY: ghcr.io

# runner 与 action 版本都显式钉住，不跟随浮动标签：
# - runner 不用 ubuntu-latest：该标签自 2026-10-19 起迁往 Ubuntu 26，钉 24.04 可避免
#   迁移当天的意外，也与 arm64 侧既有的 ubuntu-24.04-arm 保持一致。
# - action 全部选使用 Node 24 运行时的大版本。GitHub 已弃用 Node 20，
#   checkout@v4 / setup-buildx@v3 / login@v3 / build-push@v6 均已触发告警；
#   以下版本起改用 Node 24（已逐个核对本流程用到的全部输入在新版中仍然存在）。
jobs:
  # 只算一次版本与镜像名，后续 build / merge 全部复用。
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      # 版本号唯一来源：仓库根 package.json 的 version。
      # 发布标签只有两个：该版本号（如 0.7.6）与 latest，且只在默认分支推送，
      # 避免分支构建覆盖发布指针；非默认分支退化为 sha-<short>。
      # 镜像基名与仓库名解耦：仓库名里的 `-3d` 后缀不再出现在镜像上。
      #   主应用 ghcr.io/<namespace>/homeos
      #   授权商店 ghcr.io/<namespace>/homeos-store   （由矩阵 suffix: "-store" 拼出）
      # namespace 默认取仓库属主（小写）；需要推到别处时用仓库变量 IMAGE_NAMESPACE 覆盖。
      - id: meta
        run: |
          version="$(sed -n 's/^  "version":[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::package.json 里没有 version，无法确定镜像 tag"
            exit 1
          fi
          namespace="${{ vars.IMAGE_NAMESPACE }}"
          if [ -z "$namespace" ]; then
            namespace='${{ github.repository_owner }}'
          fi
          namespace="$(echo "$namespace" | tr '[:upper:]' '[:lower:]')"
          base="${REGISTRY}/${namespace}/homeos"
          if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            tag="$version"
            release=true
          else
            tag="sha-${GITHUB_SHA::7}"
            release=false
          fi
          {
            echo "version=${version}"
            echo "image=${base}"
            echo "tag=${tag}"
            echo "release=${release}"
          } >> "$GITHUB_OUTPUT"

  # 轻检查（typecheck+lint / 前端门禁 / 契约与度量 / ruff / pyright / schema / smoke）
  # 统一定义在 checks.yml。
  # 这里调用它而不是内联复制：同一份定义既当构建门禁，也（在手动跑 checks 时）独立可跑 ——
  # 复制两份必然漂移，而「一处改了另一处没改」正是 checks.yml 顶部记录的成因。
  # 注意：checks.yml 的 push / PR 自动触发已于 2026-10-15 移除，只保留 workflow_call
  # 与手动 dispatch；这条 `uses:` 是它唯一被自动带起来的地方，删掉本行等于门禁全空。
  checks:
    uses: ./.github/workflows/checks.yml

  # 两个架构各跑在**原生** runner 上，不用 QEMU：构建期要用 Cython + gcc 把 Python
  # 编译成 per-arch 的 .so，模拟执行会慢到不可用。
  # 每个矩阵项只推一个 <tag>-<arch> 单架构镜像，manifest list 交给 merge 合成。
  build:
    needs: [meta, checks]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: app
            project: app
            suffix: ""
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - target: app
            project: app
            suffix: ""
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - target: store
            project: store
            suffix: "-store"
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - target: store
            project: store
            suffix: "-store"
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      # 联网核对真源里的 tag 与摘要是否**仍然配对**（判据与放置位置的理由见下）。
      #
      # 为什么单独一条：`checks.yml` 里跑的 `verify:contracts` 已经覆盖了「四个镜像面写法一致」，
      # 但「tag 现在解析到的还是那个 digest 吗」只有问 registry 才知道。上游重推同名 tag 后，
      # 本仓库钉住的 digest 仍然可复现，可 `tag@digest` 这句话已经不成立 —— 恰好是「同一份源码
      # 不同时间构建出不同产物」的前夜，也就是这层钉版存在的理由。
      #
      # 为什么放在最前：它只读源码 + 联网，几十毫秒；放在几分钟的前端构建**之前**才能省下
      # 一个 runner 周期。为什么发布路径硬失败：发版前必须把 digest 刷新成新值（`python3
      # ops/check/check_docker_pins.py --verify-remote` 会打印新旧摘要）。非发布分支只作提示，
      # 不让上游动一下 tag 就把所有人的功能分支构建堵死。
      - name: Verify base image pins against the registry
        continue-on-error: ${{ needs.meta.outputs.release != 'true' }}
        run: python3 ops/check/check_docker_pins.py --verify-remote

      # 前端产物由宿主机构建并混淆，落到工作区根 dist/。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Build frontend to workspace dist
        # 定义在 ops/ci/build_frontend_verify.sh：build-check.yml 的「只构建」入口跑同一份，
        # 免得两处的手工断言清单各自漂移。
        run: bash ops/ci/build_frontend_verify.sh

      - uses: docker/setup-buildx-action@v4

      # 后端 Cython 编译成 .so 并导出到根 dist/；运行镜像直接 COPY，不编译后端。
      # 与下面的 build-push-action 共用 gha 缓存 scope，避免后端被编译两遍。
      - name: Export protected backend to workspace dist
        run: |
          python3 ops/build.py backend \
            --project ${{ matrix.project }} \
            --arch ${{ matrix.arch }} \
            --cache-from type=gha,scope=${{ matrix.target }}-${{ matrix.arch }} \
            --cache-to type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.target }} / ${{ matrix.arch }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: true
          # 与 package.json 同源的版本号：镜像里由 src/_version.py 携带。
          # BACKEND_PLATFORM 选根 dist 下的平台子目录（Cython .so 与架构绑定）。
          build-args: |
            HOMEOS_VERSION=${{ needs.meta.outputs.version }}
            BACKEND_PLATFORM=linux-${{ matrix.arch }}
          tags: ${{ needs.meta.outputs.image }}${{ matrix.suffix }}:${{ needs.meta.outputs.tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}
          provenance: false

      # 镜像冒烟：把「镜像能起来」纳入门禁。单架构镜像就在这里验（不必等 manifest list 合成）。
      # 覆盖范围与「为什么 app 只做静态校验」见 `ops/docker/image_smoke.py` 顶部表格：
      #   version        —— 构建期 HOMEOS_VERSION 真烘进了 `app._version`
      #   caddy-config   —— 镜像内 Caddyfile 语法/指令合法
      #   store-liveness —— 真 entrypoint + 真启动器跑起来并等 HEALTHCHECK 健康
      #                     （由此覆盖 lifespan、启动期建库、内置反代起来并反代成功）
      #   key-sync-contract —— 商店私钥**绝不**被同步进主应用公钥目录
      #   caddy-restart  —— 杀掉容器内 caddy，验证守护重启状态机（`ops/docker/proxy.py`）能自愈
      # 这一步在推到 GHCR **之后**：顺带证明「推上去的那份镜像」是可启动的，而不只是本地构建产物。
      - name: Smoke test image (${{ matrix.target }} / ${{ matrix.arch }})
        run: |
          image="${{ needs.meta.outputs.image }}${{ matrix.suffix }}:${{ needs.meta.outputs.tag }}-${{ matrix.arch }}"
          python3 ops/docker/image_smoke.py \
            --image "$image" \
            --project "${{ matrix.project }}" \
            --version "${{ needs.meta.outputs.version }}" \
            --require-docker
        env:
          PYTHONUNBUFFERED: "1"

  # 把 <tag>-amd64 与 <tag>-arm64 合成为一个 manifest list：docker pull 时按宿主架构自动选。
  merge:
    needs: [meta, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: ""
          - suffix: "-store"
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        run: |
          name="${{ needs.meta.outputs.image }}${{ matrix.suffix }}"
          tag="${{ needs.meta.outputs.tag }}"
          args=(-t "${name}:${tag}")
          if [ "${{ needs.meta.outputs.release }}" = "true" ]; then
            args+=(-t "${name}:latest")
          fi
          docker buildx imagetools create "${args[@]}" \
            "${name}:${tag}-amd64" \
            "${name}:${tag}-arm64"

      - name: Inspect image
        run: docker buildx imagetools inspect "${{ needs.meta.outputs.image }}${{ matrix.suffix }}:${{ needs.meta.outputs.tag }}"
