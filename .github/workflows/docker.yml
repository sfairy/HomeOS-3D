name: Docker

on:
  # 本工作流只负责「构建并推送镜像」。部署不在 CI 里做：镜像推到 GHCR 后，在目标机上用
  # 仓库根的两份 compose 文件起容器（开发者 / 管理员这台 docker-compose.yml（含商店）、
  # 客户机 docker-compose.app.yml）。公网接入不是第三个文件，而是 docker-compose.yml
  # 里那段注释配置。
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# GHCR 推送认证：
# - 默认用 GITHUB_TOKEN（需 packages: write）。
# - 若包是以前用个人 PAT 创建的，Actions 常报 write_package denied：
#   1) 在 package settings → Manage Actions access 给本仓库 Write；或
#   2) 仓库 Secrets 加 GHCR_TOKEN = classic PAT（write:packages），本工作流会优先用它。

concurrency:
  group: docker-${{ github.ref }}
  # 发布路径**不得取消**：两个架构各自先推 `<tag>-amd64` / `<tag>-arm64` 单架构镜像，
  # 再由 merge job 合成 manifest list。中途取消会留下「单架构已推、manifest list 还是旧版本」
  # 的半成品，而 `latest` 指针可能已指向其中之一 —— 这种状态在 `docker pull` 端表现为
  # 「拉到的镜像与标签承诺的版本不一致」，且只能靠人工重跑发布修复。
  # 非默认分支（`sha-<short>` 的测试构建，见 meta job 的 release 判定）仍允许取消，省 runner。
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

env:
  REGISTRY: ghcr.io

# runner 与 action 版本都显式钉住，不跟随浮动标签：
# - runner 不用 ubuntu-latest：该标签自 2026-10-19 起迁往 Ubuntu 26，钉 24.04 可避免
#   迁移当天的意外，也与 arm64 侧既有的 ubuntu-24.04-arm 保持一致。
# - action 全部选使用 Node 24 运行时的大版本。GitHub 已弃用 Node 20，
#   checkout@v4 / setup-buildx@v3 / login@v3 / build-push@v6 均已触发告警；
#   以下版本起改用 Node 24（已逐个核对本流程用到的全部输入在新版中仍然存在）。
#   制品一对：upload-artifact@v7 / download-artifact@v8 —— 两者的大版本号从此不再同步，
#   升级时必须一起核对它们的 action.yml 是否仍为 node24，不能凭号段推断。
jobs:
  # 只算一次版本与镜像名，后续 build / merge 全部复用。
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      # 版本号唯一来源：仓库根 package.json 的 version。
      # 发布标签只有两个：该版本号（如 0.7.6）与 latest，且只在默认分支推送，
      # 避免分支构建覆盖发布指针；非默认分支退化为 sha-<short>。
      # 镜像基名与仓库名解耦：仓库名里的 `-3d` 后缀不再出现在镜像上。
      #   主应用 ghcr.io/<namespace>/homeos
      #   授权商店 ghcr.io/<namespace>/homeos-store   （由矩阵 suffix: "-store" 拼出）
      # namespace 默认取仓库属主（小写）；需要推到别处时用仓库变量 IMAGE_NAMESPACE 覆盖。
      - id: meta
        run: |
          version="$(sed -n 's/^  "version":[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::package.json 里没有 version，无法确定镜像 tag"
            exit 1
          fi
          namespace="${{ vars.IMAGE_NAMESPACE }}"
          if [ -z "$namespace" ]; then
            namespace='${{ github.repository_owner }}'
          fi
          namespace="$(echo "$namespace" | tr '[:upper:]' '[:lower:]')"
          base="${REGISTRY}/${namespace}/homeos"
          if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            tag="$version"
            release=true
          else
            tag="sha-${GITHUB_SHA::7}"
            release=false
          fi
          {
            echo "version=${version}"
            echo "image=${base}"
            echo "tag=${tag}"
            echo "release=${release}"
          } >> "$GITHUB_OUTPUT"

  # 轻检查（typecheck / lint / ruff / 前端构建 / 基建 lint）统一定义在 checks.yml。
  # 自定义门禁与冒烟已拆除；这里调用而不是内联复制，避免两处漂移。
  # 调用时 checks 的 build job 会把前端产物传成 frontend-app / frontend-store 制品 ——
  # 前端与 CPU 架构无关，全流水线只该构建一次，再由下面的矩阵按项目取用。
  # 上传的开关在 checks.yml 里（按 `github.event_name` 判定，本工作流是手动 dispatch 所以为真）；
  # 本工作流若哪天改成 push / tag 自动触发，那边的 upload 会静默跳过，而这里的
  # download 会立刻报「artifact not found」—— 是响亮的失败，不是静默出坏镜像。
  checks:
    uses: ./.github/workflows/checks.yml

  # 两个架构各跑在**原生** runner 上，不用 QEMU：构建期要用 Cython + gcc 把 Python
  # 编译成 per-arch 的 .so，模拟执行会慢到不可用。
  # 每个矩阵项只推一个 <tag>-<arch> 单架构镜像，manifest list 交给 merge 合成。
  #
  # 前端**不在这里构建**：产物由上面的 checks.build 上传，这里按项目下载自己那一份。
  # frontend_artifact / frontend_path 与 checks.yml 里的两个 upload 步骤一一对应，
  # 改一处必须改另一处（下载到 frontend_path 才能让 Dockerfile 的 `COPY dist/homeos/frontend`
  # 命中；上传的是目录内容，所以两边的路径要写成同一个）。
  build:
    needs: [meta, checks]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: app
            project: app
            suffix: ""
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
            frontend_artifact: frontend-app
            frontend_path: dist/homeos/frontend
          - target: app
            project: app
            suffix: ""
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            frontend_artifact: frontend-app
            frontend_path: dist/homeos/frontend
          - target: store
            project: store
            suffix: "-store"
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
            frontend_artifact: frontend-store
            frontend_path: dist/homeos-store/frontend
          - target: store
            project: store
            suffix: "-store"
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            frontend_artifact: frontend-store
            frontend_path: dist/homeos-store/frontend
    steps:
      - uses: actions/checkout@v7

      # 前端产物由 checks.build 在宿主机构建并混淆，这里只取回自己项目的那一份。
      # 取回后落在 frontend_path，与当初构建时的工作区布局一致，Dockerfile 无需改动。
      - name: Download prebuilt frontend dist
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.frontend_artifact }}
          path: ${{ matrix.frontend_path }}

      - uses: docker/setup-buildx-action@v4

      # 后端 Cython 编译成 .so 并导出到根 dist/；运行镜像直接 COPY，不编译后端。
      # 与下面的 build-push-action 共用 gha 缓存 scope，避免后端被编译两遍。
      - name: Export protected backend to workspace dist
        run: |
          python3 ops/build.py backend \
            --project ${{ matrix.project }} \
            --arch ${{ matrix.arch }} \
            --cache-from type=gha,scope=${{ matrix.target }}-${{ matrix.arch }} \
            --cache-to type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.target }} / ${{ matrix.arch }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: true
          # 与 package.json 同源的版本号：镜像里由 src/_version.py 携带。
          # BACKEND_PLATFORM 选根 dist 下的平台子目录（Cython .so 与架构绑定）。
          build-args: |
            HOMEOS_VERSION=${{ needs.meta.outputs.version }}
            BACKEND_PLATFORM=linux-${{ matrix.arch }}
          tags: ${{ needs.meta.outputs.image }}${{ matrix.suffix }}:${{ needs.meta.outputs.tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}
          provenance: false

  # 把 <tag>-amd64 与 <tag>-arm64 合成为一个 manifest list：docker pull 时按宿主架构自动选。
  merge:
    needs: [meta, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: ""
          - suffix: "-store"
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        run: |
          name="${{ needs.meta.outputs.image }}${{ matrix.suffix }}"
          tag="${{ needs.meta.outputs.tag }}"
          args=(-t "${name}:${tag}")
          if [ "${{ needs.meta.outputs.release }}" = "true" ]; then
            args+=(-t "${name}:latest")
          fi
          docker buildx imagetools create "${args[@]}" \
            "${name}:${tag}-amd64" \
            "${name}:${tag}-arm64"

      - name: Inspect image
        run: docker buildx imagetools inspect "${{ needs.meta.outputs.image }}${{ matrix.suffix }}:${{ needs.meta.outputs.tag }}"
