name: Docker

on:
  # 本工作流只负责「构建并推送镜像」。部署不在 CI 里做：镜像推到 GHCR 后，
  # 在目标机上跑 ops/deploy/deploy.sh（三种形态与跨机拓扑见 ops/deploy/SPLIT-DEPLOY.md）。
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

# runner 与 action 版本都显式钉住，不跟随浮动标签：
# - runner 不用 ubuntu-latest：该标签自 2026-10-19 起迁往 Ubuntu 26，钉 24.04 可避免
#   迁移当天的意外，也与 arm64 侧既有的 ubuntu-24.04-arm 保持一致。
# - action 全部选使用 Node 24 运行时的大版本。GitHub 已弃用 Node 20，
#   checkout@v4 / setup-buildx@v3 / login@v3 / build-push@v6 均已触发告警；
#   以下版本起改用 Node 24（已逐个核对本流程用到的全部输入在新版中仍然存在）。
jobs:
  # 只算一次版本与镜像名，后续 build / merge 全部复用。
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      # 版本号唯一来源：仓库根 package.json 的 version（不再是 VERSION 文件）。
      # 发布标签只有两个：该版本号（如 1.0.0）与 latest，且只在默认分支推送，
      # 避免分支构建覆盖发布指针；非默认分支退化为 sha-<short>。
      - id: meta
        run: |
          version="$(sed -n 's/^  "version":[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::package.json 里没有 version，无法确定镜像 tag"
            exit 1
          fi
          base="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            tag="$version"
            release=true
          else
            tag="sha-${GITHUB_SHA::7}"
            release=false
          fi
          {
            echo "version=${version}"
            echo "image=${base}"
            echo "tag=${tag}"
            echo "release=${release}"
          } >> "$GITHUB_OUTPUT"

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install and typecheck
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          # 零 @ts-nocheck 门禁（Phase 6：迁移已清零，改为硬失败，不再只是告警）。
          # 不用 rg：runner 默认不保证装了 ripgrep，grep 更稳。
          # 扫 frontend 全目录而非仅 src：vite.config.ts / vite-quiet-logger.ts 等同样在 tsconfig 内。
          # 允许前导空白，避免缩进写的 pragma 逃过检查。
          leftovers="$(
            grep -RIlE --include='*.ts' --exclude-dir=node_modules --exclude-dir=dist \
              '^[[:space:]]*//[[:space:]]*@ts-nocheck' \
              homeos-3d/frontend homeos-store/frontend || true
          )"
          if [ -n "$leftovers" ]; then
            count="$(printf '%s\n' "$leftovers" | wc -l | tr -d ' ')"
            echo "::error::仍有 ${count} 个文件带 // @ts-nocheck：类型迁移要求零容忍"
            printf '%s\n' "$leftovers" | sed 's/^/  - /'
            exit 1
          fi
          echo "零 @ts-nocheck：通过"

  # 两个架构各跑在**原生** runner 上，不用 QEMU：构建期要用 Cython + gcc 把 Python
  # 编译成 per-arch 的 .so，模拟执行会慢到不可用。
  # 每个矩阵项只推一个 <tag>-<arch> 单架构镜像，manifest list 交给 merge 合成。
  build:
    needs: [meta, typecheck]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: app
            suffix: ""
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - target: app
            suffix: ""
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - target: store
            suffix: "-store"
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - target: store
            suffix: "-store"
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.target }} / ${{ matrix.arch }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: true
          # 与 package.json 同源的版本号：镜像里由 src/_version.py 携带。
          build-args: |
            HOMEOS_VERSION=${{ needs.meta.outputs.version }}
          tags: ${{ needs.meta.outputs.image }}${{ matrix.suffix }}:${{ needs.meta.outputs.tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}
          provenance: false

  # 把 <tag>-amd64 与 <tag>-arm64 合成为一个 manifest list：docker pull 时按宿主架构自动选。
  merge:
    needs: [meta, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: ""
          - suffix: "-store"
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        run: |
          name="${{ needs.meta.outputs.image }}${{ matrix.suffix }}"
          tag="${{ needs.meta.outputs.tag }}"
          args=(-t "${name}:${tag}")
          if [ "${{ needs.meta.outputs.release }}" = "true" ]; then
            args+=(-t "${name}:latest")
          fi
          docker buildx imagetools create "${args[@]}" \
            "${name}:${tag}-amd64" \
            "${name}:${tag}-arm64"

      - name: Inspect image
        run: docker buildx imagetools inspect "${{ needs.meta.outputs.image }}${{ matrix.suffix }}:${{ needs.meta.outputs.tag }}"
