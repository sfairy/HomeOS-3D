name: Docker

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "构建推送后 SSH 拉取并重启远端 compose（需已配置 Deploy secrets）"
        type: boolean
        default: false
      deploy_role:
        description: "deploy 时部署哪一侧：store（厂商机，默认）/ app（客户机）/ all（同机）"
        type: choice
        options:
          - store
          - app
          - all
        default: store

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
      store_image: ${{ steps.meta.outputs.store_image }}
    steps:
      - uses: actions/checkout@v4
      # 裸的 VERSION tag 只在默认分支推送（见 merge job 的 enable={{is_default_branch}}）：
      # 非默认分支勾了 deploy 会去拉一个不存在的 tag，这里提前挡住。
      - name: Deploy 只在默认分支可用
        if: ${{ inputs.deploy && github.ref_name != github.event.repository.default_branch }}
        run: |
          echo "::error::deploy 只能在默认分支（${{ github.event.repository.default_branch }}）上运行；当前 ${{ github.ref_name }} 不会推送 VERSION tag"
          exit 1
      - id: meta
        run: |
          version="$(tr -d '[:space:]' < VERSION 2>/dev/null || tr -d '[:space:]' < homeos-3d/VERSION)"
          base="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${base}" >> "$GITHUB_OUTPUT"
          echo "store_image=${base}-store" >> "$GITHUB_OUTPUT"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install and typecheck
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          # 零 @ts-nocheck 门禁（Phase 6：迁移已清零，改为硬失败，不再只是告警）。
          # 不用 rg：ubuntu-latest 默认不一定装 ripgrep。
          # 扫 frontend 全目录而非仅 src：vite.config.ts / vite-quiet-logger.ts 等同样在 tsconfig 内。
          # 允许前导空白，避免缩进写的 pragma 逃过检查。
          leftovers="$(
            grep -RIlE --include='*.ts' --exclude-dir=node_modules --exclude-dir=dist \
              '^[[:space:]]*//[[:space:]]*@ts-nocheck' \
              homeos-3d/frontend homeos-store/frontend || true
          )"
          if [ -n "$leftovers" ]; then
            count="$(printf '%s\n' "$leftovers" | wc -l | tr -d ' ')"
            echo "::error::仍有 ${count} 个文件带 // @ts-nocheck：类型迁移要求零容忍"
            printf '%s\n' "$leftovers" | sed 's/^/  - /'
            exit 1
          fi
          echo "零 @ts-nocheck：通过"

  # 每个架构跑在**原生** runner 上，不用 QEMU：构建期要用 Cython + gcc 把 Python
  build:
    needs: [meta, typecheck]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: app
            image_output: image
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - target: app
            image_output: image
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - target: store
            image_output: store_image
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - target: store
            image_output: store_image
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image
        id: image
        run: |
          if [ "${{ matrix.image_output }}" = "store_image" ]; then
            echo "name=${{ needs.meta.outputs.store_image }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ needs.meta.outputs.image }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.meta.outputs.version }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=ref,event=pr

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}
          provenance: false

      # 文件名去掉 sha256: 前缀，merge 阶段才能用 `@sha256:%s` 拼回完整引用。
      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.target }}-${{ matrix.arch }}
          path: /tmp/digests
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [meta, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: app
            image_output: image
          - target: store
            image_output: store_image
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image
        id: image
        run: |
          if [ "${{ matrix.image_output }}" = "store_image" ]; then
            echo "name=${{ needs.meta.outputs.store_image }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ needs.meta.outputs.image }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.meta.outputs.version }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.image.outputs.name }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ steps.image.outputs.name }}:${{ steps.docker_meta.outputs.version }}

  deploy:
    needs: [meta, merge]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    steps:
      - name: Require deploy secrets
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "Missing secret: $name"
              missing=1
            fi
          done
          exit "$missing"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            # 先更新检出：compose 与 deploy.sh 都从这里读，服务器不 pull 就会用旧编排
            if [ -d .git ]; then
              git fetch --prune --depth=1 origin "${{ github.ref_name }}"
              git checkout --force FETCH_HEAD
              echo "检出已更新到 ${{ github.sha }}"
            else
              echo "DEPLOY_PATH 不是 git 检出：跳过更新，compose / deploy.sh 可能是旧的"
            fi
            ./ops/deploy/deploy.sh --role "${{ inputs.deploy_role || 'store' }}" --version "${{ needs.meta.outputs.version }}" --yes
            docker image prune -f
