name: Docker

on:
  # 本工作流只负责「构建并推送镜像」。部署不在 CI 里做：镜像推到 GHCR 后，
  # 在目标机上跑 ops/deploy/deploy.sh（三种形态与跨机拓扑见 ops/deploy/SPLIT-DEPLOY.md）。
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

# runner 与 action 版本都显式钉住，不跟随浮动标签：
# - runner 不用 ubuntu-latest：该标签自 2026-10-19 起迁往 Ubuntu 26，钉 24.04 可避免
#   迁移当天的意外，也与 arm64 侧既有的 ubuntu-24.04-arm 保持一致。
# - action 全部选使用 Node 24 运行时的大版本。GitHub 已弃用 Node 20，
#   checkout@v4 / setup-buildx@v3 / login@v3 / build-push@v6 均已触发告警；
#   以下版本起改用 Node 24（已逐个核对本流程用到的全部输入在新版中仍然存在）。
jobs:
  # 只算一次版本与镜像名，后续 build / merge 全部复用。
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      # 版本号唯一来源：仓库根 package.json 的 version（不再是 VERSION 文件）。
      # 发布标签只有两个：该版本号（如 1.0.0）与 latest，且只在默认分支推送，
      # 避免分支构建覆盖发布指针；非默认分支退化为 sha-<short>。
      - id: meta
        run: |
          version="$(sed -n 's/^  "version":[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::package.json 里没有 version，无法确定镜像 tag"
            exit 1
          fi
          base="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            tag="$version"
            release=true
          else
            tag="sha-${GITHUB_SHA::7}"
            release=false
          fi
          {
            echo "version=${version}"
            echo "image=${base}"
            echo "tag=${tag}"
            echo "release=${release}"
          } >> "$GITHUB_OUTPUT"

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install and typecheck
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          # 三条 vite 配置不在两个子项目 tsconfig 的 include 里，单独用根 tsconfig.node.json
          # 按 strict 检查一遍（此前完全没被任何门禁覆盖）。
          bun run typecheck:node
          # 零 @ts-nocheck 门禁（Phase 6：迁移已清零，改为硬失败，不再只是告警）。
          # 不用 rg：runner 默认不保证装了 ripgrep，grep 更稳。
          # 扫 frontend 全目录而非仅 src：vite.config.ts / vite-quiet-logger.ts 等同样在 tsconfig 内。
          # 允许前导空白，避免缩进写的 pragma 逃过检查。
          leftovers="$(
            grep -RIlE --include='*.ts' --exclude-dir=node_modules --exclude-dir=dist \
              '^[[:space:]]*//[[:space:]]*@ts-nocheck' \
              homeos-3d/frontend homeos-store/frontend || true
          )"
          if [ -n "$leftovers" ]; then
            count="$(printf '%s\n' "$leftovers" | wc -l | tr -d ' ')"
            echo "::error::仍有 ${count} 个文件带 // @ts-nocheck：类型迁移要求零容忍"
            printf '%s\n' "$leftovers" | sed 's/^/  - /'
            exit 1
          fi
          echo "零 @ts-nocheck：通过"

  # Python 静态检查硬门禁。规则集与本地 `.venv-store/bin/ruff` 逐条核对过，当前全仓 0 条。
  # 这里不跑 `--fix`：CI 修不了东西，`--fix` 是提交前的动作；格式化的东西也不在这里拦，
  # 否则一升级 ruff 就会因为无关的格式差异把所有人的 PR 变红。
  ruff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install ruff
        # 与本地 `.venv-store/bin/ruff --version` 对齐，避免规则集随上游漂移。
        run: pip install "ruff==0.16.8"

      - name: Ruff check
        run: |
          ruff check --select F,E9,I,RET501,PLR1711,RUF059 .

  # 类型检查门禁（basedpyright）。
  # `error == 0` 现在还做不到：pyrightconfig.json 的 error 级里还有一批存量误报（模型标注偏窄
  # 导致的 reportOptionalMemberAccess / reportArgumentType 等），实测 73 条。所以这里只把
  # 「一定会炸」的三条规则当硬失败，其余打成直方图让人一直看得见；口径与 rationale 写在
  # ops/ci/pyright_gate.py 顶部。
  # （tools/ 下 src.* 的 reportMissingImports 已通过 pyrightconfig.json 的 executionEnvironments
  #   修掉：静态分析看不到 smoke_store.py 自己往 sys.path 插 backend，官方办法就是声明执行环境。）
  pyright:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # pyrightconfig.json 点名用仓库根的 .venv-store 解析第三方包；CI 里得自己把它建出来，
      # 否则 fastapi / sqlalchemy / cryptography 全部解析不了，error 数会凭空翻好几倍。
      - name: Create .venv-store with backend dependencies
        run: |
          python -m venv .venv-store
          .venv-store/bin/python -m pip install --upgrade pip
          .venv-store/bin/python -m pip install \
            -r homeos-3d/backend/src/requirements.txt \
            -r homeos-store/backend/src/requirements.txt

      - name: Install basedpyright
        run: pip install "basedpyright==1.40.1"

      - name: Basedpyright
        run: |
          # 有存量 error 时 basedpyright 自己也返回非 0；退出码交给下面的门禁脚本判定。
          basedpyright --outputjson > basedpyright.json || true
          python ops/ci/pyright_gate.py basedpyright.json

  # 库结构门禁：确认「迁移脚本 = ORM 元数据 = 实际结构」（ops/check_schema.py）。
  # 放在 build 之前是刻意的：结构漂移的表现是「本地全新库一切正常、存量部署才报错」，
  # 它不会在任何一条类型检查或前端检查里露头，而一旦随镜像发出去，用户是唯一的
  # 发现者。坏迁移在这里拦下，就不会被推成镜像。
  schema:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # 与 Dockerfile 的 python:3.14-slim-bookworm 对齐：迁移脚本要在生产同版本上验证过。
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r homeos-3d/backend/src/requirements.txt \
                      -r homeos-store/backend/src/requirements.txt

      - name: Check schema
        run: python ops/check_schema.py

  # 两个架构各跑在**原生** runner 上，不用 QEMU：构建期要用 Cython + gcc 把 Python
  # 编译成 per-arch 的 .so，模拟执行会慢到不可用。
  # 每个矩阵项只推一个 <tag>-<arch> 单架构镜像，manifest list 交给 merge 合成。
  build:
    needs: [meta, typecheck, schema, ruff, pyright]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: app
            project: 3d
            suffix: ""
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
            smoke_module: backend.src.main
          - target: app
            project: 3d
            suffix: ""
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            smoke_module: backend.src.main
          - target: store
            project: store
            suffix: "-store"
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
            smoke_module: src.app
          - target: store
            project: store
            suffix: "-store"
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            smoke_module: src.app
    steps:
      - uses: actions/checkout@v7

      # 前端产物改由宿主机构建并混淆，落到工作区根 dist/（镜像内不再跑 bun/vite）。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Build frontend to workspace dist
        run: |
          bun install --frozen-lockfile
          bun run build:frontend
          # 混淆与产物结构断言（原先在 Dockerfile 的 frontend-tools 阶段）。
          grep -q '_0x' dist/homeos-3d/frontend/static/logging/client-log.js
          grep -q '_0x' dist/homeos-store/frontend/static/auth-bootstrap.js
          test -f dist/homeos-3d/frontend/static/vendor/three/0.186.0/three.module.min.js
          test -f dist/homeos-store/frontend/static/jquery.min.js
          test -f dist/homeos-3d/frontend/index.html
          test -f dist/homeos-store/frontend/templates/store.html

      - uses: docker/setup-buildx-action@v4

      # 后端 Cython 编译成 .so 并导出到根 dist/；运行镜像直接 COPY，不再编译后端。
      # 与下面的 build-push-action 共用 gha 缓存 scope，避免后端被编译两遍。
      - name: Export protected backend to workspace dist
        run: |
          python3 ops/build.py backend \
            --project ${{ matrix.project }} \
            --arch ${{ matrix.arch }} \
            --cache-from type=gha,scope=${{ matrix.target }}-${{ matrix.arch }} \
            --cache-to type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.target }} / ${{ matrix.arch }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: true
          # 与 package.json 同源的版本号：镜像里由 src/_version.py 携带。
          # BACKEND_PLATFORM 选根 dist 下的平台子目录（Cython .so 与架构绑定）。
          build-args: |
            HOMEOS_VERSION=${{ needs.meta.outputs.version }}
            BACKEND_PLATFORM=linux-${{ matrix.arch }}
          tags: ${{ needs.meta.outputs.image }}${{ matrix.suffix }}:${{ needs.meta.outputs.tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}
          provenance: false

      # 镜像冒烟：把「镜像能起来」纳入门禁。这里只做一次 import（不连库、不跑服务），
      # 但足以挡住「构建期少 COPY 了东西 / 版本模块没烘进去」这类只在运行容器时才暴露的问题
      # —— 源码在宿主上跑得通，镜像里 .so 的包名与路径写错是看不出来的。
      - name: Smoke test image import (${{ matrix.target }} / ${{ matrix.arch }})
        run: |
          image="${{ needs.meta.outputs.image }}${{ matrix.suffix }}:${{ needs.meta.outputs.tag }}-${{ matrix.arch }}"
          docker run --rm --entrypoint python "$image" -c "import ${{ matrix.smoke_module }}; print('import ok')"

  # 把 <tag>-amd64 与 <tag>-arm64 合成为一个 manifest list：docker pull 时按宿主架构自动选。
  merge:
    needs: [meta, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: ""
          - suffix: "-store"
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        run: |
          name="${{ needs.meta.outputs.image }}${{ matrix.suffix }}"
          tag="${{ needs.meta.outputs.tag }}"
          args=(-t "${name}:${tag}")
          if [ "${{ needs.meta.outputs.release }}" = "true" ]; then
            args+=(-t "${name}:latest")
          fi
          docker buildx imagetools create "${args[@]}" \
            "${name}:${tag}-amd64" \
            "${name}:${tag}-arm64"

      - name: Inspect image
        run: docker buildx imagetools inspect "${{ needs.meta.outputs.image }}${{ matrix.suffix }}:${{ needs.meta.outputs.tag }}"
