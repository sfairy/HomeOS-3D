name: Docker

# 只保留手动触发：不在 push / PR 上自动构建，避免无意中消耗 Actions 额度、
# 以及向 GHCR 推送未打算发布的镜像。要出包时在 Actions 页面手动 Run workflow。
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "构建推送后 SSH 拉取并重启远端 compose（需已配置 Deploy secrets）"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
      store_image: ${{ steps.meta.outputs.store_image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          base="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${base}" >> "$GITHUB_OUTPUT"
          echo "store_image=${base}-store" >> "$GITHUB_OUTPUT"

  # 结构 / 导出 / 注册表 / 状态归一 / 后端路由 这几道守卫，此前只在 README 里写着、靠人手跑。
  # 挂在 build 之前：镜像推出去之前，先把「不报错、只静默失效」的那类问题断在这里。
  #
  # 未纳入的两个，各有明确原因，不是漏了：
  #   check_frontend_hygiene.mjs  --strict 当前有 32 项 findings，全部是 design/scene/ 里
  #     随 HomeOS-Activate 迁走而失去调用方的类名（.hos-modal / .hos-datepicker / .hos-hub /
  #     .viewport-frame / .app-shell__content …）。这类名分归设计系统那条线清理，清完之后
  #     把这条加进下面的清单即可；在此之前不能纳入 —— 不加 --strict 是一步永远不会失败的
  #     空转，加了 --strict 则当场拦死出包。复现：node tools/check_frontend_hygiene.mjs --strict
  #     （打印全部 32 条及所在文件行号；它另外三类已经是零）。
  #   check_scene_sync.mjs        design/scene/ 正在被改写为令牌体系、分发副本尚未重新
  #     生成，纳入会让 CI 替在途改动背红灯。
  #
  # 另需注意：本工作流只有 workflow_dispatch，所以这道守卫只在手动出包时跑，不随 push /
  # PR 自动触发（仓库有意不消耗 Actions 额度）。要在 PR 上强制，得另建一个 push/PR 工作流。
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 与 Dockerfile 的 base 阶段对齐：node:20 / python:3.12。
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: store/requirements.txt

      - name: Install Python dependencies
        run: pip install -r store/requirements.txt

      - name: Structure, export, registry and state guards
        run: |
          set -euo pipefail
          for command in \
            "node tools/check_structure_refs.mjs" \
            "node tools/check_esm_exports.mjs" \
            "node tools/check_registry_split.mjs" \
            "node tools/check_studio_palette.mjs --strict" \
            "node tools/smoke_registry.mjs" \
            "node tools/smoke_state_entry.mjs"
          do
            echo "::group::${command}"
            ${command}
            echo "::endgroup::"
          done

      - name: Backend and store smoke
        run: python tools/smoke_backend.py

  # 每个架构跑在**原生** runner 上，不用 QEMU：构建期要用 Cython + gcc 把 Python
  # 编译成按架构生成的 .so，模拟执行会慢一个数量级。各架构按 digest 推，最后合并 manifest。
  build:
    needs: [meta, guards]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: app
            image_output: image
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - target: app
            image_output: image
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - target: store
            image_output: store_image
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - target: store
            image_output: store_image
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image
        id: image
        run: |
          if [ "${{ matrix.image_output }}" = "store_image" ]; then
            echo "name=${{ needs.meta.outputs.store_image }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ needs.meta.outputs.image }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.meta.outputs.version }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=ref,event=pr

      # 标签在 merge 阶段统一打；这里只按 digest 推送，避免多架构互相覆盖同一 tag。
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}
          provenance: false

      # 文件名去掉 sha256: 前缀，merge 阶段才能用 `@sha256:%s` 拼回完整引用。
      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.target }}-${{ matrix.arch }}
          path: /tmp/digests
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [meta, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: app
            image_output: image
          - target: store
            image_output: store_image
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image
        id: image
        run: |
          if [ "${{ matrix.image_output }}" = "store_image" ]; then
            echo "name=${{ needs.meta.outputs.store_image }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ needs.meta.outputs.image }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.meta.outputs.version }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.image.outputs.name }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ steps.image.outputs.name }}:${{ steps.docker_meta.outputs.version }}

  deploy:
    needs: [meta, merge]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    steps:
      - name: Require deploy secrets
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "Missing secret: $name"
              missing=1
            fi
          done
          exit "$missing"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            export HOMEOS_IMAGE="${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.version }}"
            export HOMEOS_STORE_IMAGE="${{ needs.meta.outputs.store_image }}:${{ needs.meta.outputs.version }}"
            echo "Pulling ${HOMEOS_IMAGE} and ${HOMEOS_STORE_IMAGE}"
            docker compose pull
            docker compose up -d
            docker image prune -f
