name: Build Check

# 「只构建、不推镜像」的手动验证入口。
#
# 存在的理由：前端构建的验证此前**只存在于 docker.yml 的 build job** 里，而那个 job 同时
# 会构建并推送镜像到 GHCR。于是「这次改动会不会把构建弄挂」和「要不要往 registry 推镜像」
# 被绑成同一件事 —— 想验证构建就得走一遍带推送的完整发布流程。
#
# 2026-10-10 的构建锁 ENOENT 就卡在这条缝里：本地有历史 dist/ 兜着所以是绿的，干净检出
# 才炸；`verify:*` 那些门禁不跑构建，Docker 又太重。这个工作流把那一步单独拎出来。
#
# 触发：
# - `pull_request`：构建输入相关的路径一改就跑（见下方 paths）。**只做构建、不推镜像**，
#   所以放进 PR 没有发布副作用；`checks.yml` 里那个 `build` job 是同一份脚本的常驻版本，
#   这里额外覆盖「手动重跑一次」「只改构建相关文件时单独验证」两种场景。
# - `workflow_dispatch`：Actions 页面手动 Run workflow。
on:
  pull_request:
    # 只列会改变前端产物或构建过程的路径，避免纯文档/后端改动白跑一次全量构建。
    paths:
      - 'Dockerfile'
      - 'ops/**'
      - 'homeos/frontend/**'
      - 'homeos-store/frontend/**'
      - 'packages/**'
      # 根级构建输入：锁文件/工作区清单/三条 vite 配置所依赖的 tsconfig。
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'tsconfig*.json'
      - '.github/workflows/build-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # 与 docker.yml build job 的对应步骤共用同一份定义，包括那 6 条产物结构断言。
      # checkout 出来就是干净树（没有 gitignore 的 dist/），正是当年出错的那种状态。
      # 仍显式 `rm -rf dist`：万一 dist/ 被缓存或误提交，也能复现「干净检出」的失败面。
      - name: Build frontend to workspace dist
        run: |
          rm -rf dist
          bash ops/ci/build_frontend_verify.sh
