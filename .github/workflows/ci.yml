name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r store/requirements.txt

      - name: Python lint (ruff)
        run: |
          # 版本与仓库根 ruff.toml 里记的一致：规则集与默认阈值会随版本变，
          # 不 pin 的话「本地绿 / CI 红」会变成家常便饭。选哪几族、为什么，
          # 写在 ruff.toml 里；这里只是把同一条命令搬进 CI。
          # 入口清单与下面那条语法检查覆盖的树保持一致 —— 新增顶层包时两处一起改。
          pip install ruff==0.16.8
          python -m ruff check backend migrations store docker start.py container_entrypoint.py

      - name: Python syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          roots = [Path("backend"), Path("migrations"), Path("store")]
          files = sorted(p for root in roots for p in root.rglob("*.py"))
          files += [
              Path("start.py"),
              Path("container_entrypoint.py"),
              Path("docker/license_keys.py"),
              Path("docker/start_app.py"),
              Path("docker/start_store.py"),
              Path("docker/strip_python_sources.py"),
          ]
          bad = []
          for path in files:
              try:
                  compile(path.read_text(encoding="utf-8"), str(path), "exec")
              except (SyntaxError, ValueError) as error:
                  bad.append(f"{path}: {error}")
          print(f"compiled {len(files) - len(bad)}/{len(files)}")
          for item in bad:
              print(item)
          raise SystemExit(1 if bad else 0)
          PY

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          failed=0
          checked=0
          while IFS= read -r -d '' file; do
            checked=$((checked + 1))
            if ! node --check "$file" >/dev/null 2>&1; then
              echo "FAIL: $file"
              node --check "$file" || true
              failed=$((failed + 1))
            fi
          done < <(find frontend -type f -name '*.js' ! -path '*/vendor/*' -print0 | sort -z)
          if [[ "$failed" -gt 0 ]]; then
            echo "check-js: $failed/$checked files failed syntax check"
            exit 1
          fi
          echo "check-js: $checked files OK"

      - name: JavaScript lint (eslint)
        run: |
          # 版本锁在 package.json / package-lock.json：规则集与默认阈值会随版本变，
          # 不锁的话「本地绿 / CI 红」会变成家常便饭。选哪几族、为什么，写在
          # eslint.config.mjs 里；这条与 backend/tools/smoke.py 的
          # check_frontend_lint_clean 是同一条命令（那边缺依赖时显式 skip，
          # 所以 CI 这步是硬要求，容器镜像里那份自检才会跳）。
          npm ci
          npx eslint .
