name: Checks

# 轻检查（不构建镜像、不推 GHCR）：类型检查、ruff、pyright、库结构、端到端冒烟。
# 单一来源：docker.yml 通过 `uses:` 调用本工作流，改检查只改这一处。
# 不挂 push / pull_request，仅由 docker.yml 构建前调用或 Actions 手动 dispatch。
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# group 带 github.workflow：调用方与手动直跑分属不同组，避免 cancel-in-progress 互相掐掉。
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install and typecheck
        run: |
          bun install --frozen-lockfile
          # 根 `typecheck` 先跑 `build:shared`：dist/ 被 gitignore，干净检出上不先建就是一片 TS2307。
          bun run typecheck
          # 前端门禁：分层依赖方向 + 引用可解析性（含注释里的 `@/`）；store 侧同样两条。
          bun run --cwd homeos/frontend check:deps
          bun run --cwd homeos-store check:deps
          # ESLint：两前端共用规则核（ops/eslint/frontend-core.mjs）；--max-warnings 0 让风格问题也硬失败。
          bun run --cwd homeos/frontend lint:ci
          bun run --cwd homeos-store lint:ci
          # studio 度量 KPI：防拆分成果悄悄退化。
          bun run kpi:studio
          # 三条 vite 配置用根 tsconfig.node.json 单独 strict 检查。
          bun run typecheck:node
          # 零 @ts-nocheck 门禁（硬失败）；扫 frontend 全目录，允许前导空白。
          leftovers="$(
            grep -RIlE --include='*.ts' --exclude-dir=node_modules --exclude-dir=dist \
              '^[[:space:]]*//[[:space:]]*@ts-nocheck' \
              homeos/frontend homeos-store/frontend || true
          )"
          if [ -n "$leftovers" ]; then
            count="$(printf '%s\n' "$leftovers" | wc -l | tr -d ' ')"
            echo "::error::仍有 ${count} 个文件带 // @ts-nocheck：类型迁移要求零容忍"
            printf '%s\n' "$leftovers" | sed 's/^/  - /'
            exit 1
          fi
          echo "零 @ts-nocheck：通过"
          # 前端纯逻辑冒烟：与 `verify:smoke:frontend` 同一组，纯源码扫描，不需构建/后端。
          bun run homeos/frontend/scripts/_esc_stack_smoke.ts
          bun run homeos/frontend/scripts/_entity_control_logic_smoke.ts
          bun run homeos/frontend/scripts/_scene_update_plan_smoke.ts
          bun run homeos/frontend/scripts/_request_json_smoke.ts
          # 未使用 JS/TS、功能码镜像、场景资源副本、TS↔Python 黄金契约 + 独立部署护栏。
          # UI 令牌契约与映射棘轮不在此单列：它们由上面 `check:deps` 链的末尾覆盖
          # （`check-token-contract.mjs` / `check-token-map.mjs`），且一次即扫两个项目。
          # 各门禁自带注入式自检，确保漂移真的会被拦下；放在 build 之前失败。
          bun run knip
          bun run verify:features
          bun run verify:scene
          bun run verify:contracts

  # Python 静态检查硬门禁（规则集与本地 .venv-store/bin/ruff 对齐）。不跑 --fix。
  ruff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install ruff
        # 与本地 ruff 版本对齐，避免规则集随上游漂移。
        run: pip install "ruff==0.16.8"

      - name: Ruff check
        run: |
          ruff check --select F,E9,I,RET501,PLR1711,RUF059 .

  # 类型检查门禁（basedpyright）。存量误报未清零，只把「一定会炸」的三条规则当硬失败，
  # 其余打成直方图；口径见 ops/ci/pyright_gate.py 顶部。
  pyright:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # pyrightconfig.json 指向仓库根 .venv-store；CI 里须自建，否则第三方包解析不到。
      - name: Create .venv-store with backend dependencies
        run: |
          python -m venv .venv-store
          .venv-store/bin/python -m pip install --upgrade pip
          .venv-store/bin/python -m pip install \
            -r homeos/backend/requirements.txt \
            -r homeos-store/backend/requirements.txt

      - name: Install basedpyright
        run: pip install "basedpyright==1.40.1"

      - name: Basedpyright
        run: |
          # 有存量 error 时 basedpyright 自己也返回非 0；退出码交给下面的门禁脚本判定。
          basedpyright --outputjson > basedpyright.json || true
          python ops/ci/pyright_gate.py basedpyright.json

  # 库结构门禁（ops/check_schema.py）：验证迁移脚本 = ORM 元数据 = 实际结构。
  # 放在 build 之前：结构漂移只在存量部署暴露，坏迁移必须在推镜像前拦下。
  schema:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # 与 Dockerfile 的 python:3.14-slim-bookworm 对齐：迁移脚本要在生产同版本上验证过。
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r homeos/backend/requirements.txt \
                      -r homeos-store/backend/requirements.txt

      - name: Check schema
        run: python ops/check_schema.py

  # 端到端契约冒烟（离线自足：进程内假商店、被替换的 httpx、临时数据目录）。
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r homeos/backend/requirements.txt \
                      -r homeos-store/backend/requirements.txt

      # 与根 package.json 的 `verify:smoke:app` 对齐（全部离线自足）。
      # `_license_activation_e2e_smoke.py` 在商店未跑时 SKIP 并 0 退出。
      - name: App smokes
        run: |
          python homeos/backend/scripts/_auth_contract_smoke.py
          python homeos/backend/scripts/_register_login_activate_smoke.py
          python homeos/backend/scripts/_p51_ha_whitelist_smoke.py
          python homeos/backend/scripts/_ha_fetch_resilience_smoke.py
          python homeos/backend/scripts/_schema_drift_guard_smoke.py
          python homeos/backend/scripts/_module_feature_gate_smoke.py
          python homeos/backend/scripts/_license_activation_e2e_smoke.py
          python homeos/backend/scripts/_ws_broadcast_smoke.py
          python homeos/backend/scripts/full_backup_smoke.py

      - name: Store smokes
        run: |
          python homeos-store/scripts/smoke_store.py
          python homeos-store/scripts/_schema_drift_guard_smoke.py
          python homeos-store/scripts/_commerce_recount_smoke.py
