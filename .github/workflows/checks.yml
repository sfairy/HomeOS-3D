name: Checks

# 轻检查（不构建镜像、不推 GHCR）：类型检查、ruff、pyright、库结构、端到端冒烟。
#
# 这些检查原先内联在 docker.yml 里。抽出来放这里，是为了让「构建门禁」只有一份定义：
# docker.yml 通过 `uses:` 调用本工作流，改检查只改这一处，不会出现「docker.yml 里改了、
# 另一个地方忘了改」的漂移。这类漂移有前车之鉴：8d3be3e7（refactor(frontend): 收敛全树
# 目录分层）把 SettingsLicensePanel.vue 从 `src/views/settings/system/` 搬到
# `src/features/settings/system/`，但 verify:features 里硬编码的门禁文件路径没跟着改，
# 那盏红灯在 main 上躺到下一次手动 dispatch 才暴露。
#
# 刻意**不挂** push / pull_request：本工作流不自动跑，只在下面两种情况下执行 ——
#   (a) docker.yml 构建前 `uses:` 调用它（构建门的真实入口）；
#   (b) Actions 页面手动 Run workflow（想单独跑一遍检查时用）。
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# group 里带上 github.workflow：被 docker.yml 调用时它是 "Docker"，手动直跑时是
# "Checks"，分属不同组，避免 cancel-in-progress 互相掐掉。
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install and typecheck
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          # 前端分层依赖门禁（主应用 + studio + store）。
          bun run --cwd homeos/frontend check:deps
          bun run --cwd homeos-store check:store-deps
          # 三条 vite 配置不在两个子项目 tsconfig 的 include 里，单独用根 tsconfig.node.json
          # 按 strict 检查一遍（此前完全没被任何门禁覆盖）。
          bun run typecheck:node
          # 零 @ts-nocheck 门禁（硬失败）。
          # 不用 rg：runner 默认不保证装了 ripgrep，grep 更稳。
          # 扫 frontend 全目录而非仅 src：vite.config.ts / vite-quiet-logger.ts 等同样在 tsconfig 内。
          # 允许前导空白，避免缩进写的 pragma 逃过检查。
          leftovers="$(
            grep -RIlE --include='*.ts' --exclude-dir=node_modules --exclude-dir=dist \
              '^[[:space:]]*//[[:space:]]*@ts-nocheck' \
              homeos/frontend homeos-store/frontend || true
          )"
          if [ -n "$leftovers" ]; then
            count="$(printf '%s\n' "$leftovers" | wc -l | tr -d ' ')"
            echo "::error::仍有 ${count} 个文件带 // @ts-nocheck：类型迁移要求零容忍"
            printf '%s\n' "$leftovers" | sed 's/^/  - /'
            exit 1
          fi
          echo "零 @ts-nocheck：通过"
          # Esc 层级栈回归：静态扫描全部 overlay 是否都走 useEscLayer，并跑一遍栈行为
          # （压栈/出栈/优先级/defaultPrevented 旁路）。纯源码扫描，不需要构建后端。
          bun run homeos/frontend/scripts/_esc_stack_smoke.ts
          # 未使用 JS/TS、功能码镜像、场景资源副本、TS↔Python 黄金契约。
          # 放在 typecheck 里是为了和 bun install 共用一次，并在 build 之前失败。
          bun run knip
          bun run verify:features
          bun run verify:scene
          bun run verify:contracts

  # Python 静态检查硬门禁。规则集与本地 `.venv-store/bin/ruff` 逐条核对过，当前全仓 0 条。
  # 这里不跑 `--fix`：CI 修不了东西，`--fix` 是提交前的动作；格式化的东西也不在这里拦，
  # 否则一升级 ruff 就会因为无关的格式差异把所有人的 PR 变红。
  ruff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install ruff
        # 与本地 `.venv-store/bin/ruff --version` 对齐，避免规则集随上游漂移。
        run: pip install "ruff==0.16.8"

      - name: Ruff check
        run: |
          ruff check --select F,E9,I,RET501,PLR1711,RUF059 .

  # 类型检查门禁（basedpyright）。
  # `error == 0` 现在还做不到：pyrightconfig.json 的 error 级里还有一批存量误报（模型标注偏窄
  # 导致的 reportOptionalMemberAccess / reportArgumentType 等），实测 72 条。所以这里只把
  # 「一定会炸」的三条规则当硬失败，其余打成直方图让人一直看得见；口径与 rationale 写在
  # ops/ci/pyright_gate.py 顶部。
  # （tools/ 下 src.* 的 reportMissingImports 已通过 pyrightconfig.json 的 executionEnvironments
  #   修掉：静态分析看不到 smoke_store.py 自己往 sys.path 插 backend，官方办法就是声明执行环境。）
  pyright:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # pyrightconfig.json 点名用仓库根的 .venv-store 解析第三方包；CI 里得自己把它建出来，
      # 否则 fastapi / sqlalchemy / cryptography 全部解析不了，error 数会凭空翻好几倍。
      - name: Create .venv-store with backend dependencies
        run: |
          python -m venv .venv-store
          .venv-store/bin/python -m pip install --upgrade pip
          .venv-store/bin/python -m pip install \
            -r homeos/backend/requirements.txt \
            -r homeos-store/backend/requirements.txt

      - name: Install basedpyright
        run: pip install "basedpyright==1.40.1"

      - name: Basedpyright
        run: |
          # 有存量 error 时 basedpyright 自己也返回非 0；退出码交给下面的门禁脚本判定。
          basedpyright --outputjson > basedpyright.json || true
          python ops/ci/pyright_gate.py basedpyright.json

  # 库结构门禁：确认「迁移脚本 = ORM 元数据 = 实际结构 = 发行路径建出来的结构」
  # （ops/check_schema.py；最后一项验证产物里没有 Alembic 时按 ORM 建库是否等价）。
  # 放在 build 之前是刻意的：结构漂移的表现是「本地全新库一切正常、存量部署才报错」，
  # 它不会在任何一条类型检查或前端检查里露头，而一旦随镜像发出去，用户是唯一的
  # 发现者。坏迁移在这里拦下，就不会被推成镜像。
  schema:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # 与 Dockerfile 的 python:3.14-slim-bookworm 对齐：迁移脚本要在生产同版本上验证过。
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r homeos/backend/requirements.txt \
                      -r homeos-store/backend/requirements.txt

      - name: Check schema
        run: python ops/check_schema.py

  # 冒烟门禁：这些脚本此前**只在本地手动跑**，CI 完全不覆盖（`verify:smoke*` 是本地脚本）。
  # 漂移护栏与 Esc 扫描分别挂在 schema / typecheck job；这里补齐两侧的端到端契约冒烟。
  # 全部离线自足：进程内假商店、被替换的 httpx、临时数据目录，不连真实 HA / 商店 / SMTP。
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r homeos/backend/requirements.txt \
                      -r homeos-store/backend/requirements.txt

      # 与根 package.json 的 `verify:smoke:app` 对齐：认证契约、注册→登录→激活、
      # HA 白名单、HA 取状态容错、结构漂移护栏、增量模块功能码门禁、授权激活 e2e。
      # `_legacy_account_claim_smoke.py` 已删除，不要加回来。
      #
      # 漂移护栏守护的是 check_schema 覆盖不到的那条路径：「版本号已在 head、结构却没到」
      # （迁移文件被应用之后又被追加内容时就是这样）。2026-10-07 主应用正栽在这里：0008
      # 应用后又被追加了 license_state.activated_by，版本号早已打上、不会再回退，那一列
      # 永远补不上，直到业务查询报 no such column、应用启动失败，对外全是 503。
      # 两个执行器的等版本快路径现在都会先做结构对账。
      #
      # `_register_login_activate_smoke.py` 用的是**假商店**。`_license_activation_e2e_smoke.py`
      # 在商店未跑时 SKIP 并 0 退出，CI 里不会无故变红；真实发码验码仍以本地联调为准。
      - name: App smokes
        run: |
          python homeos/backend/scripts/_auth_contract_smoke.py
          python homeos/backend/scripts/_register_login_activate_smoke.py
          python homeos/backend/scripts/_p51_ha_whitelist_smoke.py
          python homeos/backend/scripts/_ha_fetch_resilience_smoke.py
          python homeos/backend/scripts/_schema_drift_guard_smoke.py
          python homeos/backend/scripts/_module_feature_gate_smoke.py
          python homeos/backend/scripts/_license_activation_e2e_smoke.py

      - name: Store smokes
        run: |
          python homeos-store/scripts/smoke_store.py
          python homeos-store/scripts/_schema_drift_guard_smoke.py
