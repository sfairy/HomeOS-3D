name: Checks

# 门禁入口（不构建镜像、不推 GHCR）。五个 job 与 `ops/gates.mjs` 的五个组一一对应：
#
#   static  → bun run gate:static   类型 / lint / ruff / 结构规则 / 棘轮
#   test    → bun run gate:test     单测 + 架构门禁用例（依赖 DAG、路由基线）
#   model   → bun run gate:model    3D 模型库只读审计（几何 / 槽位 / 材质 / 资产 / 布局）
#   build   → bun run gate:build    前端产物构建 + 结构断言 + 体积预算 + chunk 初始化
#   infra   → bun run gate:infra    shell / workflow / compose / Caddyfile / Cython
#
# 单一来源：**清单在 ops/gates.mjs**，这里只负责「装环境 + 按组调用」。改检查只改那一处，
# 本地 `bun run gate` 与 CI 跑的是同一批命令、同一个顺序 —— 这正是此前缺失的东西：
# CI 直写 `python3 ops/...`、`package.json` 写 `.venv-store/bin/python ...`，两套解释器与
# 依赖集，于是「本机绿、干净检出红」只能靠下一次 dispatch 才发现。
#
# 触发（2026-10-26 起**只手动**）：
# - workflow_dispatch：Actions 页面 Run workflow。
# - workflow_call：docker.yml 发版前复用同一份检查，并取用 build job 的前端制品。
#
# 代价必须写清楚：push / PR 不跑任何检查，`8d3be3e7` / 2026-10-10 那类「本机绿、干净检出红」
# 的问题不会在推送时亮红灯，只会等到下一次有人点 Run workflow（或发版被 docker.yml 调起）
# 才暴露。若哪天觉得太晚，把 `push: branches: [main]` 与 `pull_request:` 两段加回 `on:`
# 即可 —— 下面五个 job 都不依赖触发方式，加回来即自动生效。
#
# 本地等价入口：`bun run gate`（默认 static + test + model）、`bun run gate:build`、
# `bun run gate:infra`；`node ops/gates.mjs --list` 打印完整清单。
on:
  workflow_call:
  workflow_dispatch:

# 同组并发只保留最新一次：连续手动触发时取消上一轮，避免排队。
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 静态检查：不需要构建产物，几十秒内就能给出「语义回退」的红灯。
  #
  # `check:image-imports` 与 `check:python-lock` 也在这里：两者都是纯静态、不联网、不编译，
  # 却各自守着一个「本地看不出来、发版才炸」的失败面（镜像里的包名改写、依赖锁与
  # requirements.txt 指纹漂移）。
  static:
    runs-on: ubuntu-24.04
    env:
      # 让 ops/gates.mjs 走 CI 口径：ciOnly 步骤参与、缺工具即失败。
      HOMEOS_GATE_CONTEXT: ci
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install JS deps
        run: bun install --frozen-lockfile

      # 版本与开发机 `.venv-store` 对齐；`lint:py` 走 `python -m ruff`，所以装进解释器而不是
      # 只放二进制（node ops/lib/py.mjs -m ruff check .）。
      - name: Install ruff
        run: pip install "ruff==0.17.1"

      - name: Static gates
        run: bun run gate:static

  # 单测 + 架构门禁。后端单测直接 import `src.*`（fastapi / sqlalchemy 都在导入链上），
  # 所以要有运行期依赖；装的是开区间的 requirements.txt，不碰 requirements.lock
  # （镜像用的才是那份锁）。
  #
  # Node 侧测试命令走 package.json，且传**带引号的 glob**而不是目录：Node 22（ubuntu runner
  # 自带版本）把 `--test <目录>` 当成单个测试模块，直接 MODULE_NOT_FOUND —— 开发机的
  # Node 26 是好的，于是「本机绿、CI 红」。
  test:
    runs-on: ubuntu-24.04
    env:
      HOMEOS_GATE_CONTEXT: ci
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Install backend deps for unit tests
        run: pip install -r homeos/backend/requirements.txt

      - name: Test gates
        run: bun run gate:test

  # 模型库只读审计：不依赖前端构建，也不写盘。
  #
  # 入口是 `gate:model`，包含此前从未接线、却各自守着一类真实退化的检查：
  # - `check:materials`：材质角色指纹与基线（改模型必须留下可解释的 diff）；
  # - `check:models-layout` / `check:model-names`：目录分区与中文名索引是否最新；
  # - 以及几何 / 槽位 / 角色 / 资产预算（后者守「文件里还剩什么」，前几条只看新文件自身一致）。
  model:
    runs-on: ubuntu-24.04
    env:
      HOMEOS_GATE_CONTEXT: ci
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Model gates
        run: bun run gate:model

  # 前端产物构建 + 结构断言。这是整条流水线里**唯一**构建前端的 job：docker.yml 通过
  # workflow_call 复用它，产物以制品形式交给镜像矩阵。
  #
  # 此前是 docker.yml 的 4 个矩阵项各跑一遍同样的构建：既浪费 4 次 bun install + vite，
  # 又让 amd64 / arm64 各自产出一份前端 —— 前端产物与 CPU 架构无关，却因为「各建各的」
  # 多出一条「两个架构发布的不是同一个前端」的可能。
  build:
    runs-on: ubuntu-24.04
    env:
      HOMEOS_GATE_CONTEXT: ci
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # gate:build 自己会先清空 dist/：干净检出（没有 dist）才是当年构建锁 ENOENT 的现场。
      - name: Build gates
        run: bun run gate:build

      # 两个制品总是上传：本工作流只有 workflow_call（docker.yml 发版取用）与手动 dispatch
      # 两个入口，两者都需要这份产物。
      # 拆成 app / store 两个而不是一个：矩阵里 app 项只要 homeos/frontend、store 项只要
      # homeos-store/frontend，合成一个会让每项都拖上自己用不到的那一半。
      # 上传的是**目录内容**（path 指向的目录，其内容成为制品根），下载时指到同一个相对路径
      # 即可原样还原：dist/homeos/frontend 与 dist/homeos-store/frontend 正是 Dockerfile
      # 在运行阶段 COPY 的位置。
      - name: Upload app frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-app
          path: dist/homeos/frontend
          retention-days: 1
          if-no-files-found: error

      - name: Upload store frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-store
          path: dist/homeos-store/frontend
          retention-days: 1
          if-no-files-found: error

  # 基础设施配置的静态校验：shell / workflow / compose / Caddyfile / Cython。
  #
  # 判定与清单在 `ops/gates.mjs` 的 infra 组与 `ops/ci/`：
  # - `ops/ci/caddy_validate.sh`：本机有 caddy 就直接用，CI 里按 Dockerfile 的 CADDY_IMAGE
  #   版本下载（版本单一来源）；
  # - `ops/ci/compose_public.py`：把注释态的「可选：内置 Caddy 入口」段取消注释 —— 缩进只有
  #   取消注释后才会被 YAML 解析，写错了平时看不出来；
  # - Cython 兼容性：Cython 自身也会崩（3.3.0 对「带 dict[...] | None 注解的参数 + or {}
  #   兜底 + 直接 .items()」抛 TypeError），而源码本身合法。真正的编译只在 docker.yml
  #   （手动 dispatch）里跑，2026-10-17 的 app 镜像正是本机与当时的门禁全绿、发版才红在
  #   编译阶段 —— 所以这里只 cythonize、不编译 C，几秒钟。
  lint-infra:
    runs-on: ubuntu-24.04
    env:
      HOMEOS_GATE_CONTEXT: ci
      SHELLCHECK_VERSION: v0.11.0
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Install shellcheck and actionlint
        run: |
          curl -sSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | head -n 3

          curl -sSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version

      # Cython 版本取自 Dockerfile 的 ARG（与镜像同一份真源）；读不到就是版本单一来源断了，
      # 必须当场失败 —— 否则 `check:cython` 会拿错版本跑出一片假绿。
      - name: Install Cython（版本取自 Dockerfile）
        run: |
          cython_version="$(sed -n 's/^ARG CYTHON_VERSION=//p' Dockerfile | head -n1)"
          setuptools_version="$(sed -n 's/^ARG SETUPTOOLS_VERSION=//p' Dockerfile | head -n1)"
          if [ -z "$cython_version" ] || [ -z "$setuptools_version" ]; then
            echo "::error::Dockerfile 里读不到 CYTHON_VERSION / SETUPTOOLS_VERSION（版本单一来源断了）"
            exit 1
          fi
          pip install "cython==${cython_version}" "setuptools==${setuptools_version}"

      - name: Infra gates
        run: bun run gate:infra
