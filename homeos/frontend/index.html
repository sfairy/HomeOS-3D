<!doctype html>
<html lang="zh-Hans" class="hos-shell">

<head>
    <meta charset="utf-8">
    <!-- 全局错误上报启动脚本：必须保持经典脚本（非 module），任何路由都需要。
         defer 使其不阻塞 HTML 解析；HTML 规范中 defer 经典脚本与 parser-inserted module
         同属「解析结束后按树序执行」的列表，所以它仍早于下方 main.ts 执行，fetch/console
         包装与 CSRF 自补顺序不变（见 src/studio/app/logging/client-log.ts 头部注释）。
         vite-ignore：该文件不在 public/，而是由 vite-studio.ts 的 classicEntries 以 IIFE
         单独产出到 /static/logging/client-log.js。build-html 只能识别 public/ 里的非
         module 脚本，否则会报「can't be bundled without type="module"」——那是误报，
         构建后该属性会被 Vite 自动摘掉。 -->
    <script src="/static/logging/client-log.js" defer vite-ignore></script>
    <!-- 启动守卫：入口 chunk 加载失败时自愈重载并显示兜底面板，避免「黑屏 + 零提示」。
         必须早于入口 module 执行才能捕获其加载失败。 -->
    <script src="/static/boot-guard.js"></script>
    <!-- 逐路由页面资产（标题 / viewport / theme-color / manifest / 样式表）由
         src/studio/page-assets.ts 在运行时同步；下列三个 meta 是它的锚点，id 不可改名。 -->
    <meta id="spa-viewport" name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta id="spa-theme-color" name="theme-color" content="#050912">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HomeOS">
    <title>HomeOS</title>
    <link rel="icon" href="/static/assets/icons/homeos-favicon-h5.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" href="/static/assets/icons/homeos-favicon-h5.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/static/assets/icons/homeos-icon-180-h5.png" sizes="180x180">
    <link rel="apple-touch-icon-precomposed" href="/static/assets/icons/homeos-icon-180-h5.png"
        sizes="180x180">
    <link id="spa-manifest" rel="manifest" href="/static/assets/manifest/manifest-h5.webmanifest">
    <!-- SPA 外壳样式：让 <div id="app"> 不生成盒子，视图根元素等价于 body 的直接子元素。 -->
    <link rel="stylesheet" href="/static/spa-shell.css">
    <!-- 认证场景样式预装：冷开登录/注册时避免 runtime <link> 造成 FOUC。
         带 data-spa-managed，离开认证路由时由 page-assets 幂等卸载。清单与顺序必须与
         src/studio/page-assets.ts 的 AUTH_STYLESHEETS 逐条一致，否则运行时会把表摘下来重挂
         （摘掉的那一帧场景整片掉色 = 闪）。 -->
    <!-- 品牌字 Orbitron：场景里的 HomeOS 标记用它。`swap` + preload 保证首帧就是最终字形；
         正文/UI 字体（Exo 2 等）在 fonts.css 里改成了 `optional`（慢网下用系统字，
         宁可降级也不要在表单上闪一次字宽）。见 packages/shared/scene/static/fonts.css。
         注意：Orbitron 的唯一消费者是下面四片里的 scene.css（`--hos-font-brand`）。
         已登录的非入户页 / 3D 舞台由服务端 `strip_auth_scene_assets` 把它和四片一起摘掉，
         否则浏览器会报「preloaded but not used」—— 别把这条 preload 当全局资产用。 -->
    <link rel="preload" href="/static/auth/scene/fonts/orbitron-700-latin.woff2" as="font"
        type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/static/auth/scene/fonts.css" data-spa-managed="css">
    <link rel="stylesheet" href="/static/auth/scene/page.css" data-spa-managed="css">
    <link rel="stylesheet" href="/static/auth/scene/scene.css" data-spa-managed="css">
    <link rel="stylesheet" href="/static/auth/scene/panel.css" data-spa-managed="css">
    <!-- 站点配色令牌（--hb-*）：page.css 里 `--hos-tone-rgb: var(--hb-accent-rgb)` 没有兜底值，
         它必须和场景四片同批到达。原先运行时后置时首帧约 400ms 内令牌为 UNDEF、场景发黑。 -->
    <link rel="stylesheet" href="/static/appearance.css" data-spa-managed="css">
    <!-- 手持档开关：普通脚本（不导出、不 defer），必须在首帧前跑完给 <html> 挂 .hos-touch。
         该 class 只被登录场景样式消费，非场景页无副作用。 -->
    <script src="/static/auth/scene/scene-depth.js"></script>

    <!-- 机身外壳重置（margin / overflow / 背景）写在 /static/spa-shell.css 里。
         外壳页 CSP 是 `style-src 'self'`，行内 <style> 会被浏览器拦下，别挪回这里。 -->
    <!-- 3D 户型图编辑器首屏加载遮罩样式。全局挂一张（1.7KB）：遮罩标记在 <body> 里，
         没有这张表它在 `/3d-studio` 首帧就是一块无样式的纯文本。 -->
    <link rel="stylesheet" href="/static/3d-studio/studio-loading.css">
</head>

<body>
    <!-- 启动覆盖层：**必须在 #app 之外**。
         原因：Vue 的 app.mount('#app') 会清空 #app 的内容，而"已挂载但路由还没渲染出来"
         （后端冷启动 / 热重载窗口里 router.beforeEach 会阻塞约 2 分钟）正好是最需要提示的
         场景 —— 面板若放在 #app 内部就会在挂载瞬间被清掉，于是只剩纯空白 + 零报错。
         覆盖层显隐由 /static/boot-guard.js 控制，就绪信号是 <html data-homeos-ready>。 -->
    <!-- 默认 hidden：避免冷开时「正在连接」整屏闪一下再切登录页。
         boot-guard 仅在启动超过阈值后仍未就绪时再揭示；失败/升级路径也会强制显示。 -->
    <div id="homeos-boot-overlay" class="is-deferred" hidden data-state="connecting" role="status" aria-live="polite">
        <div class="homeos-boot-overlay__panel">
            <p class="homeos-boot-overlay__brand">HomeOS</p>
            <p class="homeos-boot-overlay__spinner" aria-hidden="true"></p>
            <h1 class="homeos-boot-overlay__title" id="homeos-boot-overlay-title">正在连接…</h1>
            <p class="homeos-boot-overlay__message" id="homeos-boot-overlay-message">正在等待 HomeOS 后端就绪，首次启动或热重载期间可能需要一会儿。</p>
            <button type="button" class="homeos-boot-overlay__action" id="homeos-boot-overlay-reload" hidden>重新加载</button>
        </div>
    </div>
    <!-- 3D 户型图编辑器首屏加载遮罩（默认 hidden，仅 `/3d-studio` 生效）。
         为什么在 #app 之外：户型模型与渲染器要几秒才准备好，这段时间 Vue 还没挂载；
         放在 #app 里会在挂载瞬间被清空。文案/重试按钮的 DOM 契约由
         static/3d-studio/studio-loading.js 驱动（`window.homeosStudioStartup`）。 -->
    <section id="studio-loading" class="studio-loading" hidden aria-label="正在准备户型" aria-live="polite">
        <div class="studio-loading-content">
            <div class="studio-loading-mark" aria-hidden="true"></div>
            <p class="studio-loading-brand">HOMEOS · 3D STUDIO</p>
            <h1 data-loading-title>正在准备你的户型</h1>
            <p class="studio-loading-detail" data-loading-detail>正在载入编辑器…</p>
            <div class="studio-loading-actions">
                <button type="button" data-loading-retry hidden>重新加载</button>
                <a href="/">返回首页</a>
            </div>
        </div>
    </section>
    <!-- 必须是 body 里的经典脚本（不是 module）：它要早于 /src/main.ts 执行，
         才能在入口 chunk 下载期间就把遮罩亮出来。 -->
    <script src="/static/3d-studio/studio-loading.js"></script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
