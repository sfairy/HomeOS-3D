<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="valve_opening_bg" cx="28%" cy="26%" r="72%">
      <stop offset="0%" stop-color="#fff" stop-opacity=".2"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </radialGradient>
    <linearGradient id="valve_opening_pipe" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="50%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
    <style>
      @keyframes valve_opening_turn{
        0%{transform:rotate(0deg)}
        to{transform:rotate(90deg)}
      }
      @keyframes valve_opening_flow{
        0%{opacity:0;stroke-dashoffset:0}
        35%{opacity:.35}
        to{opacity:1;stroke-dashoffset:-36}
      }
      .valve_opening_h{
        animation:valve_opening_turn 1.8s ease-in-out infinite;
        transform-origin:100px 100px;
      }
      .valve_opening_flow{
        animation:valve_opening_flow 1.8s ease-in-out infinite;
        stroke-dasharray:10 12;
      }
    </style>
  </defs>
  <circle cx="100" cy="100" r="87" fill="url(#valve_opening_bg)"/>
  <rect width="144" height="20" x="28" y="90" fill="url(#valve_opening_pipe)" rx="4"/>
  <ellipse cx="100" cy="90" fill="#fff" opacity=".75" rx="60" ry="4"/>
  <path fill="none" stroke="#fde68a" stroke-linecap="round" stroke-width="5" class="valve_opening_flow" d="M48 100h104"/>
  <circle cx="40" cy="100" r="14" fill="#a5f3fc"/>
  <circle cx="160" cy="100" r="14" fill="#a5f3fc"/>
  <circle cx="40" cy="100" r="7" fill="#fff"/>
  <circle cx="160" cy="100" r="7" fill="#fff"/>
  <circle cx="100" cy="100" r="28" fill="#fff"/>
  <ellipse cx="88" cy="92" fill="#fff" opacity=".55" rx="10" ry="6"/>
  <g class="valve_opening_h">
    <rect width="16" height="50" x="92" y="58" fill="#0e7490" rx="4"/>
    <circle cx="100" cy="58" r="16" fill="none" stroke="#fff" stroke-width="5"/>
    <circle cx="100" cy="58" r="5" fill="#fff"/>
    <rect width="6" height="28" x="97" y="44" fill="#fff" rx="2"/>
    <rect width="28" height="6" x="86" y="55" fill="#fff" rx="2"/>
  </g>
  <circle cx="100" cy="100" r="87" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="2.5"/>
</svg>
