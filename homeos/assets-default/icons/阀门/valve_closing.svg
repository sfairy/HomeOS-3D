<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="valve_closing_bg" cx="28%" cy="26%" r="72%">
      <stop offset="0%" stop-color="#fff" stop-opacity=".2"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>
    <linearGradient id="valve_closing_pipe" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <style>
      @keyframes valve_closing_turn{
        0%{transform:rotate(90deg)}
        to{transform:rotate(0deg)}
      }
      @keyframes valve_closing_flow{
        0%{opacity:.85;stroke-dashoffset:0}
        55%{opacity:.35}
        to{opacity:0;stroke-dashoffset:-28}
      }
      .valve_closing_h{
        animation:valve_closing_turn 1.8s ease-in-out infinite;
        transform-origin:100px 100px;
      }
      .valve_closing_flow{
        animation:valve_closing_flow 1.8s ease-in-out infinite;
        stroke-dasharray:10 12;
      }
    </style>
  </defs>
  <circle cx="100" cy="100" r="87" fill="url(#valve_closing_bg)"/>
  <rect width="144" height="20" x="28" y="90" fill="url(#valve_closing_pipe)" rx="4"/>
  <ellipse cx="100" cy="90" fill="#fff" opacity=".45" rx="60" ry="4"/>
  <path fill="none" stroke="#94a3b8" stroke-linecap="round" stroke-width="5" class="valve_closing_flow" d="M48 100h104"/>
  <circle cx="40" cy="100" r="14" fill="#64748b"/>
  <circle cx="160" cy="100" r="14" fill="#64748b"/>
  <circle cx="40" cy="100" r="7" fill="#cbd5e1"/>
  <circle cx="160" cy="100" r="7" fill="#cbd5e1"/>
  <circle cx="100" cy="100" r="28" fill="#475569"/>
  <ellipse cx="88" cy="92" fill="#94a3b8" opacity=".4" rx="10" ry="6"/>
  <g class="valve_closing_h">
    <rect width="16" height="50" x="92" y="58" fill="#1e293b" rx="4"/>
    <circle cx="100" cy="58" r="16" fill="none" stroke="#94a3b8" stroke-width="5"/>
    <circle cx="100" cy="58" r="5" fill="#94a3b8"/>
    <rect width="6" height="28" x="97" y="44" fill="#94a3b8" rx="2"/>
    <rect width="28" height="6" x="86" y="55" fill="#94a3b8" rx="2"/>
  </g>
  <circle cx="100" cy="100" r="87" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="2.5"/>
</svg>
