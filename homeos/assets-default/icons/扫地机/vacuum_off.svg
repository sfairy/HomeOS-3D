    <path fill="none" stroke="#94a3b8" stroke-linecap="round" stroke-width="9" d="M40 82a66 66 0 0 1 120 0"/>
    <circle cx="58" cy="58" r="3" fill="#94a3b8"/>
    <circle cx="142" cy="58" r="3" fill="#94a3b8"/>
