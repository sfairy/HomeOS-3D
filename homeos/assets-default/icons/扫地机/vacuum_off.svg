<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="vac_off_body" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <style>
      @keyframes vac_off_shine{0%,to{opacity:.35;transform:translateX(-6px)}50%{opacity:.6;transform:translateX(6px)}}
      @keyframes vac_off_breathe{0%,to{opacity:.92}50%{opacity:1}}
      .vac_off_body{animation:vac_off_breathe 4s ease-in-out infinite}
      .vac_off_shine{animation:vac_off_shine 5s ease-in-out infinite}
    </style>
  </defs>
  <g class="vac_off_body">
