    <circle cx="100" cy="94" r="10" fill="#e2e8f0"/>
    <circle cx="100" cy="94" r="4.5" fill="#94a3b8"/>
    <circle cx="100" cy="56" r="5.5" fill="#cbd5e1" opacity=".6"/>
    <circle cx="46" cy="138" r="11" fill="#94a3b8"/>
    <circle cx="46" cy="138" r="4" fill="#cbd5e1"/>
    <ellipse cx="66" cy="158" fill="#94a3b8" rx="16" ry="8"/>
