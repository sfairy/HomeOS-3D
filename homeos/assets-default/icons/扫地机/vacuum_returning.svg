<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="vac_ret_body" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="vac_ret_glow" width="140%" height="140%" x="-20%" y="-20%">
      <feGaussianBlur in="SourceGraphic" result="b" stdDeviation="1.2"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes vac_ret_home{0%,to{transform:translateY(0) scale(1)}50%{transform:translateY(3px) scale(1.04)}}
      @keyframes vac_ret_arrow{0%{opacity:.25;transform:translateX(0)}50%{opacity:1}to{opacity:.25;transform:translateX(8px)}}
      @keyframes vac_ret_path{0%{stroke-dashoffset:28;opacity:.4}50%{opacity:1}to{stroke-dashoffset:0;opacity:.45}}
      @keyframes vac_ret_led{0%,to{opacity:.5}50%{opacity:1}}
      @keyframes vac_ret_move{0%,to{transform:translate(0,0)}50%{transform:translate(2px,-1px)}}
      .vac_ret_body{animation:vac_ret_move 1.4s ease-in-out infinite}
      .vac_ret_home{animation:vac_ret_home 1.25s ease-in-out infinite;transform-origin:100px 94px}
      .vac_ret_a1,.vac_ret_a2,.vac_ret_a3{animation:vac_ret_arrow 1.1s ease-in-out infinite}
      .vac_ret_a2{animation-delay:.18s}
      .vac_ret_a3{animation-delay:.36s}
      .vac_ret_path{animation:vac_ret_path 1.5s linear infinite}
      .vac_ret_led{animation:vac_ret_led 1.4s ease-in-out infinite}
    </style>
  </defs>
  <path fill="none" stroke="#93c5fd" stroke-dasharray="8 6" stroke-linecap="round" stroke-width="3.5" d="M40 160q30-12 60-4t68-36" class="vac_ret_path"/>
  <g class="vac_ret_body">
    <circle cx="100" cy="100" r="72" fill="#0f172a"/>
    <circle cx="100" cy="100" r="66" fill="url(#vac_ret_body)"/>
    <ellipse cx="78" cy="74" fill="#fff" opacity=".7" rx="26" ry="13"/>
    <path fill="none" stroke="#0f172a" stroke-linecap="round" stroke-width="9" d="M40 82a66 66 0 0 1 120 0"/>
    <circle cx="58" cy="58" r="3" fill="#64748b"/>
    <circle cx="142" cy="58" r="3" fill="#64748b"/>
    <circle cx="100" cy="94" r="26" fill="#1e3a8a"/>
    <g class="vac_ret_home" filter="url(#vac_ret_glow)">
      <path fill="#60a5fa" d="m78 108 22-22 22 22v14H78Z"/>
      <rect width="16" height="14" x="92" y="108" fill="#1e3a8a" rx="2"/>
    </g>
    <circle cx="100" cy="56" r="5.5" fill="#3b82f6" class="vac_ret_led"/>
    <circle cx="46" cy="138" r="11" fill="#0f172a"/>
    <circle cx="46" cy="138" r="4" fill="#93c5fd"/>
    <ellipse cx="66" cy="158" fill="#0f172a" rx="16" ry="8"/>
    <ellipse cx="134" cy="158" fill="#0f172a" rx="16" ry="8"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#vac_ret_glow)">
    <path stroke="#93c5fd" stroke-width="4" d="m148 62 14 16-14 16" class="vac_ret_a1"/>
    <path stroke="#60a5fa" stroke-width="4.5" d="m134 68 12 10-12 10" class="vac_ret_a2"/>
    <path stroke="#3b82f6" stroke-width="4" d="m120 72 10 6-10 6" class="vac_ret_a3"/>
  </g>
</svg>
