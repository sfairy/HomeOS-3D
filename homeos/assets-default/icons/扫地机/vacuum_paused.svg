<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="vac_pause_body" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="vac_pause_glow" width="140%" height="140%" x="-20%" y="-20%">
      <feGaussianBlur in="SourceGraphic" result="b" stdDeviation="1.4"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes vac_pause_bars{0%,to{opacity:.55;transform:scaleY(.92)}50%{opacity:1;transform:scaleY(1)}}
      @keyframes vac_pause_led{0%,to{opacity:.4}50%{opacity:1}}
      @keyframes vac_pause_ring{0%,to{opacity:.3;stroke-width:3}50%{opacity:.85;stroke-width:4.5}}
      .vac_pause_bars{animation:vac_pause_bars 1.5s ease-in-out infinite;transform-origin:100px 94px}
      .vac_pause_led{animation:vac_pause_led 1.5s ease-in-out infinite}
      .vac_pause_ring{animation:vac_pause_ring 1.5s ease-in-out infinite}
    </style>
  </defs>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#fbbf24" class="vac_pause_ring" opacity=".5"/>
  <circle cx="100" cy="100" r="72" fill="#0f172a"/>
  <circle cx="100" cy="100" r="66" fill="url(#vac_pause_body)"/>
  <ellipse cx="78" cy="74" fill="#fff" opacity=".7" rx="26" ry="13"/>
  <path fill="none" stroke="#0f172a" stroke-linecap="round" stroke-width="9" d="M40 82a66 66 0 0 1 120 0"/>
  <circle cx="58" cy="58" r="3" fill="#64748b"/>
  <circle cx="142" cy="58" r="3" fill="#64748b"/>
  <circle cx="100" cy="94" r="28" fill="#78350f"/>
  <g class="vac_pause_bars" filter="url(#vac_pause_glow)">
    <rect width="13" height="36" x="84" y="76" fill="#fbbf24" rx="3"/>
    <rect width="13" height="36" x="103" y="76" fill="#fbbf24" rx="3"/>
  </g>
  <circle cx="100" cy="56" r="5.5" fill="#f59e0b" class="vac_pause_led"/>
  <circle cx="46" cy="138" r="11" fill="#0f172a"/>
  <circle cx="46" cy="138" r="4" fill="#fde68a"/>
  <ellipse cx="66" cy="158" fill="#0f172a" rx="16" ry="8"/>
  <ellipse cx="134" cy="158" fill="#0f172a" rx="16" ry="8"/>
</svg>
