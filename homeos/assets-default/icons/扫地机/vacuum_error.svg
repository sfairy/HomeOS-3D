<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="vac_err_body" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
    <filter id="vac_err_glow" width="150%" height="150%" x="-25%" y="-25%">
      <feGaussianBlur in="SourceGraphic" result="b" stdDeviation="1.6"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes vac_err_pulse{0%,to{opacity:.45}50%{opacity:1}}
      @keyframes vac_err_shake{0%,to{transform:translateX(0)}20%{transform:translateX(-2px)}40%{transform:translateX(2px)}60%{transform:translateX(-1.5px)}80%{transform:translateX(1.5px)}}
      @keyframes vac_err_ring{0%,to{opacity:.25;transform:scale(.96)}50%{opacity:.7;transform:scale(1.04)}}
      .vac_err_body{animation:vac_err_shake .55s ease-in-out infinite}
      .vac_err_alert{animation:vac_err_pulse .9s ease-in-out infinite}
      .vac_err_ring{animation:vac_err_ring .9s ease-in-out infinite;transform-origin:100px 100px}
      .vac_err_led{animation:vac_err_pulse .9s ease-in-out infinite}
    </style>
  </defs>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#f87171" stroke-width="4" class="vac_err_ring"/>
  <g class="vac_err_body">
    <circle cx="100" cy="100" r="72" fill="#7f1d1d"/>
    <circle cx="100" cy="100" r="66" fill="url(#vac_err_body)"/>
    <ellipse cx="78" cy="74" fill="#fff" opacity=".6" rx="26" ry="13"/>
    <path fill="none" stroke="#7f1d1d" stroke-linecap="round" stroke-width="9" d="M40 82a66 66 0 0 1 120 0"/>
    <circle cx="58" cy="58" r="3" fill="#f87171"/>
    <circle cx="142" cy="58" r="3" fill="#f87171"/>
    <circle cx="100" cy="94" r="28" fill="#991b1b"/>
    <g fill="none" stroke="#ef4444" stroke-linecap="round" stroke-width="9" class="vac_err_alert" filter="url(#vac_err_glow)">
      <path d="m80 74 40 40"/>
      <path d="m120 74-40 40"/>
    </g>
    <circle cx="100" cy="56" r="5.5" fill="#ef4444" class="vac_err_led"/>
    <circle cx="46" cy="138" r="11" fill="#7f1d1d"/>
    <circle cx="46" cy="138" r="4" fill="#fca5a5"/>
    <ellipse cx="66" cy="158" fill="#7f1d1d" rx="16" ry="8"/>
    <ellipse cx="134" cy="158" fill="#7f1d1d" rx="16" ry="8"/>
  </g>
</svg>
