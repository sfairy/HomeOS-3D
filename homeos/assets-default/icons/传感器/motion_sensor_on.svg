    <style>
      @keyframes sweep{0%,to{opacity:.25}50%{opacity:.95}}@keyframes pulse{0%,to{opacity:.55}50%{opacity:1}}.arc{animation:sweep 1.8s ease-in-out infinite}.led{animation:pulse 1.2s ease-in-out infinite}
    </style>
