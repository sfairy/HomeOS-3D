<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="gas_sensor_on_body" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="gas_sensor_on_flame" x1="50%" x2="50%" y1="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <radialGradient id="gas_sensor_on_bg" cx="28%" cy="24%" r="72%" fx="22%" fy="18%">
      <stop offset="0%" stop-color="#fff" stop-opacity=".2"/>
      <stop offset="45%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
    <style>
      @keyframes flicker{0%,to{transform:scaleY(.92);opacity:.8}50%{transform:scaleY(1.1);opacity:1}}@keyframes warn{0%,to{opacity:.45}50%{opacity:1}}.fl{animation:flicker .9s ease-in-out infinite;transform-origin:100px 70px}.led{animation:warn .7s ease-in-out infinite}
    </style>
  </defs>
  <circle cx="100" cy="100" r="87" fill="url(#gas_sensor_on_bg)"/>
  <rect width="88" height="72" x="56" y="78" fill="url(#gas_sensor_on_body)" rx="14"/>
  <ellipse cx="76" cy="90" fill="#fff" opacity=".8" rx="14" ry="5"/>
  <g stroke="#c2410c" stroke-linecap="round" stroke-width="3" opacity=".6">
    <path fill="none" d="M70 108h60"/>
    <path fill="none" d="M70 118h60"/>
    <path fill="none" d="M70 128h60"/>
  </g>
  <g class="fl">
    <path fill="url(#gas_sensor_on_flame)" d="M100 42C88 58 84 70 84 80s7 18 16 18 16-8 16-18-4-22-16-38Z"/>
    <path fill="#fde68a" d="M100 66c-6 8-8 14-8 18s3 8 8 8 8-4 8-8-2-10-8-18Z"/>
  </g>
  <circle cx="128" cy="94" r="6" fill="#ef4444" class="led"/>
  <circle cx="128" cy="94" r="2.5" fill="#fff"/>
  <rect width="44" height="8" x="78" y="136" fill="#fdba74" rx="2"/>
  <circle cx="100" cy="100" r="87" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="2.5"/>
