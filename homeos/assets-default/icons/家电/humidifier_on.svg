<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="hum_on_b" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="45%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="hum_on_w" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="hum_soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <style>
      @keyframes hum_mist{
        0%{opacity:0;transform:translate(0,2px) scale(.45)}
        15%{opacity:.85}
        55%{opacity:.55}
        to{opacity:0;transform:translate(6px,-36px) scale(1.55)}
      }
      @keyframes hum_mist2{
        0%{opacity:0;transform:translate(0,2px) scale(.4)}
        18%{opacity:.8}
        to{opacity:0;transform:translate(-7px,-34px) scale(1.45)}
      }
      @keyframes hum_water{0%,to{opacity:.75}50%{opacity:1}}
      @keyframes hum_led{0%,to{opacity:.72}50%{opacity:1}}
      .hum_m1{animation:hum_mist 2.6s cubic-bezier(.22,.61,.36,1) infinite;transform-origin:90px 56px}
      .hum_m2{animation:hum_mist2 2.6s cubic-bezier(.22,.61,.36,1) infinite;animation-delay:.45s;transform-origin:100px 48px}
      .hum_m3{animation:hum_mist 2.6s cubic-bezier(.22,.61,.36,1) infinite;animation-delay:.9s;transform-origin:110px 56px}
      .hum_m4{animation:hum_mist2 2.6s cubic-bezier(.22,.61,.36,1) infinite;animation-delay:1.35s;transform-origin:100px 58px}
      .hum_m5{animation:hum_mist 2.6s cubic-bezier(.22,.61,.36,1) infinite;animation-delay:1.8s;transform-origin:104px 52px}
      .hum_water{animation:hum_water 2.8s ease-in-out infinite}
      .hum_led{animation:hum_led 2.4s ease-in-out infinite}
    </style>
  </defs>
  <ellipse cx="100" cy="176" fill="#bae6fd" opacity=".55" rx="50" ry="9"/>
  <path fill="url(#hum_on_b)" d="M62 78c0-20 16-36 38-36s38 16 38 36v70c0 18-16 30-38 30s-38-12-38-30Z"/>
  <ellipse cx="100" cy="78" fill="#7dd3fc" rx="38" ry="13"/>
  <ellipse cx="100" cy="74" fill="#38bdf8" rx="14" ry="7"/>
  <ellipse cx="100" cy="72" fill="#0369a1" rx="7" ry="3.5"/>
  <ellipse cx="84" cy="92" fill="#fff" opacity=".75" rx="10" ry="16"/>
  <rect width="24" height="52" x="76" y="104" fill="url(#hum_on_w)" class="hum_water" rx="8"/>
  <rect width="14" height="30" x="81" y="120" fill="#bae6fd" rx="4"/>
  <circle cx="126" cy="126" r="16" fill="#bae6fd"/>
  <circle cx="126" cy="126" r="10" fill="#7dd3fc"/>
  <circle cx="126" cy="126" r="4" fill="#0369a1"/>
  <path fill="none" stroke="#0284c7" stroke-linecap="round" stroke-width="2.5" d="M126 116v8"/>
  <circle cx="126" cy="156" r="3.5" fill="#22c55e" class="hum_led"/>
  <g filter="url(#hum_soft)">
    <ellipse cx="90" cy="56" fill="#bae6fd" class="hum_m1" rx="8" ry="6"/>
    <ellipse cx="100" cy="48" fill="#7dd3fc" class="hum_m2" rx="11" ry="8"/>
    <ellipse cx="110" cy="56" fill="#38bdf8" class="hum_m3" rx="8" ry="6"/>
    <ellipse cx="100" cy="58" fill="#e0f2fe" class="hum_m4" rx="6" ry="5"/>
    <ellipse cx="104" cy="52" fill="#bae6fd" class="hum_m5" rx="5" ry="4"/>
  </g>
</svg>
