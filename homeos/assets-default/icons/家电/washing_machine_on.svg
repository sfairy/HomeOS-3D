<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="wm_on_g" cx="36%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </radialGradient>
    <linearGradient id="wm_on_b" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <style>
      @keyframes wm_drum{to{transform:rotate(360deg)}}
      @keyframes wm_ripple{
        0%,to{opacity:.35;transform:scale(.92)}
        50%{opacity:.75;transform:scale(1.06)}
      }
      @keyframes wm_led{0%,to{opacity:.72}50%{opacity:1}}
      .wm_drum{animation:wm_drum 2.4s linear infinite;transform-origin:100px 116px}
      .wm_ripple{animation:wm_ripple 1.8s ease-in-out infinite;transform-origin:100px 116px}
      .wm_led{animation:wm_led 2.4s ease-in-out infinite}
    </style>
  </defs>
  <ellipse cx="100" cy="178" fill="#93c5fd" opacity=".5" rx="58" ry="9"/>
  <rect width="112" height="138" x="44" y="28" fill="url(#wm_on_b)" rx="14"/>
  <ellipse cx="66" cy="44" fill="#fff" opacity=".85" rx="14" ry="6"/>
  <rect width="32" height="16" x="56" y="42" fill="#1d4ed8" rx="4"/>
  <rect width="18" height="9" x="60" y="45.5" fill="#93c5fd" rx="2"/>
  <circle cx="128" cy="50" r="12" fill="#1e3a8a"/>
  <circle cx="128" cy="50" r="6" fill="#93c5fd"/>
  <circle cx="148" cy="50" r="3.5" fill="#22c55e" class="wm_led"/>
  <circle cx="100" cy="116" r="46" fill="#1e3a8a"/>
  <circle cx="100" cy="116" r="38" fill="url(#wm_on_g)"/>
  <circle cx="100" cy="116" r="28" fill="none" stroke="#93c5fd" stroke-width="2" class="wm_ripple" opacity=".5"/>
  <g fill="#bfdbfe" class="wm_drum" opacity=".92">
    <ellipse cx="100" cy="96" rx="7" ry="14"/>
    <ellipse cx="100" cy="136" rx="7" ry="14"/>
    <ellipse cx="80" cy="116" rx="14" ry="7"/>
    <ellipse cx="120" cy="116" rx="14" ry="7"/>
  </g>
  <circle cx="100" cy="116" r="8" fill="#1e3a8a"/>
  <ellipse cx="88" cy="104" fill="#fff" opacity=".4" rx="12" ry="7"/>
  <rect width="40" height="8" x="56" y="158" fill="#60a5fa" rx="2"/>
</svg>
