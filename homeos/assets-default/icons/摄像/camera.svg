<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="c_w" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="55%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#c5d0dc"/>
    </linearGradient>
    <linearGradient id="c_s" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#8797a8"/>
    </linearGradient>
    <radialGradient id="c_ball" cx="34%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#3b4554"/>
      <stop offset="50%" stop-color="#151b24"/>
      <stop offset="100%" stop-color="#03060a"/>
    </radialGradient>
    <radialGradient id="c_lens" cx="32%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="30%" stop-color="#6366f1"/>
      <stop offset="65%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="c_glass" cx="40%" cy="18%" r="80%">
      <stop offset="0%" stop-color="#fff" stop-opacity=".3"/>
      <stop offset="40%" stop-color="#94a3b8" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity=".36"/>
    </radialGradient>
    <filter id="c_glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="c_hemi">
      <rect x="28" y="78" width="144" height="78"/>
    </clipPath>
    <clipPath id="c_bubble">
      <circle cx="100" cy="78" r="70"/>
    </clipPath>
    <clipPath id="c_face">
      <circle cx="100" cy="108" r="34"/>
    </clipPath>
    <style>
      /* 球体固定；镜头在球面左右转动（yaw），两侧略透视 */
      @keyframes c_yaw{
        0%,14%{transform:translate(-17px,1.5px) scale(.86,1)}
        30%{transform:translate(0,0) scale(1,1)}
        46%,60%{transform:translate(17px,1.5px) scale(.86,1)}
        76%{transform:translate(0,0) scale(1,1)}
        92%,to{transform:translate(-17px,1.5px) scale(.86,1)}
      }
      @keyframes c_led{0%,to{opacity:.4}50%{opacity:1}}
      @keyframes c_glint{0%,to{opacity:.4}50%{opacity:.85}}
      .c_yaw{animation:c_yaw 6.5s cubic-bezier(.42,0,.58,1) infinite;transform-origin:100px 108px}
      .c_led{animation:c_led 2s ease-in-out infinite}
      .c_glint{animation:c_glint 2.6s ease-in-out infinite}
    </style>
  </defs>

  <ellipse cx="100" cy="178" fill="#64748b" opacity=".28" rx="52" ry="7"/>

  <!-- 1. 天花板顶盘（加宽加厚，更像真机） -->
  <ellipse cx="100" cy="28" fill="#8797a8" rx="50" ry="9"/>
  <path fill="url(#c_s)" d="M50 28v8c0 4 22 7 50 7s50-3 50-7v-8z"/>
  <ellipse cx="100" cy="28" fill="url(#c_w)" rx="50" ry="9"/>
  <ellipse cx="88" cy="24" fill="#fff" opacity=".75" rx="22" ry="3.5"/>
  <g fill="#d5dee8">
    <circle cx="68" cy="28" r="2.8"/>
    <circle cx="132" cy="28" r="2.8"/>
    <circle cx="100" cy="22" r="2.8"/>
  </g>
  <g stroke="#94a3b8" stroke-width=".85" stroke-linecap="round">
    <path d="M66.6 28h2.8M68 26.6v2.8"/>
    <path d="M130.6 28h2.8M132 26.6v2.8"/>
    <path d="M98.6 22h2.8M100 20.6v2.8"/>
  </g>

  <!-- 2. 短粗吊杆（缩短，和机身一体） -->
  <rect width="18" height="18" x="91" y="36" fill="url(#c_s)" rx="3"/>
  <rect width="14" height="18" x="93" y="36" fill="url(#c_w)" rx="2.5"/>
  <ellipse cx="100" cy="36" fill="#fff" opacity=".5" rx="7" ry="2"/>

  <!-- 3. 主体白环（加厚，压住球罩直径） -->
  <ellipse cx="100" cy="78" fill="#8797a8" rx="72" ry="12"/>
  <path fill="url(#c_s)" d="M28 64c0-4 32-8 72-8s72 4 72 8v14c0 6-32 11-72 11s-72-5-72-11z"/>
  <ellipse cx="100" cy="64" fill="url(#c_w)" rx="72" ry="12"/>
  <ellipse cx="84" cy="58" fill="#fff" opacity=".7" rx="36" ry="5"/>
  <ellipse cx="100" cy="78" fill="url(#c_w)" rx="68" ry="10"/>

  <!-- 4. 下挂半球 + 云台 -->
  <g clip-path="url(#c_hemi)">
    <g clip-path="url(#c_bubble)">
      <circle cx="100" cy="78" r="70" fill="#06090e"/>

      <!-- 固定球头（更大，占满舱体） -->
      <circle cx="100" cy="108" r="36" fill="url(#c_ball)"/>
      <ellipse cx="84" cy="94" fill="#fff" opacity=".1" rx="12" ry="7"/>

      <!-- 镜头在球面左右转动 -->
      <g clip-path="url(#c_face)">
        <g class="c_yaw">
          <circle cx="100" cy="108" r="20" fill="#02050a"/>
          <circle cx="100" cy="108" r="16.5" fill="none" stroke="#1e293b" stroke-width="1.6"/>
          <circle cx="88" cy="98" r="2" fill="#475569"/>
          <circle cx="112" cy="98" r="2" fill="#475569"/>
          <circle cx="88" cy="118" r="2" fill="#475569"/>
          <circle cx="112" cy="118" r="2" fill="#475569"/>
          <circle cx="100" cy="108" r="12" fill="#0a0f16"/>
          <circle cx="100" cy="108" r="9" fill="url(#c_lens)"/>
          <ellipse cx="96" cy="104" fill="#eef2ff" class="c_glint" opacity=".55" rx="2.8" ry="1.7"/>
          <circle cx="100" cy="108" r="3.2" fill="#020617"/>
          <circle cx="100" cy="126" r="1.6" fill="#1e293b"/>
        </g>
      </g>

      <!-- 透明罩 -->
      <circle cx="100" cy="78" r="70" fill="url(#c_glass)"/>
      <path fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3.5" stroke-linecap="round" d="M52 96c18-26 40-38 54-40"/>
      <path fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2.5" stroke-linecap="round" d="M148 96c6 8 9 18 8 28"/>
      <path fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="10" stroke-linecap="round" d="M46 118c10 18 28 34 46 38"/>
    </g>
  </g>

  <circle cx="148" cy="70" r="3.5" fill="#22c55e" class="c_led" filter="url(#c_glow)"/>
</svg>
