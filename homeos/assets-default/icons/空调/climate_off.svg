    <path fill="none" stroke="#94a3b8" stroke-linecap="round" stroke-width="2" d="M48 122h104" opacity=".5"/>
    <path fill="none" stroke="#64748b" stroke-linecap="round" stroke-width="3.5" d="M40 128c32 10 88 10 120 0"/>
