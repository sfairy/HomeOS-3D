<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="light_ceiling_on_face" cx="36%" cy="26%" r="74%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#fffbeb"/>
      <stop offset="62%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <radialGradient id="light_ceiling_on_wash" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#fff7cc" stop-opacity=".75"/>
      <stop offset="40%" stop-color="#fde68a" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="light_ceiling_on_glow" width="180%" height="180%" x="-40%" y="-40%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="light_ceiling_on_soft" width="180%" height="180%" x="-40%" y="-40%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <style>
      @keyframes face{0%,to{opacity:.9}50%{opacity:1}}
      @keyframes wash{0%,to{opacity:.45;transform:scaleX(.94) scaleY(.96)}50%{opacity:1;transform:scaleX(1.05) scaleY(1.06)}}
      @keyframes rim{0%,to{opacity:.4}50%{opacity:.85}}
      .face{animation:face 2.3s ease-in-out infinite}
      .wash{animation:wash 2.3s ease-in-out infinite;transform-origin:100px 150px}
      .rim{animation:rim 2.3s ease-in-out infinite}
    </style>
  </defs>
  <circle cx="100" cy="100" r="87" fill="#f1f5f9"/>
  <ellipse cx="100" cy="152" fill="url(#light_ceiling_on_wash)" class="wash" filter="url(#light_ceiling_on_soft)" rx="84" ry="52"/><ellipse cx="100" cy="144" fill="#fef08a" class="wash" opacity=".4" filter="url(#light_ceiling_on_soft)" rx="60" ry="22"/><ellipse cx="100" cy="172" fill="#fff" class="wash" opacity=".6" rx="44" ry="10"/>
  <!-- 与 off 同底图 -->
  <ellipse cx="100" cy="58" fill="#64748b" opacity=".45" rx="70" ry="6"/>
  <ellipse cx="100" cy="64" fill="#334155" rx="64" ry="11"/>
  <ellipse cx="100" cy="73" fill="#475569" rx="62" ry="13"/>
  <ellipse cx="100" cy="86" fill="#fbbf24" class="face" opacity=".45" filter="url(#light_ceiling_on_soft)" rx="68" ry="30"/><ellipse cx="100" cy="86" fill="url(#light_ceiling_on_face)" class="face" filter="url(#light_ceiling_on_glow)" rx="68" ry="30"/><ellipse cx="82" cy="78" fill="#fff" class="face" opacity=".95" rx="18" ry="6.5"/><ellipse cx="100" cy="80" fill="none" stroke="#fffbeb" stroke-width="2.5" class="rim" opacity=".85" rx="62" ry="18"/>
  <circle cx="68" cy="62" r="2.5" fill="#0f172a"/>
  <circle cx="132" cy="62" r="2.5" fill="#0f172a"/>
  <circle cx="100" cy="58" r="2" fill="#0f172a" opacity=".85"/>
  <circle cx="100" cy="100" r="87" fill="none" stroke="#0f172a" stroke-opacity=".1" stroke-width="2.5"/>
</svg>
