<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="light_panel_on_wash" cx="50%" cy="0%" r="95%">
      <stop offset="0%" stop-color="#fff7cc" stop-opacity=".7"/>
      <stop offset="45%" stop-color="#fde68a" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="light_panel_on_face" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fffbeb"/>
      <stop offset="70%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="light_panel_on_glow" width="160%" height="170%" x="-30%" y="-35%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="light_panel_on_soft" width="160%" height="170%" x="-30%" y="-35%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <style>
      @keyframes emit{0%,to{opacity:.88}50%{opacity:1}}
      @keyframes edge{0%,to{opacity:.45}50%{opacity:1}}
      @keyframes wash{0%,to{opacity:.42}50%{opacity:.95}}
      .face{animation:emit 2.2s ease-in-out infinite}
      .edge{animation:edge 1.8s ease-in-out infinite}
      .wash{animation:wash 2.2s ease-in-out infinite}
    </style>
  </defs>
  <circle cx="100" cy="100" r="87" fill="#f1f5f9"/>
  <ellipse cx="100" cy="156" fill="url(#light_panel_on_wash)" class="wash" filter="url(#light_panel_on_soft)" rx="90" ry="40"/><ellipse cx="100" cy="172" fill="#fff" class="wash" opacity=".5" rx="44" ry="8"/>
  <!-- 与 off 同底图 -->
  <g transform="translate(100 102) scale(1.08) translate(-100 -100)">
    <rect width="120" height="10" x="40" y="70" fill="#475569" opacity=".55" rx="2"/>
    <rect width="128" height="72" x="36" y="54" fill="#334155" rx="6"/>
    <rect width="120" height="56" x="40" y="60" fill="#1e293b" rx="3"/><rect width="120" height="56" x="40" y="60" fill="url(#light_panel_on_face)" class="face" filter="url(#light_panel_on_glow)" rx="3"/><rect width="120" height="10" x="40" y="60" fill="#fff" class="edge" rx="2"/><ellipse cx="72" cy="68" fill="#fff" opacity=".9" rx="15" ry="6"/><rect width="120" height="56" x="40" y="60" fill="none" stroke="#fffbeb" stroke-width="1.5" class="edge" opacity=".7" rx="3"/>
    <rect width="12" height="6" x="52" y="50" fill="#334155" rx="1"/>
    <rect width="12" height="6" x="136" y="50" fill="#334155" rx="1"/>
    <circle cx="58" cy="53" r="1.5" fill="#0f172a"/>
    <circle cx="142" cy="53" r="1.5" fill="#0f172a"/>
    <g fill="none" stroke="#b45309" stroke-width="1.5" opacity=".22">
      <path d="M72 64v44"/>
      <path d="M100 64v44"/>
      <path d="M128 64v44"/>
      <path d="M46 78h108"/>
      <path d="M46 94h108"/>
    </g>
  </g>
  <circle cx="100" cy="100" r="87" fill="none" stroke="#0f172a" stroke-opacity=".1" stroke-width="2.5"/>
</svg>
