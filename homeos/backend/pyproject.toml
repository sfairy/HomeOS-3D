[project]
name = "homeos-backend-py"
version = "0.0.0"
description = "HomeOS 后端（FastAPI / Python），NestJS 的透明替换实现"
requires-python = ">=3.11"
dynamic = ["version"]

[tool.setuptools.dynamic]
version = { attr = "src.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# Ruff：仓库根目录 ruff.toml 为唯一配置源（含 select/ignore）。
# 勿在此重复 [tool.ruff]，以免与根配置冲突或覆盖。
# 在本目录单独跑 ruff 时请：ruff check --config ../../ruff.toml src

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
# pyright 不会自动发现项目内的 .venv，需显式点名，否则第三方包
# （fastapi / sqlalchemy / httpx 等）会整片报 reportMissingImports。
venvPath = "."
venv = ".venv"
