# HomeOS Postgres PITR（挂载为 /etc/postgresql/postgresql.conf 片段，见 docker-compose）
# 与官方镜像默认配置叠加：通过 command -c 注入，本文件作文档参考。

wal_level = replica
archive_mode = on
# %p = WAL 路径，%f = 文件名；目标目录须可写且由 compose 挂载 pg_wal_archive
archive_command = 'test ! -f /wal_archive/%f && cp %p /wal_archive/%f'
archive_timeout = 300
# 保留足够 WAL 供 basebackup 期间复制（秒）
wal_keep_size = 256MB
