<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="cam_rec_body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="55%" stop-color="#fecdd3"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
    <radialGradient id="cam_rec_glass" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="55%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </radialGradient>
    <linearGradient id="cam_rec_mount" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <style>
      @keyframes cam_rec_blink{0%,to{opacity:.55}50%{opacity:1}}
      @keyframes cam_rec_ring{0%,to{opacity:.25;transform:scale(.94)}50%{opacity:.7;transform:scale(1.06)}}
      .cam_rec_led{animation:cam_rec_blink .85s ease-in-out infinite}
      .cam_rec_dot{animation:cam_rec_blink .85s ease-in-out infinite}
      .cam_rec_ring{animation:cam_rec_ring 1.2s ease-in-out infinite;transform-origin:124px 100px}
    </style>
  </defs>
  <ellipse cx="112" cy="178" fill="#fda4af" opacity=".45" rx="56" ry="8"/>
  <rect width="14" height="64" x="34" y="68" fill="url(#cam_rec_mount)" rx="4"/>
  <rect width="6" height="18" x="38" y="78" fill="#fda4af" rx="2"/>
  <rect width="6" height="18" x="38" y="104" fill="#fda4af" rx="2"/>
  <path fill="url(#cam_rec_mount)" d="M48 94h22a6 6 0 0 1 6 6v0a6 6 0 0 1-6 6H48z"/>
  <rect width="112" height="88" x="68" y="56" fill="url(#cam_rec_body)" rx="18"/>
  <ellipse cx="88" cy="72" fill="#fff" opacity=".75" rx="22" ry="10"/>
  <rect width="88" height="7" x="80" y="64" fill="#9f1239" rx="2.5"/>
  <circle cx="124" cy="100" r="30" fill="#9f1239"/>
  <circle cx="124" cy="100" r="36" fill="none" stroke="#ef4444" stroke-width="2.5" class="cam_rec_ring"/>
  <circle cx="124" cy="100" r="22" fill="url(#cam_rec_glass)"/>
  <ellipse cx="116" cy="92" fill="#fecdd3" opacity=".55" rx="7" ry="4"/>
  <circle cx="124" cy="100" r="9" fill="#ef4444" class="cam_rec_dot"/>
  <circle cx="124" cy="100" r="3.5" fill="#fff"/>
  <circle cx="88" cy="80" r="3.5" fill="#fb7185"/>
  <circle cx="160" cy="80" r="3.5" fill="#fb7185"/>
  <circle cx="164" cy="128" r="5" fill="#ef4444" class="cam_rec_led"/>
  <g class="cam_rec_led">
    <circle cx="52" cy="48" r="10" fill="#ef4444"/>
    <circle cx="52" cy="48" r="4" fill="#fff"/>
  </g>
