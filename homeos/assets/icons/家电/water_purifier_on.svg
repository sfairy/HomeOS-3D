<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="wp_on_b" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="wp_on_f1" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="wp_on_f2" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <style>
      @keyframes wp_flow{
        0%{opacity:.35;transform:translateY(2px)}
        50%{opacity:1;transform:translateY(-2px)}
        to{opacity:.35;transform:translateY(2px)}
      }
      @keyframes wp_disp{0%,to{opacity:.6}50%{opacity:1}}
      @keyframes wp_led{0%,to{opacity:.72}50%{opacity:1}}
      .wp_f1{animation:wp_flow 1.8s ease-in-out infinite}
      .wp_f2{animation:wp_flow 1.8s ease-in-out infinite;animation-delay:.35s}
      .wp_f3{animation:wp_flow 1.8s ease-in-out infinite;animation-delay:.7s}
      .wp_disp{animation:wp_disp 2.2s ease-in-out infinite}
      .wp_led{animation:wp_led 2.4s ease-in-out infinite}
    </style>
  </defs>
  <ellipse cx="100" cy="176" fill="#bae6fd" opacity=".55" rx="58" ry="9"/>
  <rect width="112" height="132" x="44" y="34" fill="url(#wp_on_b)" rx="14"/>
  <ellipse cx="68" cy="52" fill="#fff" opacity=".85" rx="14" ry="6"/>
  <rect width="72" height="24" x="64" y="48" fill="#0369a1" rx="6"/>
  <rect width="48" height="12" x="68" y="54" fill="#7dd3fc" class="wp_disp" rx="3"/>
  <circle cx="128" cy="60" r="4" fill="#22c55e" class="wp_led"/>
  <rect width="22" height="68" x="58" y="88" fill="url(#wp_on_f1)" class="wp_f1" rx="8"/>
  <rect width="22" height="68" x="89" y="88" fill="url(#wp_on_f2)" class="wp_f2" rx="8"/>
  <rect width="22" height="68" x="120" y="88" fill="url(#wp_on_f1)" class="wp_f3" rx="8"/>
  <ellipse cx="69" cy="100" fill="#fff" opacity=".6" rx="6" ry="4"/>
  <ellipse cx="100" cy="100" fill="#fff" opacity=".6" rx="6" ry="4"/>
  <ellipse cx="131" cy="100" fill="#fff" opacity=".6" rx="6" ry="4"/>
  <circle cx="69" cy="162" r="5" fill="#38bdf8"/>
  <circle cx="100" cy="162" r="5" fill="#0ea5e9"/>
  <circle cx="131" cy="162" r="5" fill="#38bdf8"/>
</svg>
