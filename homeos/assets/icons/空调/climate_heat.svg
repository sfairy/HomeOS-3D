<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="climate_heat_neon" width="160%" height="160%" x="-30%" y="-30%">
      <feGaussianBlur in="SourceGraphic" result="b" stdDeviation="2.6"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="climate_heat_mist" width="200%" height="200%" x="-50%" y="-30%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.7"/>
    </filter>
    <linearGradient id="climate_heat_grad" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <style>
      @keyframes climate_heat_pulse{0%,to{opacity:.86}50%{opacity:1}}@keyframes climate_heat_led{0%,to{opacity:.5;r:3.2}50%{opacity:1}}@keyframes climate_heat_flap{0%,to{transform:translateY(0) rotate(0deg)}50%{transform:translateY(3.5px) rotate(-1deg)}}@keyframes climate_heat_spray{0%{opacity:0;transform:translate(0,0) scaleX(.5) scaleY(.35)}16%{opacity:1}to{opacity:0;transform:translate(0,42px) scaleX(1.45) scaleY(2)}}@keyframes climate_heat_ember{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}to{opacity:0;transform:translateY(38px) scale(1.2)}}@keyframes climate_heat_streak{0%{opacity:0;stroke-dashoffset:32}30%{opacity:1}to{opacity:0;stroke-dashoffset:-12}}@keyframes climate_heat_wave{0%{opacity:0;transform:translateY(0) scaleX(.7)}25%{opacity:.9}to{opacity:0;transform:translateY(36px) scaleX(1.25)}}@keyframes climate_heat_disp{0%,to{opacity:.65}50%{opacity:1}}.climate_heat_frame{animation:climate_heat_pulse 1.8s ease-in-out infinite}.climate_heat_led{animation:climate_heat_led 1.3s ease-in-out infinite}.climate_heat_flap{animation:climate_heat_flap 1.4s ease-in-out infinite;transform-origin:100px 128px}.climate_heat_s1,.climate_heat_s2,.climate_heat_s3{animation:climate_heat_spray 1.1s ease-out infinite}.climate_heat_s1{transform-origin:50px 136px}.climate_heat_s2{animation-delay:.15s;transform-origin:70px 138px}.climate_heat_s3{animation-delay:.3s;transform-origin:90px 140px}.climate_heat_s4{animation-delay:.45s;transform-origin:110px 140px}.climate_heat_s4,.climate_heat_s5,.climate_heat_s6,.climate_heat_s7{animation:climate_heat_spray 1.1s ease-out infinite}.climate_heat_s5{animation-delay:.6s;transform-origin:130px 138px}.climate_heat_s6{animation-delay:.75s;transform-origin:148px 136px}.climate_heat_s7{animation-delay:.9s;transform-origin:100px 134px}.climate_heat_e1{animation:climate_heat_ember 1.25s ease-in infinite;transform-origin:58px 140px}.climate_heat_e2{animation-delay:.25s;transform-origin:82px 142px}.climate_heat_e2,.climate_heat_e3,.climate_heat_e4,.climate_heat_e5{animation:climate_heat_ember 1.25s ease-in infinite}.climate_heat_e3{animation-delay:.5s;transform-origin:100px 144px}.climate_heat_e4{animation-delay:.75s;transform-origin:120px 142px}.climate_heat_e5{animation-delay:1s;transform-origin:142px 140px}.climate_heat_t1{animation:climate_heat_streak .9s linear infinite}.climate_heat_t2{animation-delay:.22s}.climate_heat_t2,.climate_heat_t3,.climate_heat_t4{animation:climate_heat_streak .9s linear infinite}.climate_heat_t3{animation-delay:.44s}.climate_heat_t4{animation-delay:.66s}.climate_heat_w1,.climate_heat_w2{animation:climate_heat_wave 1.35s ease-out infinite}.climate_heat_w2{animation-delay:.45s}.climate_heat_disp{animation:climate_heat_disp 1.6s ease-in-out infinite}
    </style>
  </defs>
  <rect width="156" height="84" x="22" y="58" fill="url(#climate_heat_grad)" class="climate_heat_frame" filter="url(#climate_heat_neon)" rx="30"/>
  <rect width="156" height="84" x="22" y="58" fill="none" stroke="#fff" stroke-width="4" opacity=".9" rx="30"/>
  <rect width="132" height="42" x="34" y="68" fill="#1a0a04" rx="6"/>
  <circle cx="48" cy="80" r="3.4" fill="#fdba74" class="climate_heat_led"/>
  <circle cx="62" cy="80" r="3.2" fill="#fff" opacity=".9"/>
  <circle cx="76" cy="80" r="3.2" fill="#fff" opacity=".8"/>
  <g class="climate_heat_disp">
    <rect width="24" height="12" x="90" y="88" fill="none" stroke="#fdba74" stroke-width="2" rx="3"/>
    <path fill="none" stroke="#ffedd5" stroke-linecap="round" stroke-width="2.5" d="M96 94h12"/>
  </g>
  <rect width="10" height="4" x="34" y="114" fill="#9a3412" opacity=".5" rx="1"/>
  <rect width="10" height="4" x="156" y="114" fill="#9a3412" opacity=".5" rx="1"/>
  <path fill="none" stroke="#fff" stroke-linecap="round" stroke-width="3.5" d="M40 128c32 14 88 14 120 0" class="climate_heat_flap"/>
  <g filter="url(#climate_heat_mist)">
    <ellipse cx="50" cy="136" fill="#ffedd5" class="climate_heat_s1" rx="7" ry="5"/>
    <ellipse cx="70" cy="138" fill="#fed7aa" class="climate_heat_s2" rx="8" ry="5.5"/>
    <ellipse cx="90" cy="140" fill="#fdba74" class="climate_heat_s3" rx="9" ry="6"/>
    <ellipse cx="110" cy="140" fill="#fb923c" class="climate_heat_s4" rx="9" ry="6"/>
    <ellipse cx="130" cy="138" fill="#f97316" class="climate_heat_s5" rx="8" ry="5.5"/>
    <ellipse cx="148" cy="136" fill="#fdba74" class="climate_heat_s6" rx="7" ry="5"/>
    <ellipse cx="100" cy="134" fill="#ffedd5" class="climate_heat_s7" rx="14" ry="4"/>
  </g>
  <g fill="none" stroke="#fdba74" stroke-linecap="round" stroke-width="3" opacity=".6">
    <path d="M55 138q45 14 90 0" class="climate_heat_w1"/>
    <path d="M62 146q38 18 76 0" class="climate_heat_w2"/>
  </g>
  <g fill="#fb923c">
    <circle cx="58" cy="140" r="2" class="climate_heat_e1"/>
    <circle cx="82" cy="142" r="2.4" class="climate_heat_e2"/>
    <circle cx="100" cy="144" r="1.8" class="climate_heat_e3"/>
    <circle cx="120" cy="142" r="2.2" class="climate_heat_e4"/>
    <circle cx="142" cy="140" r="1.6" class="climate_heat_e5"/>
  </g>
  <g fill="none" stroke="#fdba74" stroke-dasharray="6 9" stroke-linecap="round" stroke-width="2.2" opacity=".9">
    <path d="M55 134v40" class="climate_heat_t1"/>
    <path d="M85 136v44" class="climate_heat_t2"/>
    <path d="M115 136v44" class="climate_heat_t3"/>
    <path d="M145 134v40" class="climate_heat_t4"/>
  </g>
</svg>
