<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="climate_fan_neon" width="160%" height="160%" x="-30%" y="-30%">
      <feGaussianBlur in="SourceGraphic" result="b" stdDeviation="2.5"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="climate_fan_mist" width="200%" height="200%" x="-50%" y="-30%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4"/>
    </filter>
    <linearGradient id="climate_fan_grad" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <style>
      @keyframes climate_fan_pulse{0%,to{opacity:.86}50%{opacity:1}}@keyframes climate_fan_led{0%,to{opacity:.55}50%{opacity:1}}@keyframes climate_fan_flap{0%,to{transform:translateY(0) rotate(0deg)}50%{transform:translateY(4px) rotate(1.5deg)}}@keyframes climate_fan_wave{0%{opacity:0;transform:translateY(0) scaleX(.65)}22%{opacity:1}to{opacity:0;transform:translateY(40px) scaleX(1.3)}}@keyframes climate_fan_dash{0%{opacity:.15;stroke-dashoffset:36}40%{opacity:1}to{opacity:.1;stroke-dashoffset:-4}}@keyframes climate_fan_swirl{0%{opacity:0;transform:translate(0,0) rotate(0deg)}30%{opacity:.9}to{opacity:0;transform:translate(0,34px) rotate(25deg)}}@keyframes climate_fan_disp{0%,to{opacity:.7}50%{opacity:1}}.climate_fan_frame{animation:climate_fan_pulse 1.7s ease-in-out infinite}.climate_fan_led{animation:climate_fan_led 1.1s ease-in-out infinite}.climate_fan_flap{animation:climate_fan_flap 1.15s ease-in-out infinite;transform-origin:100px 128px}.climate_fan_w1,.climate_fan_w2,.climate_fan_w3{animation:climate_fan_wave 1s ease-out infinite}.climate_fan_w1{transform-origin:100px 142px}.climate_fan_w2{animation-delay:.14s;transform-origin:100px 149px}.climate_fan_w3{animation-delay:.28s;transform-origin:100px 156px}.climate_fan_w4{animation-delay:.42s;transform-origin:100px 163px}.climate_fan_w4,.climate_fan_w5,.climate_fan_w6{animation:climate_fan_wave 1s ease-out infinite}.climate_fan_w5{animation-delay:.56s;transform-origin:100px 170px}.climate_fan_w6{animation-delay:.7s;transform-origin:100px 176px}.climate_fan_d1{animation:climate_fan_dash .8s linear infinite}.climate_fan_d2{animation-delay:.2s}.climate_fan_d2,.climate_fan_d3,.climate_fan_d4{animation:climate_fan_dash .8s linear infinite}.climate_fan_d3{animation-delay:.4s}.climate_fan_d4{animation-delay:.6s}.climate_fan_sw1,.climate_fan_sw2{animation:climate_fan_swirl 1.2s ease-out infinite;transform-origin:55px 145px}.climate_fan_sw2{animation-delay:.4s;transform-origin:145px 145px}.climate_fan_disp{animation:climate_fan_disp 1.5s ease-in-out infinite}
    </style>
  </defs>
  <rect width="156" height="84" x="22" y="58" fill="url(#climate_fan_grad)" class="climate_fan_frame" filter="url(#climate_fan_neon)" rx="30"/>
  <rect width="156" height="84" x="22" y="58" fill="none" stroke="#fff" stroke-width="4" opacity=".9" rx="30"/>
  <rect width="132" height="42" x="34" y="68" fill="#0f1419" rx="6"/>
  <circle cx="48" cy="80" r="3.4" fill="#cbd5e1" class="climate_fan_led"/>
  <circle cx="62" cy="80" r="3.2" fill="#fff" opacity=".9"/>
  <circle cx="76" cy="80" r="3.2" fill="#fff" opacity=".8"/>
  <g class="climate_fan_disp">
    <rect width="24" height="12" x="90" y="88" fill="none" stroke="#cbd5e1" stroke-width="2" rx="3"/>
    <path fill="none" stroke="#e2e8f0" stroke-linecap="round" stroke-width="2.5" d="M96 94h12"/>
  </g>
  <rect width="10" height="4" x="34" y="114" fill="#334155" opacity=".6" rx="1"/>
  <rect width="10" height="4" x="156" y="114" fill="#334155" opacity=".6" rx="1"/>
  <path fill="none" stroke="#fff" stroke-linecap="round" stroke-width="3.5" d="M40 128c32 14 88 14 120 0" class="climate_fan_flap"/>
  <g fill="none" stroke="#e2e8f0" stroke-linecap="round" stroke-width="3.5" filter="url(#climate_fan_mist)">
    <path d="M44 136q56 12 112 0" class="climate_fan_w1"/>
    <path d="M48 142q52 14 104 0" class="climate_fan_w2"/>
    <path d="M54 148q46 16 92 0" class="climate_fan_w3"/>
    <path d="M60 154q40 18 80 0" class="climate_fan_w4"/>
    <path d="M68 160q32 20 64 0" class="climate_fan_w5"/>
    <path d="M76 166q24 20 48 0" class="climate_fan_w6"/>
  </g>
  <g fill="none" stroke="#cbd5e1" stroke-linecap="round" stroke-width="2.2" opacity=".8">
    <path d="M42 138c6 10 20 14 26 4" class="climate_fan_sw1"/>
    <path d="M158 138c-6 10-20 14-26 4" class="climate_fan_sw2"/>
  </g>
  <g fill="none" stroke="#94a3b8" stroke-dasharray="7 7" stroke-linecap="round" stroke-width="2.4">
    <path d="M58 134v44" class="climate_fan_d1"/>
    <path d="M86 136v46" class="climate_fan_d2"/>
    <path d="M114 136v46" class="climate_fan_d3"/>
    <path d="M142 134v44" class="climate_fan_d4"/>
  </g>
</svg>
