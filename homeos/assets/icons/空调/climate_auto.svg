<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="climate_auto_neon" width="160%" height="160%" x="-30%" y="-30%">
      <feGaussianBlur in="SourceGraphic" result="b" stdDeviation="2.4"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="climate_auto_mist" width="200%" height="200%" x="-50%" y="-30%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.6"/>
    </filter>
    <linearGradient id="climate_auto_grad" x1="0%" x2="100%" y1="50%" y2="50%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <style>
      @keyframes climate_auto_pulse{0%,to{opacity:.82}50%{opacity:1}}@keyframes climate_auto_led1{0%,to{fill:#67e8f9;opacity:1}33%{fill:#fdba74;opacity:.85}66%{fill:#f87171;opacity:.9}}@keyframes climate_auto_led2{0%,to{fill:#fdba74;opacity:.9}33%{fill:#f87171;opacity:1}66%{fill:#67e8f9;opacity:.85}}@keyframes climate_auto_led3{0%,to{fill:#f87171;opacity:.85}33%{fill:#67e8f9;opacity:.9}66%{fill:#fdba74;opacity:1}}@keyframes climate_auto_flap{0%,to{transform:translateY(0) rotate(0deg)}50%{transform:translateY(3px) rotate(.8deg)}}@keyframes climate_auto_spray{0%{opacity:0;transform:translateY(0) scaleX(.5) scaleY(.4)}18%{opacity:1}to{opacity:0;transform:translateY(40px) scaleX(1.35) scaleY(1.85)}}@keyframes climate_auto_streak{0%{opacity:0;stroke-dashoffset:28}35%{opacity:.95}to{opacity:0;stroke-dashoffset:-8}}@keyframes climate_auto_a{0%,to{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}.climate_auto_frame{animation:climate_auto_pulse 2s ease-in-out infinite}.climate_auto_l1{animation:climate_auto_led1 2.4s ease-in-out infinite}.climate_auto_l2{animation:climate_auto_led2 2.4s ease-in-out infinite}.climate_auto_l3{animation:climate_auto_led3 2.4s ease-in-out infinite}.climate_auto_flap{animation:climate_auto_flap 1.5s ease-in-out infinite;transform-origin:100px 128px}.climate_auto_s1,.climate_auto_s2{animation:climate_auto_spray 1.25s ease-out infinite}.climate_auto_s1{transform-origin:52px 136px}.climate_auto_s2{animation-delay:.18s;transform-origin:74px 138px}.climate_auto_s3{animation-delay:.36s;transform-origin:96px 140px}.climate_auto_s3,.climate_auto_s4,.climate_auto_s5,.climate_auto_s6{animation:climate_auto_spray 1.25s ease-out infinite}.climate_auto_s4{animation-delay:.54s;transform-origin:118px 140px}.climate_auto_s5{animation-delay:.72s;transform-origin:138px 138px}.climate_auto_s6{animation-delay:.9s;transform-origin:154px 136px}.climate_auto_t1,.climate_auto_t2,.climate_auto_t3{animation:climate_auto_streak 1s linear infinite}.climate_auto_t2{animation-delay:.33s}.climate_auto_t3{animation-delay:.66s}.climate_auto_a{animation:climate_auto_a 1.8s ease-in-out infinite;transform-origin:100px 94px}
    </style>
  </defs>
  <rect width="156" height="84" x="22" y="58" fill="url(#climate_auto_grad)" class="climate_auto_frame" filter="url(#climate_auto_neon)" rx="30"/>
  <rect width="156" height="84" x="22" y="58" fill="none" stroke="#fff" stroke-width="4" opacity=".9" rx="30"/>
  <rect width="132" height="42" x="34" y="68" fill="#0a0a0a" rx="6"/>
