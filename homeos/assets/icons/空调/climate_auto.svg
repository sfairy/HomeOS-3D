  <circle cx="62" cy="80" r="3.4" fill="#fdba74" class="climate_auto_l2"/>
  <circle cx="76" cy="80" r="3.4" fill="#f87171" class="climate_auto_l3"/>
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" class="climate_auto_a">
    <path d="m92 104 8-20 8 20"/>
    <path d="M95 96h10"/>
  </g>
  <rect width="10" height="4" x="34" y="114" fill="#111" opacity=".6" rx="1"/>
  <rect width="10" height="4" x="156" y="114" fill="#111" opacity=".6" rx="1"/>
  <path fill="none" stroke="#fff" stroke-linecap="round" stroke-width="3.5" d="M40 128c32 14 88 14 120 0" class="climate_auto_flap"/>
  <g filter="url(#climate_auto_mist)">
    <ellipse cx="52" cy="136" fill="#67e8f9" class="climate_auto_s1" rx="8" ry="5"/>
    <ellipse cx="74" cy="138" fill="#a5f3fc" class="climate_auto_s2" rx="8" ry="5.5"/>
    <ellipse cx="96" cy="140" fill="#fdba74" class="climate_auto_s3" rx="9" ry="6"/>
    <ellipse cx="118" cy="140" fill="#fb923c" class="climate_auto_s4" rx="9" ry="6"/>
    <ellipse cx="138" cy="138" fill="#f87171" class="climate_auto_s5" rx="8" ry="5.5"/>
    <ellipse cx="154" cy="136" fill="#fca5a5" class="climate_auto_s6" rx="6" ry="4.5"/>
  </g>
  <g fill="none" stroke-dasharray="5 9" stroke-linecap="round" stroke-width="2.2" opacity=".9">
    <path stroke="#67e8f9" d="M62 134v42" class="climate_auto_t1"/>
    <path stroke="#fdba74" d="M100 136v44" class="climate_auto_t2"/>
    <path stroke="#f87171" d="M138 134v42" class="climate_auto_t3"/>
