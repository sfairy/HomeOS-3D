<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="lock_locking_panel" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="lock_locking_metal" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="lock_locking_handle" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="lock_locking_bg" cx="28%" cy="24%" r="72%" fx="22%" fy="18%">
      <stop offset="0%" stop-color="#fff" stop-opacity=".2"/>
      <stop offset="45%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>
    <style>
      @keyframes bolt-out{0%{transform:translateX(0)}to{transform:translateX(10px)}}@keyframes led-blink{0%,to{opacity:.45}50%{opacity:1}}.bolt{animation:bolt-out 1s ease-in-out infinite alternate}.led{animation:led-blink .9s ease-in-out infinite}
    </style>
  </defs>
  <circle cx="100" cy="100" r="87" fill="url(#lock_locking_bg)"/>
