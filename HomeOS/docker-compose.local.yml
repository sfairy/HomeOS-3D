# 本地开发：将 Docker 内网 postgres/redis 映射到宿主机，供 bun run dev:backend 连接。
# 用法：docker compose -f docker-compose.yml -f docker-compose.local.yml up -d postgres redis
# 或：bun run dev:db
# 口令：未设置时全新卷自动写入 ./secrets/；backend/.env 的 DATABASE_URL / REDIS_URL 须与之一致
# 已有数据卷请继续用原 POSTGRES_PASSWORD，或把口令写入 ./secrets/postgres_password

services:
  postgres:
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
