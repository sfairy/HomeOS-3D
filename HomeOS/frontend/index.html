<!doctype html>
<html lang="zh-Hans">

<head>
  <meta charset="UTF-8" />

  <!-- PWA / Standalone (iPad Add to Home Screen) -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HomeOS" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />

  <!-- Viewport: scale=1, no user scaling (kiosk-style) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <link rel="icon" type="image/svg+xml" href="/logo/logo.svg" />
  <title>HomeOS智能家居控制系统</title>

  <!-- Remove tap highlight on iOS -->
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000000;
    }
  </style>

</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
