<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="lock_unlocking_panel" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="lock_unlocking_metal" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="lock_unlocking_handle" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="lock_unlocking_bg" cx="28%" cy="24%" r="72%" fx="22%" fy="18%">
      <stop offset="0%" stop-color="#fff" stop-opacity=".2"/>
      <stop offset="45%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065f46"/>
    </radialGradient>
    <style>
      @keyframes bolt-in{0%{transform:translateX(0)}to{transform:translateX(-8px)}}@keyframes led-glow{0%,to{opacity:.5}50%{opacity:1}}@keyframes handle-tilt{0%{transform:rotate(0deg)}to{transform:rotate(-14deg)}}.bolt{animation:bolt-in 1s ease-in-out infinite alternate}.led{animation:led-glow .9s ease-in-out infinite}.handle{animation:handle-tilt 1.2s ease-in-out infinite alternate;transform-origin:100px 159px}
    </style>
  </defs>
  <circle cx="100" cy="100" r="87" fill="url(#lock_unlocking_bg)"/>
  <g class="bolt">
    <rect width="16" height="14" x="146" y="98" fill="#a7f3d0" rx="2"/>
    <rect width="12" height="3" x="148" y="101" fill="#065f46" rx="1"/>
  </g>
  <rect width="76" height="132" x="62" y="34" fill="url(#lock_unlocking_panel)" rx="14"/>
  <ellipse cx="82" cy="48" fill="#fff" opacity=".8" rx="14" ry="5"/>
  <rect width="52" height="6" x="74" y="42" fill="#22c55e" class="led" rx="3"/>
  <circle cx="100" cy="60" r="8" fill="#1e293b"/>
  <circle cx="100" cy="60" r="5" fill="#334155"/>
  <circle cx="97" cy="57" r="1.8" fill="#334155"/>
  <g fill="#475569">
    <circle cx="84" cy="80" r="4.2"/>
    <circle cx="100" cy="80" r="4.2"/>
    <circle cx="116" cy="80" r="4.2"/>
    <circle cx="84" cy="94" r="4.2"/>
    <circle cx="100" cy="94" r="4.2"/>
    <circle cx="116" cy="94" r="4.2"/>
    <circle cx="84" cy="108" r="4.2"/>
    <circle cx="100" cy="108" r="4.2"/>
    <circle cx="116" cy="108" r="4.2"/>
    <circle cx="84" cy="122" r="4.2"/>
    <circle cx="100" cy="122" r="4.2"/>
    <circle cx="116" cy="122" r="4.2"/>
  </g>
  <ellipse cx="100" cy="140" fill="url(#lock_unlocking_metal)" rx="16" ry="12"/>
  <ellipse cx="100" cy="140" fill="#064e3b" rx="11" ry="8"/>
  <path fill="none" stroke="#34d399" stroke-linecap="round" stroke-width="1.4" d="M94 138q6-4 12 0m-13 4q7-5 14 0m-12 3q5-4 10 0"/>
  <g class="handle">
    <rect width="60" height="10" x="70" y="154" fill="url(#lock_unlocking_handle)" rx="5"/>
    <circle cx="100" cy="159" r="5" fill="#475569"/>
    <circle cx="98" cy="157" r="1.5" fill="#334155"/>
  </g>
  <circle cx="135" cy="54" r="10" fill="none" stroke="#a7f3d0" stroke-dasharray="12 8" stroke-width="3" class="led"/>
  <circle cx="100" cy="100" r="87" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="2.5"/>
</svg>
