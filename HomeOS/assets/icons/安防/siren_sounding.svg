<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="siren_sounding_bg" cx="28%" cy="24%" r="72%" fx="22%" fy="18%">
      <stop offset="0%" stop-color="#fff" stop-opacity=".2"/>
      <stop offset="45%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </radialGradient>
    <radialGradient id="siren_sounding_dome" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fecdd3"/>
      <stop offset="40%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </radialGradient>
    <linearGradient id="siren_sounding_body" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
    <style>
      @keyframes strobe{0%,to{opacity:.35}50%{opacity:1}}@keyframes wave{0%,to{opacity:.2}50%{opacity:1}}@keyframes pulse-dome{0%,to{transform:scale(1)}50%{transform:scale(1.04)}}.strobe{animation:strobe .45s ease-in-out infinite}.w1,.w2,.w3{animation:wave .7s ease-in-out infinite}.w2{animation-delay:.15s}.w3{animation-delay:.3s}.dome{animation:pulse-dome .55s ease-in-out infinite;transform-origin:100px 68px}
    </style>
  </defs>
  <circle cx="100" cy="100" r="87" fill="url(#siren_sounding_bg)"/>
  <path fill="none" stroke="#fda4af" stroke-linecap="round" stroke-width="6" d="M148 78a34 34 0 0 1 0 56" class="w1"/>
  <path fill="none" stroke="#fecdd3" stroke-linecap="round" stroke-width="5" d="M160 66a50 50 0 0 1 0 80" class="w2"/>
  <path fill="none" stroke="#fda4af" stroke-linecap="round" stroke-width="6" d="M52 78a34 34 0 0 0 0 56" class="w3"/>
  <path fill="none" stroke="#fecdd3" stroke-linecap="round" stroke-width="5" d="M40 66a50 50 0 0 0 0 80" class="w1" style="animation-delay:.2s"/>
  <rect width="84" height="14" x="58" y="148" fill="#fff" opacity=".9" rx="4"/>
  <circle cx="72" cy="155" r="3" fill="#9f1239"/>
  <circle cx="128" cy="155" r="3" fill="#9f1239"/>
  <rect width="92" height="56" x="54" y="96" fill="url(#siren_sounding_body)" rx="12"/>
  <ellipse cx="78" cy="106" fill="#fff" opacity=".8" rx="18" ry="5"/>
  <circle cx="100" cy="122" r="18" fill="none" stroke="#be123c" stroke-width="3"/>
  <circle cx="100" cy="122" r="11" fill="none" stroke="#be123c" stroke-width="2.5"/>
  <circle cx="100" cy="122" r="5" fill="#fde68a" class="strobe"/>
  <g class="dome">
    <ellipse cx="100" cy="68" fill="url(#siren_sounding_dome)" class="strobe" rx="36" ry="32"/>
    <ellipse cx="88" cy="56" fill="#fff" opacity=".5" rx="12" ry="8"/>
    <ellipse cx="100" cy="62" fill="#fde68a" class="strobe" rx="12" ry="9"/>
    <ellipse cx="100" cy="96" fill="#fff" rx="38" ry="8"/>
    <ellipse cx="100" cy="98" fill="#fecdd3" rx="34" ry="5"/>
    <circle cx="132" cy="108" r="5" fill="#fde68a" class="strobe"/>
  </g>
  <circle cx="100" cy="100" r="87" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="2.5"/>
</svg>
