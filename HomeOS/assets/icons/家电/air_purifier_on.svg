<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="ap_on_b" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="55%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="ap_on_t" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="ap_soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <style>
      @keyframes ap_rise{
        0%{opacity:0;transform:translate(0,4px) scale(.55)}
        18%{opacity:.9}
        70%{opacity:.55}
        to{opacity:0;transform:translate(0,-28px) scale(1.35)}
      }
      @keyframes ap_vent{0%,to{opacity:.35}50%{opacity:.85}}
      @keyframes ap_led{0%,to{opacity:.7}50%{opacity:1}}
      .ap_p1{animation:ap_rise 2.4s cubic-bezier(.22,.61,.36,1) infinite;transform-origin:88px 28px}
      .ap_p2{animation:ap_rise 2.4s cubic-bezier(.22,.61,.36,1) infinite;animation-delay:.55s;transform-origin:100px 22px}
      .ap_p3{animation:ap_rise 2.4s cubic-bezier(.22,.61,.36,1) infinite;animation-delay:1.1s;transform-origin:112px 28px}
      .ap_p4{animation:ap_rise 2.4s cubic-bezier(.22,.61,.36,1) infinite;animation-delay:1.65s;transform-origin:100px 30px}
      .ap_vent{animation:ap_vent 2.2s ease-in-out infinite}
      .ap_led{animation:ap_led 2.4s ease-in-out infinite}
    </style>
  </defs>
  <ellipse cx="100" cy="174" fill="#bae6fd" opacity=".55" rx="42" ry="8"/>
  <rect width="78" height="132" x="61" y="36" fill="url(#ap_on_b)" rx="18"/>
  <ellipse cx="100" cy="36" fill="url(#ap_on_t)" rx="34" ry="11"/>
  <ellipse cx="100" cy="34" fill="#7dd3fc" rx="20" ry="5"/>
  <ellipse cx="84" cy="54" fill="#fff" opacity=".85" rx="12" ry="6"/>
  <rect width="46" height="16" x="77" y="58" fill="#0369a1" rx="5"/>
  <rect width="28" height="7" x="82" y="62" fill="#7dd3fc" rx="2"/>
  <circle cx="116" cy="66" r="3" fill="#22c55e" class="ap_led"/>
  <path fill="#0284c7" d="M67 88h8v60H67a4 4 0 0 1-4-4V92a4 4 0 0 1 4-4z" class="ap_vent"/>
  <path fill="#0284c7" d="M125 88h8a4 4 0 0 1 4 4v52a4 4 0 0 1-4 4h-8z" class="ap_vent"/>
  <g fill="none" stroke="#bae6fd" stroke-linecap="round" stroke-width="2">
    <path d="M71 98v40"/><path d="M129 98v40"/>
  </g>
  <g fill="#0284c7" opacity=".45" class="ap_vent">
    <rect width="36" height="3" x="82" y="96" rx="1.5"/>
    <rect width="36" height="3" x="82" y="108" rx="1.5"/>
    <rect width="36" height="3" x="82" y="120" rx="1.5"/>
    <rect width="36" height="3" x="82" y="132" rx="1.5"/>
  </g>
  <g filter="url(#ap_soft)">
    <ellipse cx="88" cy="28" fill="#7dd3fc" class="ap_p1" rx="5" ry="4"/>
    <ellipse cx="100" cy="22" fill="#bae6fd" class="ap_p2" rx="7" ry="5"/>
    <ellipse cx="112" cy="28" fill="#38bdf8" class="ap_p3" rx="5" ry="4"/>
    <ellipse cx="100" cy="30" fill="#e0f2fe" class="ap_p4" rx="4" ry="3"/>
  </g>
  <rect width="54" height="7" x="73" y="160" fill="#38bdf8" rx="3.5"/>
</svg>
