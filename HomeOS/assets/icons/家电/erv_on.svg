<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="erv_on_b" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="erv_on_m" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <style>
      @keyframes erv_dash{to{stroke-dashoffset:-40}}
      @keyframes erv_spin{to{transform:rotate(360deg)}}
      @keyframes erv_led{0%,to{opacity:.72}50%{opacity:1}}
      .erv_in{animation:erv_dash 1.4s linear infinite;stroke-dasharray:10 8}
      .erv_out{animation:erv_dash 1.4s linear infinite reverse;stroke-dasharray:10 8}
      .erv_fan{animation:erv_spin 1.1s linear infinite;transform-origin:100px 105px}
      .erv_led{animation:erv_led 2.4s ease-in-out infinite}
    </style>
  </defs>
  <ellipse cx="100" cy="158" fill="#99f6e4" opacity=".5" rx="70" ry="10"/>
  <rect width="22" height="36" x="26" y="82" fill="url(#erv_on_m)" rx="6"/>
  <rect width="22" height="36" x="152" y="82" fill="url(#erv_on_m)" rx="6"/>
  <ellipse cx="37" cy="92" fill="#5eead4" rx="5" ry="6"/>
  <ellipse cx="37" cy="108" fill="#99f6e4" rx="5" ry="6"/>
  <ellipse cx="163" cy="92" fill="#99f6e4" rx="5" ry="6"/>
  <ellipse cx="163" cy="108" fill="#5eead4" rx="5" ry="6"/>
  <rect width="116" height="78" x="42" y="60" fill="url(#erv_on_b)" rx="14"/>
  <ellipse cx="64" cy="74" fill="#fff" opacity=".85" rx="14" ry="5"/>
  <circle cx="140" cy="74" r="4.5" fill="#22c55e" class="erv_led"/>
  <rect width="84" height="42" x="58" y="84" fill="#134e4a" opacity=".4" rx="8"/>
  <g class="erv_fan">
    <ellipse cx="100" cy="89" fill="#5eead4" rx="7" ry="16"/>
    <ellipse cx="100" cy="121" fill="#5eead4" rx="7" ry="16"/>
    <ellipse cx="84" cy="105" fill="#14b8a6" rx="16" ry="7"/>
    <ellipse cx="116" cy="105" fill="#14b8a6" rx="16" ry="7"/>
  </g>
  <circle cx="100" cy="105" r="7" fill="#134e4a"/>
  <circle cx="100" cy="105" r="3" fill="#99f6e4"/>
  <path fill="#5eead4" d="M48 78h20l-5-8Z"/>
  <path fill="#5eead4" d="M152 78h-20l5-8Z"/>
  <path fill="#99f6e4" d="M152 120h-20l5 8Z"/>
  <path fill="#99f6e4" d="M48 120h20l-5 8Z"/>
  <g fill="none" stroke="#38bdf8" stroke-linecap="round" stroke-width="4" opacity=".9">
    <path class="erv_in" d="M34 72h32"/>
    <path class="erv_in" d="M134 72h32"/>
  </g>
  <g fill="none" stroke="#fbbf24" stroke-linecap="round" stroke-width="4" opacity=".9">
    <path class="erv_out" d="M166 128h-32"/>
    <path class="erv_out" d="M66 128H34"/>
  </g>
</svg>
