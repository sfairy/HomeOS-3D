<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="climate_dry_neon" width="160%" height="160%" x="-30%" y="-30%">
      <feGaussianBlur in="SourceGraphic" result="b" stdDeviation="2.5"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="climate_dry_mist" width="200%" height="200%" x="-50%" y="-30%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.3"/>
    </filter>
    <linearGradient id="climate_dry_grad" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <style>
      @keyframes climate_dry_pulse{0%,to{opacity:.86}50%{opacity:1}}@keyframes climate_dry_led{0%,to{opacity:.5}50%{opacity:1}}@keyframes climate_dry_flap{0%,to{transform:translateY(0) rotate(0deg)}50%{transform:translateY(2.5px) rotate(-.8deg)}}@keyframes climate_dry_drop{0%{opacity:0;transform:translateY(0) scale(.55)}18%{opacity:1}to{opacity:0;transform:translateY(40px) scale(1.1)}}@keyframes climate_dry_spray{0%{opacity:0;transform:translateY(0) scaleX(.55)}22%{opacity:.9}to{opacity:0;transform:translateY(32px) scaleX(1.4)}}@keyframes climate_dry_ripple{0%{opacity:.8;transform:scaleX(.4)}to{opacity:0;transform:scaleX(1.6) translateY(8px)}}@keyframes climate_dry_vapor{0%{opacity:0;transform:translateY(0) scale(.7)}30%{opacity:.7}to{opacity:0;transform:translateY(-18px) scale(1.3)}}@keyframes climate_dry_disp{0%,to{opacity:.65}50%{opacity:1}}.climate_dry_frame{animation:climate_dry_pulse 2s ease-in-out infinite}.climate_dry_led{animation:climate_dry_led 1.5s ease-in-out infinite}.climate_dry_flap{animation:climate_dry_flap 1.6s ease-in-out infinite;transform-origin:100px 128px}.climate_dry_d1,.climate_dry_d2,.climate_dry_d3{animation:climate_dry_drop 1.2s ease-in infinite}.climate_dry_d1{transform-origin:52px 146px}.climate_dry_d2{animation-delay:.15s;transform-origin:70px 149px}.climate_dry_d3{animation-delay:.3s;transform-origin:88px 151px}.climate_dry_d4{animation-delay:.45s;transform-origin:100px 153px}.climate_dry_d4,.climate_dry_d5,.climate_dry_d6,.climate_dry_d7{animation:climate_dry_drop 1.2s ease-in infinite}.climate_dry_d5{animation-delay:.6s;transform-origin:112px 151px}.climate_dry_d6{animation-delay:.75s;transform-origin:130px 149px}.climate_dry_d7{animation-delay:.9s;transform-origin:148px 146px}.climate_dry_s1,.climate_dry_s2,.climate_dry_s3{animation:climate_dry_spray 1.35s ease-out infinite}.climate_dry_s1{transform-origin:70px 136px}.climate_dry_s2{animation-delay:.35s;transform-origin:100px 138px}.climate_dry_s3{animation-delay:.7s;transform-origin:130px 136px}.climate_dry_r1,.climate_dry_r2{animation:climate_dry_ripple 1.2s ease-out infinite;animation-delay:.35s;transform-origin:80px 175px}.climate_dry_r2{animation-delay:.7s;transform-origin:120px 175px}.climate_dry_v1,.climate_dry_v2{animation:climate_dry_vapor 2s ease-out infinite}.climate_dry_v2{animation-delay:.7s}.climate_dry_disp{animation:climate_dry_disp 1.8s ease-in-out infinite}
    </style>
  </defs>
  <rect width="156" height="84" x="22" y="58" fill="url(#climate_dry_grad)" class="climate_dry_frame" filter="url(#climate_dry_neon)" rx="30"/>
  <rect width="156" height="84" x="22" y="58" fill="none" stroke="#fff" stroke-width="4" opacity=".9" rx="30"/>
  <rect width="132" height="42" x="34" y="68" fill="#1a1205" rx="6"/>
  <circle cx="48" cy="80" r="3.4" fill="#fcd34d" class="climate_dry_led"/>
  <circle cx="62" cy="80" r="3.2" fill="#fff" opacity=".9"/>
  <circle cx="76" cy="80" r="3.2" fill="#fff" opacity=".8"/>
  <g class="climate_dry_disp">
    <rect width="24" height="12" x="90" y="88" fill="none" stroke="#fcd34d" stroke-width="2" rx="3"/>
    <path fill="none" stroke="#fef3c7" stroke-linecap="round" stroke-width="2.5" d="M96 94h12"/>
  </g>
  <rect width="10" height="4" x="34" y="114" fill="#92400e" opacity=".5" rx="1"/>
  <rect width="10" height="4" x="156" y="114" fill="#92400e" opacity=".5" rx="1"/>
  <path fill="none" stroke="#fff" stroke-linecap="round" stroke-width="3.5" d="M40 128c32 14 88 14 120 0" class="climate_dry_flap"/>
  <g filter="url(#climate_dry_mist)">
    <ellipse cx="70" cy="136" fill="#fef3c7" class="climate_dry_s1" opacity=".8" rx="18" ry="4"/>
    <ellipse cx="100" cy="138" fill="#fde68a" class="climate_dry_s2" opacity=".8" rx="22" ry="4.5"/>
    <ellipse cx="130" cy="136" fill="#fbbf24" class="climate_dry_s3" opacity=".8" rx="18" ry="4"/>
  </g>
  <g fill="#fde68a" opacity=".5">
    <ellipse cx="78" cy="118" class="climate_dry_v1" rx="10" ry="3"/>
    <ellipse cx="122" cy="118" class="climate_dry_v2" rx="10" ry="3"/>
  </g>
  <path fill="#fffbeb" d="M52 138s-6 10 0 16c6-6 0-16 0-16" class="climate_dry_d1"/>
  <path fill="#fef3c7" d="M70 140s-7 12 0 18c7-6 0-18 0-18" class="climate_dry_d2"/>
  <path fill="#fde68a" d="M88 142s-8 12 0 18c8-6 0-18 0-18" class="climate_dry_d3"/>
  <path fill="#fbbf24" d="M100 144s-9 12 0 18c9-6 0-18 0-18" class="climate_dry_d4"/>
  <path fill="#fde68a" d="M112 142s-8 12 0 18c8-6 0-18 0-18" class="climate_dry_d5"/>
  <path fill="#fef3c7" d="M130 140s-7 12 0 18c7-6 0-18 0-18" class="climate_dry_d6"/>
  <path fill="#fffbeb" d="M148 138s-6 10 0 16c6-6 0-16 0-16" class="climate_dry_d7"/>
  <g fill="none" stroke="#fcd34d" stroke-linecap="round" stroke-width="1.8" opacity=".7">
    <ellipse cx="80" cy="175" class="climate_dry_r1" rx="10" ry="3"/>
    <ellipse cx="120" cy="175" class="climate_dry_r2" rx="10" ry="3"/>
  </g>
</svg>
