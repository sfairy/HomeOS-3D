<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="smoke_sensor_on_bg" cx="28%" cy="24%" r="72%" fx="22%" fy="18%">
      <stop offset="0%" stop-color="#fff" stop-opacity=".2"/>
      <stop offset="45%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <linearGradient id="smoke_sensor_on_body" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
    <style>
      @keyframes smoke{0%,to{opacity:.25;transform:translateY(0)}50%{opacity:.9;transform:translateY(-10px)}}@keyframes strobe{0%,to{opacity:.4}50%{opacity:1}}.s1,.s2,.s3{animation:smoke 1.5s ease-in-out infinite}.s2{animation-delay:.35s}.s3{animation-delay:.7s}.led{animation:strobe .55s ease-in-out infinite}
    </style>
  </defs>
  <circle cx="100" cy="100" r="87" fill="url(#smoke_sensor_on_bg)"/>
  <path fill="none" stroke="#fecaca" stroke-linecap="round" stroke-width="5" d="M70 158q8-28 0-48" class="s1"/>
  <path fill="none" stroke="#fee2e2" stroke-linecap="round" stroke-width="6" d="M100 164q10-32 0-56" class="s2"/>
  <path fill="none" stroke="#fecaca" stroke-linecap="round" stroke-width="5" d="M130 158q-8-28 0-48" class="s3"/>
  <!-- 与 off 同底图 -->
  <ellipse cx="100" cy="58" fill="#fff" rx="40" ry="10"/>
  <ellipse cx="100" cy="84" fill="url(#smoke_sensor_on_body)" rx="52" ry="36"/>
  <ellipse cx="100" cy="78" fill="#fecaca" rx="36" ry="22"/>
  <ellipse cx="86" cy="72" fill="#fff" opacity=".6" rx="12" ry="6"/>
  <circle cx="100" cy="84" r="14" fill="#991b1b"/>
  <circle cx="100" cy="84" r="6" fill="#fde68a" class="led"/>
  <circle cx="130" cy="96" r="5" fill="#dc2626"/>
  <circle cx="100" cy="100" r="87" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="2.5"/>
</svg>
