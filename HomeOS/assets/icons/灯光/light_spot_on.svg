<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="light_spot_on_lens" cx="38%" cy="28%" r="62%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <linearGradient id="light_spot_on_cone" x1="50%" x2="50%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity=".88"/>
      <stop offset="28%" stop-color="#fde68a" stop-opacity=".55"/>
      <stop offset="70%" stop-color="#fbbf24" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="light_spot_on_core" x1="50%" x2="50%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".7"/>
      <stop offset="50%" stop-color="#fef08a" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </linearGradient>
    <filter id="light_spot_on_glow" width="180%" height="160%" x="-40%" y="-20%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="light_spot_on_soft" width="180%" height="160%" x="-40%" y="-20%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <style>
      @keyframes cone{0%,to{opacity:.42}50%{opacity:1}}
      @keyframes lens{0%,to{opacity:.88}50%{opacity:1}}
      @keyframes core{0%,to{opacity:.35}50%{opacity:.75}}
      .cone{animation:cone 2s ease-in-out infinite}
      .lens{animation:lens 2s ease-in-out infinite}
      .core{animation:core 2s ease-in-out infinite}
    </style>
  </defs>
  <circle cx="100" cy="100" r="87" fill="#f1f5f9"/>
  <path fill="url(#light_spot_on_cone)" d="M64 116 L30 180 L170 180 Z" class="cone" filter="url(#light_spot_on_soft)"/><path fill="url(#light_spot_on_core)" d="M80 118 L60 170 L140 170 Z" class="core"/><ellipse cx="100" cy="178" fill="#fff" class="cone" opacity=".55" rx="60" ry="10"/><ellipse cx="100" cy="178" fill="#fde68a" class="core" opacity=".35" filter="url(#light_spot_on_soft)" rx="34" ry="6"/>
  <!-- 与 off 同底图 -->
  <g transform="translate(100 108) scale(1.06) translate(-100 -100)">
    <ellipse cx="100" cy="48" fill="#64748b" opacity=".8" rx="58" ry="10"/>
    <ellipse cx="100" cy="58" fill="#334155" rx="50" ry="16"/>
    <ellipse cx="100" cy="58" fill="#0f172a" rx="34" ry="10"/>
    <circle cx="78" cy="56" r="2" fill="#334155"/>
    <circle cx="122" cy="56" r="2" fill="#334155"/>
    <path fill="#475569" d="m64 58 6 54q30 14 60 0l6-54q-36 12-72 0"/>
    <ellipse cx="88" cy="74" fill="#94a3b8" opacity=".55" rx="6" ry="10"/>
    <ellipse cx="100" cy="112" fill="#fbbf24" class="lens" opacity=".45" filter="url(#light_spot_on_soft)" rx="38" ry="13"/><ellipse cx="100" cy="112" fill="url(#light_spot_on_lens)" class="lens" filter="url(#light_spot_on_glow)" rx="38" ry="13"/><ellipse cx="100" cy="110" fill="#fff" class="lens" opacity=".95" rx="18" ry="5"/>
  </g>
  <circle cx="100" cy="100" r="87" fill="none" stroke="#0f172a" stroke-opacity=".1" stroke-width="2.5"/>
</svg>
