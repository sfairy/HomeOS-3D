<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="cam_stream_body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="55%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <radialGradient id="cam_stream_glass" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="55%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </radialGradient>
    <linearGradient id="cam_stream_mount" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <style>
      @keyframes cam_stream_pulse{0%,to{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
      @keyframes cam_stream_wifi{0%,to{opacity:.25}50%{opacity:.95}}
      @keyframes cam_stream_led{0%,to{opacity:.5}50%{opacity:1}}
      .cam_stream_core{animation:cam_stream_pulse 1.4s ease-in-out infinite;transform-origin:124px 100px}
      .cam_stream_wifi{animation:cam_stream_wifi 1.6s ease-in-out infinite}
      .cam_stream_wifi2{animation-delay:.28s}
      .cam_stream_led{animation:cam_stream_led 1.2s ease-in-out infinite}
    </style>
  </defs>
  <ellipse cx="112" cy="178" fill="#7dd3fc" opacity=".45" rx="56" ry="8"/>
  <rect width="14" height="64" x="34" y="68" fill="url(#cam_stream_mount)" rx="4"/>
  <rect width="6" height="18" x="38" y="78" fill="#7dd3fc" rx="2"/>
  <rect width="6" height="18" x="38" y="104" fill="#7dd3fc" rx="2"/>
  <path fill="url(#cam_stream_mount)" d="M48 94h22a6 6 0 0 1 6 6v0a6 6 0 0 1-6 6H48z"/>
  <rect width="112" height="88" x="68" y="56" fill="url(#cam_stream_body)" rx="18"/>
  <ellipse cx="88" cy="72" fill="#fff" opacity=".8" rx="22" ry="10"/>
  <rect width="88" height="7" x="80" y="64" fill="#0284c7" rx="2.5"/>
  <circle cx="124" cy="100" r="30" fill="#0369a1"/>
  <circle cx="124" cy="100" r="22" fill="url(#cam_stream_glass)"/>
  <ellipse cx="116" cy="92" fill="#7dd3fc" opacity=".55" rx="7" ry="4"/>
  <circle cx="124" cy="100" r="10" fill="#22d3ee" class="cam_stream_core"/>
  <circle cx="124" cy="100" r="3.5" fill="#fff"/>
  <circle cx="88" cy="80" r="3.5" fill="#38bdf8"/>
  <circle cx="160" cy="80" r="3.5" fill="#38bdf8"/>
  <circle cx="164" cy="128" r="5" fill="#22d3ee" class="cam_stream_led"/>
  <g fill="none" stroke="#38bdf8" stroke-linecap="round">
    <path stroke-width="3.5" d="M158 48a28 28 0 0 1 22 18" class="cam_stream_wifi"/>
    <path stroke-width="3" d="M154 58a18 18 0 0 1 14 12" class="cam_stream_wifi cam_stream_wifi2"/>
  </g>
</svg>
